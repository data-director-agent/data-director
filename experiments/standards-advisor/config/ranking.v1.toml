# Ranking rule weights — §5.3.
#
# The version is the filename stem. A new weighting is a NEW FILE, never an edit to this
# one, so that a change to the ranking is a visible, attributed, repeatable event and an
# old run record stays resolvable. The version and this file's sha256 are recorded with
# every run.
#
# The rule bodies are not implemented at v0.1 (see src/standards_advisor/ranking/rules.py).
# The weights, the rule names and the skip-don't-score-zero contract are.

version = "ranking.v1"

# §5.5 check 3. Candidates below this are kept out of the main list.
confidence_floor = 0.55

[weights]
subject_overlap = 1.0           # the main signal
field_of_research_overlap = 0.8 # separates records within the same broad subject
entity_scope_overlap = 0.8      # separates records within the same field of research
community_uptake = 0.6          # data policies, adopter count, registry collections
repository_fit = 0.4            # recommended or in use by the target repository
maturity = 0.5                  # record status and how recently it was updated
specificity = 0.5               # aimed at the "the output will be generic" failure
openness = 0.3                  # licence and access conditions of the resource itself
type_match = 1.0                # R3.4 only; almost entirely mechanical

# Applied on top of the weighted score rather than as a rule (§5.3: "deprecated gets a
# heavy penalty and a flag saying why").
[penalties]
deprecated = 0.6
