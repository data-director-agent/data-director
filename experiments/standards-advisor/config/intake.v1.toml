# Intake questions — §8, the `elicit` stage.
#
# The version is the filename stem. A new question set is a NEW FILE, never an edit to this
# one, so that a change to what researchers are asked is a visible, attributed, repeatable
# event and an old run record stays resolvable to the questions actually put. The version and
# this file's sha256 are recorded with every run (R10).
#
# Two constraints on anything added here.
#
# 1. Every question needs a `facet` that something maps onto a profile field. The loader
#    rejects an unknown one rather than accepting a question whose answer goes nowhere.
#
# 2. **These are free-text answers, and they are not controlled terms.** §5.1 tier 2 was meant
#    to obtain subject, field of research and entity scope by having a model pick from the
#    registry's own lists. It cannot: with the default registry route `list_terms()` raises, so
#    there is no list to pick from. Every answer here is therefore recorded as a `Term` with
#    `list_name = None` and `derivation = researcher_answer`, and R3.5 depends on that
#    remaining visible. When a registry route exists, these questions should offer the
#    registry's terms as choices — which is a change to this file, not to the node.
#
# `why` is shown to the researcher. §8.2 of the Blueprint: "The workflow belongs to the
# researcher; the Data Director's role is to assist, recommend, and flag, not to direct or
# control." A question that cannot say why it is being asked has no business being asked.
#
# Answering nothing is permitted for every question. A skipped answer is recorded as skipped,
# not as absent — "I do not know what field of research this is" is information, and the
# ranking rules already skip a missing input rather than scoring it zero.

version = "intake.v1"

[[question]]
id = "subject"
facet = "subject"
text = "What subject areas does this project belong to?"
why = """Subject is the main signal for finding vocabularies and ontologies at all. With no data
to inspect, it is the one thing that cannot be guessed."""
example = "environmental science, soil science"

[[question]]
id = "field_of_research"
facet = "field_of_research"
text = "More specifically, what field of research is this within that subject?"
why = """Separates resources within the same broad subject. Two environmental science projects
can need entirely different vocabularies."""
example = "soil chemistry"

[[question]]
id = "entity_scope"
facet = "entity_scope"
text = "What kinds of thing will the values in your dataset name?"
why = """This is what separates a vocabulary covering the right subject from one covering the
right subject and the right kind of value. Organisms, places, chemical substances, occupations,
materials and instruments all have their own vocabularies."""
example = "soil horizons, land-use classes, chemical analytes"

[[question]]
id = "measured_variables"
facet = "measured_variable"
text = "What will you measure or record?"
why = """Widens the search for an ontology to align your variables to. R5 lists variable
definitions among the things that cannot be inferred and have to be asked for."""
example = "pH, organic carbon, total nitrogen"

[[question]]
id = "collection_method"
facet = "collection_method"
text = "How will the data be collected — instrument, assay, survey, or method?"
why = """Many disciplines have reporting guidelines tied to a collection method rather than to a
subject, and R5 names data collection procedures as researcher-supplied."""
example = "field sampling with a soil auger, laboratory titration"

[[question]]
id = "study_design"
facet = "study_design"
text = "What is the study design?"
why = """R5 names study design details as something only you can supply. It affects which
reporting guidelines apply."""
example = "stratified random sampling across three land-use classes"

[[question]]
id = "formats_planned"
facet = "format_planned"
text = "What file formats do you plan to write the data in?"
why = """Recommending an open format is cheapest now, before anything has been written. If you
plan to work in a proprietary format, this is the point at which changing course is free."""
example = "xlsx, csv"

[[question]]
id = "target_repository"
facet = "target_repository"
text = "Where do you intend to deposit the data, if you have decided?"
why = """The repository determines the metadata schema and vocabularies you will have to use, so
it is worth knowing early. The Blueprint puts repository selection before metadata creation for
this reason. Leave this blank if it is undecided — that is a normal answer at this stage."""
multiple = false
example = "ORDA (University of Sheffield), Zenodo"
