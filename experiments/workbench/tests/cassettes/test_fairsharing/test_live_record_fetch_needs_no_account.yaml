        for attribution.","id":399,"name":"AGROVOC","registry":"Standard","type":"terminology_artefact","abbreviation":"AGROVOC","metadata":{"doi":"10.25504/FAIRsharing.anpj91","name":"AGROVOC","status":"ready","contacts":[{"contact_name":"General
        contact","contact_email":"agrovoc@fao.org"}],"homepage":"https://www.fao.org/agrovoc/","citations":[{"doi":"https://doi.org/10.3390/engproc2021009017","pubmed_id":null,"publication_id":3152},{"doi":"https://doi.org/10.4060/cb2838en","pubmed_id":null,"publication_id":3154},{"doi":"10.1016/j.compag.2020.105965","pubmed_id":null,"publication_id":3312}],"identifier":399,"description":"AGROVOC
        is a controlled vocabulary covering all areas of interest of the Food and
        Agriculture Organization (FAO) of the United Nations, including food, nutrition,
        agriculture, fisheries, forestry, environment etc. It is published by FAO
        and edited by a community of experts. AGROVOC consists of over 41,400 concepts
        available in up to 42 languages. AGROVOC uses semantic web technologies, linking
        to other multilingual knowledge organization systems and building bridges
        between datasets. Your library can use AGROVOC to index its documents or datasets,
        or you can use it from inside your content management system (e.g., Drupal)
        to organize your documents or web site. You can also use AGROVOC as an hub
        to access many other vocabularies available on the web.  To date, AGROVOC
        is used by researchers, librarians and information managers for indexing,
        retrieving and organizing data in agricultural information systems and Web
        pages. Currently, AGROVOC is an SKOS-XL concept scheme and a Linked Open Data
        (LOD*) set aligned with over 20 other multilingual knowledge organization
        systems related to agriculture. You may browse AGROVOC, access its Web Services
        or SPARQL endpoint.","abbreviation":"AGROVOC","support_links":[{"url":"https://dgroups.org/fao/agrovoc/join","name":"AGROVOC
        News mailing list","type":"Mailing list"},{"url":"https://en.wikipedia.org/wiki/AGROVOC","name":"Wikipedia","type":"Wikipedia"},{"url":"http://www.fao.org/agrovoc/about","name":"About","type":"Help
