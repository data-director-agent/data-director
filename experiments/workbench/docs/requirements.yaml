# Requirements register.
#
# The conformance report (scripts/conformance_report.py) iterates this list. Every identifier a
# test marks with @pytest.mark.requirement(...) must appear here, and every entry here appears in
# CONFORMANCE.md whether or not any test substantiates it. A row with no passing test is
# rendered "unsubstantiated" — that is the intended default, not a gap to hide. The register
# therefore lists every functional (R) and non-functional (C) requirement in the Blueprint's §7
# tables, not only the ones the workbench exercises.
#
# source: blueprint  — the identifier and title are the Blueprint's own (docs/BLUEPRINT.md §7).
# source: project    — a decomposition or obligation this project introduced; the Blueprint does
#                      not use the identifier. R3.1–R3.6 come from experiments/standards-advisor.
#
# Marker honesty: a test may carry an identifier only if it exercises the requirement as the
# Blueprint states it. A test that checks the *shape* of a slot (the P14 energy slots exist and
# say not_measured) does not substantiate the requirement (energy footprint captured), and is
# not marked.

requirements:
  # --- Blueprint §7.1 functional requirements ---------------------------------------------
  - id: R1
    source: blueprint
    priority: MUST
    title: Recommend and select repositories meeting funder, journal, institutional and community requirements
  - id: R2
    source: blueprint
    priority: MUST
    title: Generate FAIR-aligned and discipline-appropriate metadata using controlled vocabularies, ontologies and community standards
  - id: R3
    source: blueprint
    priority: MUST
    title: Suggest appropriate vocabularies, ontologies and open data formats
  - id: R3.1
    source: project
    parent: R3
    title: Controlled vocabulary recommendations for concept linkage
  - id: R3.2
    source: project
    parent: R3
    title: Ontology recommendations for schema or model alignment
  - id: R3.3
    source: project
    parent: R3
    title: Open data format recommendations
  - id: R3.4
    source: project
    parent: R3
    title: Field-level format standards (date/time, units, codes)
  - id: R3.5
    source: project
    parent: R3
    title: Support for emerging standards; no hard-coded standards list
  - id: R3.6
    source: project
    parent: R3
    title: Explicit abstention where no suitable resource exists
  - id: R4
    source: blueprint
    title: Validate metadata quality and produce standardised records assessed against community best practices
  - id: R5
    source: blueprint
    title: Draft data documentation including READMEs and data dictionaries at publication
  - id: R6
    source: blueprint
    title: Enable interoperable metadata across institutions and Data Director instances
  - id: R7
    source: blueprint
    title: Support assignment of persistent identifiers (PIDs) at point of publication
  - id: R8
    source: blueprint
    title: Verify data sharing at publication against Data Management Plan (DMP) commitments
  - id: R9
    source: blueprint
    title: Retrofit FAIR-aligned metadata for already-published datasets and supplementary materials
  - id: R10
    source: blueprint
    title: Track provenance of AI agent actions on data and metadata
  - id: R11
    source: blueprint
    title: Link datasets to related research outputs including publications, people, grants and software
  - id: R12
    source: blueprint
    title: Discover related datasets relevant to a research project

  # --- Blueprint §7.2 non-functional requirements -----------------------------------------
