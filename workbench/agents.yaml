# The agents this workbench calls (ADR-0011). Each is a separate service; start them with
# `uv run dd-<agent> serve --port N` from the repository root, or all at once with
# `scripts/run-agents.sh`.
# The workbench reads each agent's card at start-up. One that cannot be reached is listed as
# unavailable by `workbench agents`, and one built against another contract version as
# incompatible (ADR-0019); the rest still run. Each card carries its agent's class schemas, so
# adding an agent is one entry here. Override the path with DD_AGENTS_CONFIG.
# See docs/registry.md.
agents:
  - url: http://127.0.0.1:8101
  - url: http://127.0.0.1:8102
  - url: http://127.0.0.1:8103
  - url: http://127.0.0.1:8104
  - url: http://127.0.0.1:8105
  # The orchestrator waits for the agents it delegates to, so it needs a longer timeout than
  # theirs (ADR-0012).
  - url: http://127.0.0.1:8106
    timeout_s: 120
