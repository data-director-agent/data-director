[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-workbench"
version = "0.1.0"
description = "Data Director Workbench: a development way in to the harness, with the CLI, the viewer, evaluation and the conformance report"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "data-director-sdk",
  "data-director-harness",
  "pydantic>=2.11,<3",
  "httpx>=0.28",
  "ag-ui-protocol>=0.1.22,<0.2",
  "uvicorn>=0.30",
]

[project.scripts]
workbench = "workbench.cli:entry"

[project.optional-dependencies]
# Evaluation on Inspect AI (ADR-0013): `workbench.evaluation` and each agent's `evals/`.
eval = ["inspect-ai>=0.3.268"]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
