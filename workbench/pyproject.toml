[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-workbench"
version = "0.2.0-alpha.4"
description = "Data Director Workbench: a development way in to the harness, with the CLI, the viewer and evaluation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "data-director-sdk>=0.2.0a0",
  "data-director-harness>=0.2.0a0",
  "pydantic>=2.14.1,<3",
  "starlette>=0.40",
  "ag-ui-protocol>=1.0.0,<1.1",
  "uvicorn>=0.30",
]

[project.scripts]
workbench = "workbench.cli:entry"

[project.optional-dependencies]
# Evaluation on Inspect AI (docs/specs/evaluation.md): `workbench.evaluation` and each agent's `evals/`.
eval = ["inspect-ai>=0.3.281"]

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-orchestrator-stub",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
  # The viewer's browser tests (browser_tests/).
  "pytest>=8.3",
  "playwright",
  "axe-playwright-python",
]

[tool.deptry.per_rule_ignores]
# browser_tests/ is test code, but deptry counts only tests/ and conftest.py as such.
DEP004 = [
  "axe_playwright_python",
  "dd_agent_advisor_quality",
  "dd_agent_advisor_standards",
  "dd_agent_example_hello",
  "dd_agent_orchestrator_stub",
  "playwright",
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
