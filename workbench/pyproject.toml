[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-workbench"
version = "0.2.0-alpha.1"
description = "Data Director Workbench: a development way in to the harness, with the CLI, the viewer and evaluation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "data-director-sdk>=0.2.0a0",
  "data-director-harness>=0.2.0a0",
  "pydantic>=2.14.1,<3",
  "httpx>=0.28",
  "ag-ui-protocol>=1.0.0,<1.1",
  "uvicorn>=0.30",
]

[project.scripts]
workbench = "workbench.cli:entry"

[project.optional-dependencies]
# Evaluation on Inspect AI (ADR-0013): `workbench.evaluation` and each agent's `evals/`.
eval = ["inspect-ai>=0.3.281"]

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-orchestrator-stub",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
