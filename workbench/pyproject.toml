[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-workbench"
version = "0.1.0"
description = "Data Director Workbench: harness, agent registry, transports, viewer and conformance report"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "data-director-sdk",
  "pydantic>=2.11,<3",
  "jsonschema>=4.23",
  "httpx>=0.28",
  "opentelemetry-sdk>=1.44",
  "a2a-sdk[http-server]>=1.1,<2",
  "ag-ui-protocol>=0.1.22,<0.2",
  "rocrate>=0.15",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.scripts]
workbench = "workbench.cli:main"

[project.optional-dependencies]
# Evaluation on Inspect AI (ADR-0013): `workbench.evaluation` and each agent's `evals/`.
eval = ["inspect-ai>=0.3.268"]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
