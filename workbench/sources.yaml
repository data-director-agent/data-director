# Independent copies of the sources agents cite (docs/specs/grounding.md). The source check re-hashes each
# cited record against the copy listed for the evidence's snapshot_ref; evidence whose
# snapshot_ref is not listed here is reported as unresolved, never as verified.
# A copy is independent of the agent because its bytes are pinned by sha256, not because of
# where it lives: a file that no longer matches its pin stops the workbench from starting.
# An entry may mark a copy that its agent builds outside git (`built: true`); until
# `uv run dd-sources prepare` has built it, the workbench starts with a warning and evidence citing
# it is unresolved.
# Rebuilding a snapshot changes its label and its hash; add a new entry for it.
# Override the path with DD_SOURCES_CONFIG. Paths are relative to this file.
# TODO(#246): a resolver for the standards advisor's `live` route (the FAIRsharing API needs credentials and network).
sources:
  - snapshot_refs: ["snapshot:2026-09-04", "snapshot:2026-09-04 (stale)"]
    path: ../agents/advisor-standards/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: 969642eed642d2f4cbb0e6999878cb3bf2480734c0bbab4fcd3db212ecdbcdf1
  - snapshot_refs: ["re3data:export:2026-11"]
    path: ../agents/advisor-repository/data/re3data/registry.jsonl
    # Built from the pinned re3data export, not committed (agents/advisor-repository/README.md).
    built: true
    id_field: re3data_id
    sha256: 37e4ce9d248a72765357d5d14d966f7ac55eb9b9cd2160f442f305fe17acfcbd
  - snapshot_refs: ["fairsharing:snapshot:2026-11-10", "fairsharing:snapshot:2026-11-10 (stale)"]
    path: ../agents/advisor-repository/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: 11981403cfb20816fb1557d3308e88b6a35e31df90f2948349281bdbb016c7b5
  - snapshot_refs: ["fairsharing-policy:snapshot:2026-10-29", "fairsharing-policy:snapshot:2026-10-29 (stale)"]
    path: ../agents/advisor-policy/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: 828c6229b341ba4864c3af414f9a6be5b8bc32fcc0393babea187a6012a0426f
