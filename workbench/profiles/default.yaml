# Default institutional profile. See README.md in this directory for what each key means.
profile_id: default
version: 4
description: Development profile for the workbench; enables every in-tree agent, requires approval for writes.

# Each agent that may run, and the action class the steward assigns it. An agent whose card
# declares a different class is refused until this file is updated.
agents:
  quality.reviewer: advise
  standards.advisor: advise
  repository.advisor: advise
  hello.world: advise
  director.stub: advise
  orchestrator.model: advise

actions_requiring_approval:
  - deposit
  - metadata_write
