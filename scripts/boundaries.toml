# Known exceptions to the package boundary rule (ADR-0031), read by scripts/check_boundaries.py.
#
# Each entry names a file and the start of the problem reported for it. An entry that no longer
# matches anything is itself reported, so this list only shrinks. Do not add to it to make a new
# tie pass: declare the package in the member's pyproject.toml instead.

# The standards advisor's evaluations and test kit live in its wheel but use the workbench and
# the harness. TODO(#275): move them out of src/, or declare an extra.
[[exception]]
path = "agents/advisor-standards/src/dd_agent_advisor_standards/evals/scorers.py"
problem = "imports workbench"

