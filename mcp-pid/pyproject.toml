[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-mcp-pid"
version = "0.1.0-alpha.2"
description = "A read-only MCP server that resolves DOIs (DataCite, Crossref), ORCID iDs, ROR identifiers, ISSNs and grant numbers to small structured records"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
keywords = ["mcp", "persistent identifiers", "doi", "datacite", "crossref", "orcid", "ror", "issn", "grant", "openaire", "research data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

# Framework-neutral (docs/specs/system.md): the workspace members imported are dd-journals and
# dd-registry-cache, standard-library-only libraries each published on its own, so publishing this
# server is a copy. The MCP SDK is pinned to a minor version like the harness's gateway,
# whose client this server is written against.
dependencies = [
  "mcp>=2.3,<2.4",
  "mcp-types>=2.3,<2.4",
  "httpx>=0.28",
  "pydantic>=2.14.1,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "anyio>=4",
  # The journal registry and its index, from a pinned OpenAlex snapshot (the `journals` server).
  "data-director-journals",
  # The cache of the registries' answers, which the offline mode answers from.
  "data-director-registry-cache",
]

[project.scripts]
dd-mcp-pid = "dd_mcp_pid.cli:main"

[project.urls]
Homepage = "https://data-director-agent.github.io/data-director/"
Repository = "https://github.com/data-director-agent/data-director/tree/main/mcp-pid"
Issues = "https://github.com/data-director-agent/data-director/issues"

# What this package's tests import from the workspace (docs/specs/system.md,
# scripts/check_boundaries.py): the gateway and the SDK's evidence hashing, to check the server
# against a real gateway client.
[dependency-groups]
dev = ["data-director-harness[gateway]", "data-director-sdk"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_mcp_pid"]
