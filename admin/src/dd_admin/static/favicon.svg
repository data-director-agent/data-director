<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #1f5f55; }
    .mark { fill: #fff; }
    .line { stroke: #fff; }
    .pupil { fill: #1f5f55; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #8fd6c4; }
      .mark { fill: #15171a; }
      .line { stroke: #15171a; }
      .pupil { fill: #8fd6c4; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <!-- An eye: the admin service only looks, it runs nothing. -->
  <path class="line" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M5 16q5.5-8 11-8t11 8q-5.5 8-11 8T5 16z"/>
  <circle class="mark" cx="16" cy="16" r="4.5"/>
  <circle class="pupil" cx="16" cy="16" r="1.8"/>
</svg>
