# Coverage is enforced loosely: the project figure may not fall by more than a point against the
# base commit, and new or changed lines need 80%. The absolute floor is `fail_under` in
# pyproject.toml. The per-package flags are reported but do not fail a pull request; TODO: set a
# floor for each package once a few weeks of figures show where they sit.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
# CI uploads one report carrying every flag; each flag keeps only the files under its package.
flag_management:
  individual_flags:
    - name: sdk
      paths: [sdk/]
    - name: harness
      paths: [harness/]
    - name: workbench
      paths: [workbench/]
    - name: app
      paths: [app/]
    - name: agents
      paths: [agents/]
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
