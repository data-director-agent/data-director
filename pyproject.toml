[[tool.importlinter.contracts]]
name = "the harness's way in, conductor, storage and checks are layered"
type = "layers"
containers = ["dd_harness"]
# The governance spine (docs/specs/system.md): a request enters through the server and transport,
# the conductor and its pipeline run it, storage keeps it, and the checks the project owns sit at
# the bottom, importing none of the machinery that calls them. Modules not named are unconstrained.
layers = [
  "server",
  "transport",
  "conductor : pipeline : refusals",
  "storage",
  "policy | grounding | provenance | shacl | sources | identity | requirements | model_grants",
]

[[tool.importlinter.contracts]]
name = "the app is wired, routed, then governed"
type = "layers"
containers = ["dd_app"]
# `app` builds the application, `routes` hold the handlers, `project_service` the project rules
# they call, `reads` what a reader is answered with and `deployment_view` what the deployment is,
# and `governance` the one way to the harness, which says who may do what (docs/specs/app.md).
layers = ["app", "routes", "project_service | reads | deployment_view", "governance"]
# `response_models` finds every response model by importing the app inside the function, so the
# lower layers reach `app` through `responses` (TODO(#1066): move it out of `responses`).
ignore_imports = [
  "dd_app.responses -> dd_app.app",
]

[[tool.importlinter.contracts]]
name = "no package's modules import one another in a cycle"
type = "acyclic_siblings"
ancestors = ["dd_sdk", "dd_harness", "workbench", "dd_app", "dd_admin", "dd_broker", "dd_deposit_broker", "dd_inventory", "dd_agent_advisor_dmp", "dd_agent_advisor_documentation", "dd_agent_advisor_ethics", "dd_agent_advisor_fairness", "dd_agent_advisor_files", "dd_agent_advisor_linking", "dd_agent_advisor_metadata", "dd_agent_advisor_policy", "dd_agent_advisor_quality", "dd_agent_advisor_repository", "dd_agent_advisor_rights", "dd_agent_advisor_standards", "dd_agent_example_hello", "dd_agent_advisor_storage", "dd_agent_orchestrator_model", "dd_agent_orchestrator_stub"]
# The cycles that exist now. Most were there when this contract was added (#1055); main's changes
# since removed those and added the ones below. `responses -> app` is a function-local import (it
# finds every response model by importing the app); the rest run at import time. An entry that no
# longer matches fails, so the list only shrinks. TODO(#1066): break these cycles and delete the
# entries.
ignore_imports = [
  "dd_app.project_service -> dd_app.governance",
  "dd_app.responses -> dd_app.app",  # function-local
  "dd_harness.fact_storage -> dd_harness.projects.facts",
  "dd_harness.postgres -> dd_harness.settings",
  "dd_harness.settings -> dd_harness.conductor",
  "dd_harness.settings -> dd_harness.projects",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# C90 and the PLR09 rules hold functions to a size and shape a reviewer can follow. The functions
# that exceed them today carry `# noqa` at their definition: that is recorded debt, so remove the
# marker when you split one, and never add a new one to get code past these rules
# (docs/architecture-review.md). PLR0904 does the same for classes, so that a class cannot grow
# by adding small methods; it is a preview rule, and explicit-preview-rules keeps every other
# preview rule off. FBT keeps a boolean out of a positional parameter, so a call reads
# without its definition (make the parameter keyword-only with `*`); a `# noqa: FBT00x` is recorded
# debt in the same way. S110 forbids `try`/`except`/`pass`: a content problem is an outcome.
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SIM", "ANN", "RUF", "PTH", "TID", "C4", "DTZ", "T20", "C90", "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "FBT", "S110"]
ignore = ["ANN401"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-public-methods = 20
max-branches = 12
max-statements = 50
max-args = 7
max-returns = 6

[tool.ruff.lint.isort]
known-first-party = ["dd_sdk", "dd_harness", "workbench", "dd_agent_example_hello", "dd_agent_advisor_storage", "dd_agent_advisor_quality", "dd_agent_advisor_standards", "dd_agent_advisor_repository", "dd_agent_advisor_policy", "dd_agent_advisor_ethics", "dd_agent_advisor_files", "dd_agent_advisor_dmp", "dd_agent_advisor_metadata", "dd_agent_advisor_documentation", "dd_agent_advisor_rights", "dd_agent_advisor_linking", "dd_agent_advisor_fairness", "dd_agent_orchestrator_stub", "dd_agent_orchestrator_model", "dd_app", "dd_admin", "dd_broker", "dd_deposit_broker", "dd_inventory", "dd_mcp_pid", "dd_mcp_fairsharing", "dd_mcp_spdx", "dd_mcp_subjects", "dd_mcp_doaj", "dd_mcp_opf", "dd_units", "dd_subjects", "dd_formats", "dd_duo", "dd_journals", "dd_dmp_template", "dd_metadata_records", "dd_registry_cache"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN", "C90", "PLR09", "FBT", "S110"]
"**/browser_tests/*" = ["ANN", "C90", "PLR09", "FBT", "S110"]
"conftest.py" = ["ANN", "C90", "PLR09", "FBT", "S110"]
"**/scripts/*" = ["T20", "E501"]  # report scripts embed Markdown prose
"workbench/src/workbench/cli.py" = ["T20"]
# The domain reads better without an Error suffix; these names appear in messages people read.
"harness/src/dd_harness/conductor.py" = ["N818"]
"harness/src/dd_harness/identity.py" = ["N818"]
"sdk/src/dd_sdk/contract/validate.py" = ["N818"]
"sdk/src/dd_sdk/delegate.py" = ["N818"]
"sdk/src/dd_sdk/registry/retrieve.py" = ["N818"]
"broker/src/dd_broker/guard.py" = ["N818"]
"broker/src/dd_broker/reasons.py" = ["N818"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["sdk/tests", "harness/tests", "workbench/tests", "agents", "app/tests", "admin/tests", "broker/tests", "deposit-broker/tests", "inventory/tests", "mcp-pid/tests", "mcp-fairsharing/tests", "mcp-spdx/tests", "mcp-subjects/tests", "mcp-doaj/tests", "mcp-opf/tests", "units/tests", "subjects/tests", "formats/tests", "duo/tests", "journals/tests", "dmp-template/tests", "metadata-records/tests", "registry-cache/tests", "scripts/tests"]
# Test directories are not packages, so every test module is imported by its basename: keep the
# basenames unique across the workspace. Shared doubles live in `dd_harness.testing` and
# `dd_agent_advisor_standards.testing`, not in a test directory.
# -n auto spreads the session over every core (pytest-xdist): about 40 s instead of 100 s for the
# whole suite, for under a second of start-up on a single file. --dist loadfile keeps each test
# module on one worker, so its module fixtures and teardown run as they do serially. Pass -n0 to
# run in one process, to use a debugger or read output in order. --allowed-hosts lets the
# PostgreSQL tests reach a database on this machine (harness/tests/test_postgres.py); nothing else
# leaves it.
addopts = "--strict-markers --strict-config -ra --record-mode=none --block-network --allowed-hosts=localhost,127.0.0.1,::1 -n auto --dist loadfile"
filterwarnings = [
  "error",
  # a2a-sdk 1.1 calls protobuf's deprecated FieldDescriptor.label(); with warnings as errors the
  # C-level call surfaces as a SystemError inside the JSON-RPC dispatcher. Not ours to fix.
  "ignore:label\\(\\) is deprecated:DeprecationWarning",
  # pytest 9.2 flags pytest-base-url's session-scoped `base_url` fixture (an instance method, via
  # pytest-playwright); with warnings as errors every browser test errors at setup. Not ours to fix.
  "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]
markers = [
  "requirement(*ids): the requirement identifiers this test substantiates (see docs/requirements.yaml)",
  "postgres: needs the PostgreSQL database DD_TEST_POSTGRES names; skipped when it is unset",
  "gateway: needs the LiteLLM gateway DD_TEST_GATEWAY names and a key in DD_TEST_GATEWAY_KEY; skipped when either is unset",
  "re3data: needs the full re3data registry that `uv run dd-re3data fetch` builds; skipped when it is absent",
]

# Coverage of the packages under test, measured over the one workspace test session. The tests
