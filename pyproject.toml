]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "sdk is below the harness, which is below everything that uses it"
type = "layers"
layers = [
  "workbench | dd_app | dd_admin | dd_broker | dd_deposit_broker | dd_agent_advisor_dmp | dd_agent_advisor_documentation | dd_agent_advisor_ethics | dd_agent_advisor_fairness | dd_agent_advisor_files | dd_agent_advisor_linking | dd_agent_advisor_metadata | dd_agent_advisor_policy | dd_agent_advisor_quality | dd_agent_advisor_repository | dd_agent_advisor_rights | dd_agent_advisor_standards | dd_agent_example_hello | dd_agent_advisor_storage | dd_agent_orchestrator_model | dd_agent_orchestrator_stub",
  "dd_harness",
  "dd_sdk",
]
# The standards advisor's evaluations and test kit live in its wheel but use the workbench.
# TODO(#275): move them out of src/, or declare an extra, then delete these.
ignore_imports = [
  "dd_agent_advisor_standards.evals.* -> workbench.*",
  "dd_agent_advisor_standards.testing -> workbench.*",
  # The Documentation Editor's evaluation declares the workbench in its `eval` extra.
  "dd_agent_advisor_documentation.evals.* -> workbench.*",
  # So does the Data Management Planner's.
  "dd_agent_advisor_dmp.evals.* -> workbench.*",
  # And the repository advisor's.
  "dd_agent_advisor_repository.evals.* -> workbench.*",
  # And the Rights and Licensing Adviser's.
  "dd_agent_advisor_rights.evals.* -> workbench.*",
  # And the Metadata Librarian's.
  "dd_agent_advisor_metadata.evals.* -> workbench.*",
]

