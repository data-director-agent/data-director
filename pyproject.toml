# The uv workspace (docs/specs/agents.md). Not a package: it pins the members together, holds the shared
# development tooling, and runs one test session so the conformance report sees every test.
#
#   sdk/         data-director-sdk        the contract, evidence, trace helpers, A2A agent server
#   harness/     data-director-harness    the conductor and its checks, run store and provenance
#   workbench/   data-director-workbench  the development way in: CLI, viewer, evaluation
#   agents/*/    data-director-agent-*    one package and one service per agent
#   app/         data-director-app        the Data Director app (alpha)
#   admin/       data-director-admin      the operators' read-only view of a deployment, on loopback
#   broker/      data-director-model-broker  holds people's own model keys and makes their calls
#   deposit-broker/  data-director-deposit-broker  holds people's own repository tokens and makes drafts
#   inventory/   data-director-inventory  the local command that inventories a dataset's files
#   mcp-pid/     data-director-mcp-pid    an MCP server resolving DOIs, ORCID iDs, ROR identifiers and ISSNs
#   units/       data-director-units      turns a unit a person writes into a UCUM code, by rule
#   dmp-template/  data-director-dmp-template  the core requirements for a Data Management Plan
#   metadata-records/  data-director-metadata-records  metadata records in any standard: codecs and definitions
#   subjects/    data-director-subjects   subject classifications to suggest a field of study from
#   formats/     data-director-formats    file formats described from their PRONOM records
#   duo/         data-director-duo        data use conditions from a pinned GA4GH Data Use Ontology
#   journals/    data-director-journals   journals by ISSN and title, from a pinned OpenAlex snapshot
#   mcp-fairsharing/  data-director-mcp-fairsharing  an MCP server for FAIRsharing records
#   mcp-spdx/         data-director-mcp-spdx         an MCP server for a pinned SPDX licence list
#   mcp-subjects/     data-director-mcp-subjects     an MCP server for subject classifications (ANZSRC, OECD)
#   mcp-doaj/         data-director-mcp-doaj         an MCP server for DOAJ journal records
#   mcp-opf/          data-director-mcp-opf          an MCP server for Jisc Open Policy Finder records
#   registry-cache/  data-director-registry-cache  a local cache in front of a slowly changing registry

[project]
name = "data-director"
version = "0.0.0"
description = "Data Director: reference implementation of the RDA Data Director Agentic AI Blueprint (uv workspace root)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
keywords = ["research data management", "agentic ai", "fair data", "a2a", "rda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  # Not a distributable package; stops an accidental upload to PyPI.
  "Private :: Do Not Upload",
]
dependencies = [
  "data-director-sdk",
  "data-director-harness[serve]",
  "data-director-workbench",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-storage",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
  "data-director-agent-advisor-repository",
  "data-director-agent-advisor-ethics",
  "data-director-agent-advisor-files",
  "data-director-agent-advisor-dmp",
  "data-director-agent-advisor-metadata",
  "data-director-agent-advisor-documentation",
  "data-director-agent-advisor-rights",
  "data-director-agent-advisor-linking",
  "data-director-agent-advisor-fairness",
  "data-director-agent-advisor-policy",
  "data-director-agent-orchestrator-stub",
  "data-director-agent-orchestrator-model",
  "data-director-app",
  "data-director-admin",
  "data-director-model-broker",
  "data-director-deposit-broker",
  "data-director-inventory",
  "data-director-mcp-pid",
  "data-director-units",
  "data-director-registry-cache",
  "data-director-dmp-template",
  "data-director-metadata-records",
  "data-director-subjects",
  "data-director-formats",
  "data-director-duo",
  "data-director-journals",
  "data-director-mcp-fairsharing",
  "data-director-mcp-spdx",
  "data-director-mcp-subjects",
  "data-director-mcp-doaj",
  "data-director-mcp-opf",
]

[project.urls]
Homepage = "https://github.com/data-director-agent/data-director"
Documentation = "https://github.com/data-director-agent/data-director/tree/main/docs"
Repository = "https://github.com/data-director-agent/data-director"
Issues = "https://github.com/data-director-agent/data-director/issues"
Blueprint = "https://doi.org/10.15497/RDA00157"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-recording>=0.14.0",
  "pytest-json-report>=1.5",
  # The viewer's browser tests (workbench/browser_tests/); browsers come from `playwright install`.
  "pytest-playwright>=0.7",
  {include-group = "accessibility"},
  "linkml>=1.12.1",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "types-jsonschema>=4.26.0.20261006",
  "types-PyYAML>=6.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "deptry>=0.25.1",
  "import-linter>=2.15",
  "packaging>=26.3",
  "vulture>=2.14",
  "hypothesis>=6.170",
]
# The whole-stack load test (loadtest/README.md). Run outside pytest.
loadtest = [
  "locust>=2.37",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-redirects>=1.2",
  "mkdocs-git-revision-date-localized-plugin>=1.4",
]
# axe-core in a Playwright browser: the documentation site's check
# (scripts/check_site_accessibility.py) and the viewer's browser tests.
accessibility = [
  "axe-playwright-python>=0.1.8",
  "playwright>=1.55",
]
# The weekly mutation testing of the governance modules (.github/workflows/mutation.yml); the
# settings are under [tool.mutmut] in sdk/pyproject.toml and harness/pyproject.toml.
mutation = [
  "mutmut>=3.8.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "harness", "workbench", "agents/*", "app", "admin", "broker", "deposit-broker", "inventory", "mcp-pid", "mcp-fairsharing", "mcp-spdx", "mcp-subjects", "mcp-doaj", "mcp-opf", "units", "subjects", "formats", "duo", "journals", "dmp-template", "metadata-records", "registry-cache"]

