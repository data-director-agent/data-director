# The uv workspace (ADR-0011). Not a package: it pins the members together, holds the shared
# development tooling, and runs one test session so the conformance report sees every test.
#
#   sdk/         data-director-sdk        the contract, evidence, trace helpers, A2A agent server
#   harness/     data-director-harness    the conductor and its checks, run store and provenance
#   workbench/   data-director-workbench  the development way in: CLI, viewer, evaluation
#   agents/*/    data-director-agent-*    one package and one service per agent
#   app/         data-director-app        the Data Director app (alpha)
#   inventory/   data-director-inventory  the local command that inventories a dataset's files

[project]
name = "data-director"
version = "0.0.0"
description = "Data Director: reference implementation of the RDA Data Director Agentic AI Blueprint (uv workspace root)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
keywords = ["research data management", "agentic ai", "fair data", "a2a", "rda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  # Not a distributable package; stops an accidental upload to PyPI.
  "Private :: Do Not Upload",
]
dependencies = [
  "data-director-sdk",
  "data-director-harness[serve]",
  "data-director-workbench",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
  "data-director-agent-advisor-repository",
  "data-director-agent-advisor-ethics",
  "data-director-agent-advisor-files",
  "data-director-agent-advisor-dmp",
  "data-director-agent-advisor-metadata",
  "data-director-agent-advisor-documentation",
  "data-director-agent-advisor-rights",
  "data-director-agent-advisor-linking",
  "data-director-agent-advisor-fairness",
  "data-director-agent-advisor-policy",
  "data-director-agent-orchestrator-stub",
  "data-director-agent-orchestrator-model",
  "data-director-app",
  "data-director-inventory",
]

[project.urls]
Homepage = "https://github.com/data-director-agent/data-director"
Documentation = "https://github.com/data-director-agent/data-director/tree/main/docs"
Repository = "https://github.com/data-director-agent/data-director"
Issues = "https://github.com/data-director-agent/data-director/issues"
Blueprint = "https://doi.org/10.15497/RDA00157"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-recording>=0.14.0",
  "pytest-json-report>=1.5",
  # The viewer's browser tests (workbench/browser_tests/); browsers come from `playwright install`.
  "pytest-playwright>=0.7",
  "linkml>=1.12.1",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "types-jsonschema>=4.26.0.20261006",
  "types-PyYAML>=6.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "harness", "workbench", "agents/*", "app", "inventory"]

[tool.uv.sources]
data-director-sdk = { workspace = true }
data-director-harness = { workspace = true }
data-director-workbench = { workspace = true }
data-director-agent-example-hello = { workspace = true }
data-director-agent-advisor-quality = { workspace = true }
data-director-agent-advisor-standards = { workspace = true }
data-director-agent-advisor-repository = { workspace = true }
data-director-agent-advisor-ethics = { workspace = true }
data-director-agent-advisor-files = { workspace = true }
data-director-agent-advisor-dmp = { workspace = true }
data-director-agent-advisor-metadata = { workspace = true }
data-director-agent-advisor-documentation = { workspace = true }
data-director-agent-advisor-rights = { workspace = true }
data-director-agent-advisor-linking = { workspace = true }
data-director-agent-advisor-fairness = { workspace = true }
data-director-agent-advisor-policy = { workspace = true }
data-director-agent-orchestrator-stub = { workspace = true }
data-director-agent-orchestrator-model = { workspace = true }
data-director-app = { workspace = true }
data-director-inventory = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SIM", "ANN", "RUF", "PTH", "TID", "C4", "DTZ", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["dd_sdk", "dd_harness", "workbench", "dd_agent_example_hello", "dd_agent_advisor_quality", "dd_agent_advisor_standards", "dd_agent_advisor_repository", "dd_agent_advisor_policy", "dd_agent_advisor_ethics", "dd_agent_advisor_files", "dd_agent_advisor_dmp", "dd_agent_advisor_metadata", "dd_agent_advisor_documentation", "dd_agent_advisor_rights", "dd_agent_advisor_linking", "dd_agent_advisor_fairness", "dd_agent_orchestrator_stub", "dd_agent_orchestrator_model", "dd_app", "dd_inventory"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]
"**/browser_tests/*" = ["ANN"]
"conftest.py" = ["ANN"]
"**/scripts/*" = ["T20", "E501"]  # report scripts embed Markdown prose
"workbench/src/workbench/cli.py" = ["T20"]
# The domain reads better without an Error suffix; these names appear in messages people read.
"harness/src/dd_harness/conductor.py" = ["N818"]
"harness/src/dd_harness/identity.py" = ["N818"]
"sdk/src/dd_sdk/contract/validate.py" = ["N818"]
"sdk/src/dd_sdk/delegate.py" = ["N818"]
"agents/advisor-standards/src/dd_agent_advisor_standards/retrieve.py" = ["N818"]
"agents/advisor-repository/src/dd_agent_advisor_repository/retrieve.py" = ["N818"]
"agents/advisor-policy/src/dd_agent_advisor_policy/retrieve.py" = ["N818"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["sdk/tests", "harness/tests", "workbench/tests", "agents", "app/tests", "inventory/tests", "scripts/tests"]
# Test directories are not packages, so every test module is imported by its basename: keep the
# basenames unique across the workspace. Shared doubles live in `dd_harness.testing` and
# `dd_agent_advisor_standards.testing`, not in a test directory.
addopts = "--strict-markers --strict-config -ra --record-mode=none --block-network"
filterwarnings = [
  "error",
  # a2a-sdk 1.1 calls protobuf's deprecated FieldDescriptor.label(); with warnings as errors the
  # C-level call surfaces as a SystemError inside the JSON-RPC dispatcher. Not ours to fix.
  "ignore:label\\(\\) is deprecated:DeprecationWarning",
]
markers = [
  "requirement(*ids): the requirement identifiers this test substantiates (see docs/requirements.yaml)",
]

# Coverage of the packages under test, measured over the one workspace test session. The tests
# and the generated schema are not what is being measured.
[tool.coverage.run]
branch = true
source_pkgs = ["dd_sdk", "dd_harness", "workbench", "dd_agent_example_hello", "dd_agent_advisor_quality", "dd_agent_advisor_standards", "dd_agent_advisor_repository", "dd_agent_advisor_policy", "dd_agent_advisor_ethics", "dd_agent_advisor_files", "dd_agent_advisor_dmp", "dd_agent_advisor_metadata", "dd_agent_advisor_documentation", "dd_agent_advisor_rights", "dd_agent_advisor_linking", "dd_agent_advisor_fairness", "dd_agent_orchestrator_stub", "dd_agent_orchestrator_model", "dd_app", "dd_inventory"]
relative_files = true

[tool.coverage.report]
# A floor a few points under the measured total (92% when set), so ordinary variation does not
# fail a run; Codecov holds the project figure from falling (codecov.yml).
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.14"
files = [
  "conftest.py", "sdk/src", "sdk/tests", "harness/src", "harness/tests", "workbench/src", "workbench/tests",
  "workbench/browser_tests", "workbench/scripts", "agents/*/src", "agents/*/tests", "agents/advisor-standards/scripts", "agents/advisor-repository/scripts", "agents/advisor-policy/scripts",
  "app/src", "app/tests", "inventory/src", "inventory/tests", "scripts",
]
explicit_package_bases = true
mypy_path = [
  "scripts", "sdk/src", "harness/src", "workbench/src", "workbench/scripts", "agents/example-hello/src",
  "agents/advisor-quality/src", "agents/advisor-standards/src", "agents/advisor-repository/src", "agents/advisor-policy/src",
  "agents/advisor-ethics/src", "agents/orchestrator-stub/src", "agents/orchestrator-model/src", "app/src", "app/tests", "inventory/src",
]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fido.*", "frictionless.*", "a2a.*", "ag_ui.*", "rank_bm25.*", "rocrate.*", "opentelemetry.*", "google.protobuf.*", "anthropic.*", "sse_starlette.*", "linkml_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["conftest", "sdk.tests.*", "harness.tests.*", "workbench.tests.*", "workbench.browser_tests.*", "agents.*", "app.*", "test_app", "test_feedback", "test_sign_in", "test_orchestrator", "test_orchestrator_stub", "test_standards_evals", "test_standards_harness", "support", "test_inventory"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
