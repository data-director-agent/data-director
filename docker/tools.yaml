# The MCP servers the harness's tool gateway calls (DD_TOOLS_CONFIG; docs/guide/operations/configuration.md).
# As the app reaches them inside the Compose network (compose.yaml): the same list as app/config/tools.yaml, with service names for hosts.
# A changed tool list is refused until it is reviewed and pinned again: `uv run dd-harness tools pins`
# prints each digest, and mcp-pid/tests/test_pid_gateway.py fails if these pins drift from the server.
servers:
  - name: datacite
    url: http://mcp-pid:8310/datacite/mcp
    id_field: doi
    canonicalisation: dd-json-document-v1
    tools_sha256: "920097bf478e88bd6f1f88e84ac2e8ccc21aee98937575da994f84f20b98d750"
  - name: crossref
    url: http://mcp-pid:8310/crossref/mcp
