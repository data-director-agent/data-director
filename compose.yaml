# Local development stack: agents, the app and its Vite dev server. See README.md, "With Docker
# Compose". For development only; deployment is in deploy/. Ports are published on loopback only,
# because the app does not authenticate callers. Settings are read from config/local/, which
# `uv run scripts/dd.py setup` creates, as in deployment. Set DD_APP_HOST_PORT, DD_WEB_HOST_PORT or
# DD_WORKBENCH_HOST_PORT in the shell if a port is taken. The agents are reached only inside the
# network. Runs and projects are kept in volumes unless config/local/app.env names a
# postgresql:// location; the `postgres` profile runs that database (README.md).

x-python: &python
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: python
  volumes:
    - .:/workspace
    - venv:/venv
    - uv-cache:/uv-cache
  environment: &python-env
    DD_AGENTS_CONFIG: /workspace/docker/agents.yaml
    # Where a relative *_FILE is read from, as under systemd (docs/specs/policy-and-identity.md).
    CREDENTIALS_DIRECTORY: /workspace/config/local/credentials

# Where libpq finds the `db` service and its password file inside the stack. `dd.py setup` writes
# the host's own values to config/local/app.env, which these override, so that file serves
# `dd.py start` on the host as well. A location never carries a password (docs/specs/storage.md).
x-postgres-env: &postgres-env
  PGHOST: db
  PGPORT: "5432"
  PGPASSFILE: /workspace/config/local/credentials/pgpass

x-agent: &agent
  <<: *python
  depends_on:
    deps:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - /venv/bin/python
      - -c
      - "import urllib.request,os; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"PORT\"]}/.well-known/agent-card.json')"
    interval: 5s
    timeout: 5s
    retries: 24
  restart: unless-stopped

# Every agent the app and the workbench wait for, since they read the agents' cards once at
# start-up. orchestrator-model is left out: it runs only with the `llm` profile.
x-agents-healthy: &agents-healthy
  example-hello:
    condition: service_healthy
  advisor-quality:
    condition: service_healthy
  advisor-standards:
    condition: service_healthy
  advisor-policy:
    condition: service_healthy
  advisor-repository:
    condition: service_healthy
  advisor-files:
    condition: service_healthy
  advisor-ethics:
    condition: service_healthy
  advisor-dmp:
    condition: service_healthy
  advisor-metadata:
    condition: service_healthy
  advisor-documentation:
    condition: service_healthy
  advisor-rights:
    condition: service_healthy
  advisor-linking:
    condition: service_healthy
  advisor-fairness:
    condition: service_healthy
  orchestrator-stub:
    condition: service_healthy

services:
  # The database runs and projects are kept in when config/local/app.env names it: opt-in, with
  # `docker compose --profile postgres up`, after `dd.py setup` has written its password. The
  # major version CI tests against (.github/workflows/ci.yml).
  db:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    profiles: [postgres]
    environment:
      POSTGRES_USER: dd
      POSTGRES_DB: dd
      POSTGRES_PASSWORD_FILE: /credentials/postgres-password
    volumes:
      - ./config/local/credentials:/credentials:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, dd, -d, dd]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    ports: ["127.0.0.1:${DD_DB_HOST_PORT:-5432}:5432"]

  # Applies the schema to `db`, then exits; with nothing to apply, it changes nothing.
  db-migrate:
    <<: *python
    profiles: [postgres]
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: uv run --no-sync dd-harness storage migrate postgresql://dd@/dd
    environment:
      <<: [*python-env, *postgres-env]

  # Installs every workspace package into the venv volume, builds the sources that agents build
  # outside git (dd-sources, sdk/src/dd_sdk/sources.py), then exits. Downloads stay in each
  # source's gitignored cache in the checkout, so they survive the container.
  deps:
    <<: *python
    command: sh -c "uv sync --all-packages --all-extras && uv run --no-sync dd-sources prepare"

  example-hello:
    <<: *agent
    command: uv run --no-sync dd-example-hello serve --host 0.0.0.0 --port 8101 --public-url http://example-hello:8101
    environment:
      <<: *python-env
      PORT: "8101"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/example-hello.env
        required: false

  advisor-quality:
    <<: *agent
    command: uv run --no-sync dd-advisor-quality serve --host 0.0.0.0 --port 8102 --public-url http://advisor-quality:8102
    environment:
      <<: *python-env
      PORT: "8102"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-quality.env
        required: false

  advisor-standards:
    <<: *agent
    command: uv run --no-sync dd-advisor-standards serve --host 0.0.0.0 --port 8105 --public-url http://advisor-standards:8105
    environment:
      <<: *python-env
      PORT: "8105"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-standards.env
        required: false

  advisor-policy:
    <<: *agent
    command: uv run --no-sync dd-advisor-policy serve --host 0.0.0.0 --port 8108 --public-url http://advisor-policy:8108
    environment:
      <<: *python-env
      PORT: "8108"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-policy.env
        required: false

  advisor-repository:
    <<: *agent
    command: uv run --no-sync dd-advisor-repository serve --host 0.0.0.0 --port 8109 --public-url http://advisor-repository:8109
    environment:
      <<: *python-env
      PORT: "8109"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-repository.env
        required: false

  advisor-files:
    <<: *agent
    command: uv run --no-sync dd-advisor-files serve --host 0.0.0.0 --port 8110 --public-url http://advisor-files:8110
    environment:
      <<: *python-env
      PORT: "8110"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-files.env
        required: false

  advisor-ethics:
    <<: *agent
    command: uv run --no-sync dd-advisor-ethics serve --host 0.0.0.0 --port 8111 --public-url http://advisor-ethics:8111
    environment:
      <<: *python-env
      PORT: "8111"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-ethics.env
        required: false

  advisor-dmp:
    <<: *agent
    command: uv run --no-sync dd-advisor-dmp serve --host 0.0.0.0 --port 8112 --public-url http://advisor-dmp:8112
    environment:
      <<: *python-env
      PORT: "8112"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-dmp.env
        required: false

  advisor-metadata:
    <<: *agent
    command: uv run --no-sync dd-advisor-metadata serve --host 0.0.0.0 --port 8113 --public-url http://advisor-metadata:8113
    environment:
      <<: *python-env
      PORT: "8113"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-metadata.env
        required: false

  advisor-documentation:
    <<: *agent
    command: uv run --no-sync dd-advisor-documentation serve --host 0.0.0.0 --port 8114 --public-url http://advisor-documentation:8114
    environment:
      <<: *python-env
      PORT: "8114"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-documentation.env
        required: false

  advisor-rights:
    <<: *agent
    command: uv run --no-sync dd-advisor-rights serve --host 0.0.0.0 --port 8115 --public-url http://advisor-rights:8115
    environment:
      <<: *python-env
      PORT: "8115"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-rights.env
        required: false

  advisor-linking:
    <<: *agent
    command: uv run --no-sync dd-advisor-linking serve --host 0.0.0.0 --port 8116 --public-url http://advisor-linking:8116
    environment:
      <<: *python-env
      PORT: "8116"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-linking.env
        required: false

  advisor-fairness:
    <<: *agent
    command: uv run --no-sync dd-advisor-fairness serve --host 0.0.0.0 --port 8117 --public-url http://advisor-fairness:8117
    environment:
      <<: *python-env
      PORT: "8117"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/advisor-fairness.env
        required: false

  orchestrator-stub:
    <<: *agent
    command: uv run --no-sync dd-orchestrator-stub serve --host 0.0.0.0 --port 8106 --public-url http://orchestrator-stub:8106
    environment:
      <<: *python-env
      PORT: "8106"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/orchestrator-stub.env
        required: false

  # Model-backed, so it is opt-in: `docker compose --profile llm up`. It exits at start-up
  # without a model key (ANTHROPIC_API_KEY_FILE) in config/local/agents/orchestrator-model.env.
  orchestrator-model:
    <<: *agent
    profiles: [llm]
    command: uv run --no-sync dd-orchestrator-model serve --host 0.0.0.0 --port 8107 --public-url http://orchestrator-model:8107
    environment:
      <<: *python-env
      PORT: "8107"
    env_file:
      - path: config/local/agents.env
        required: false
      - path: config/local/agents/orchestrator-model.env
        required: false

  # Builds the shell once: the app will not start without app/web/dist.
  web-build:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: node
    volumes:
      - ./app/web:/workspace/app/web
      - ./inventory/browser:/workspace/inventory/browser:ro
      - ./sdk/browser:/workspace/sdk/browser:ro
      - ./app/config:/workspace/app/config:ro
      - node-modules:/workspace/app/web/node_modules
    command: sh -c "npm ci && npm run build"

  app:
    <<: *python
    depends_on:
      deps:
        condition: service_completed_successfully
      web-build:
        condition: service_completed_successfully
      # Only with the `postgres` profile; without it, there is nothing to wait for.
      db-migrate:
        condition: service_completed_successfully
        required: false
      <<: *agents-healthy
    command: uv run --no-sync data-director
    # The volumes below, unless config/local/app.env names other locations.
    env_file:
      - docker/storage.env
      - path: config/local/app.env
        required: false
    healthcheck:
      test:
        - CMD
        - /venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/agents')"
      interval: 5s
      timeout: 5s
      retries: 24
    environment:
      <<: [*python-env, *postgres-env]
      DD_APP_HOST: 0.0.0.0
      DD_APP_PORT: "7860"
      DD_HARNESS_URL: http://app:7860
      # `dd.py setup` names the profile it writes by its path on the host; this is the same
      # file where the checkout is mounted.
      DD_PROFILE: /workspace/config/local/profile.yaml
    volumes:
      - .:/workspace
      - venv:/venv
      - uv-cache:/uv-cache
      - app-runs:/runs
      - app-projects:/projects
    ports: ["127.0.0.1:${DD_APP_HOST_PORT:-7860}:7860"]

  # Vite dev server for the shell, with hot reload. Proxies /api to the app.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: node
    depends_on:
      web-build:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    volumes:
      - ./app/web:/workspace/app/web
      - ./inventory/browser:/workspace/inventory/browser:ro
      - ./sdk/browser:/workspace/sdk/browser:ro
      - ./app/config:/workspace/app/config:ro
      - node-modules:/workspace/app/web/node_modules
    environment:
      DD_APP_URL: http://app:7860
    command: npm run dev -- --host 0.0.0.0
    ports: ["127.0.0.1:${DD_WEB_HOST_PORT:-5173}:5173"]

  # The development way in to the harness: `docker compose --profile workbench up workbench`.
  workbench:
    <<: *python
    profiles: [workbench]
    depends_on:
      deps:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
        required: false
      <<: *agents-healthy
    working_dir: /workspace/workbench
    command: uv run --no-sync workbench serve --host 0.0.0.0 --port 8000
    environment:
      <<: [*python-env, *postgres-env]
      DD_HARNESS_URL: http://workbench:8000
      # `dd.py setup` names the profile it writes by its path on the host; this is the same
      # file where the checkout is mounted.
      DD_PROFILE: /workspace/config/local/profile.yaml
    env_file:
      - docker/storage.env
      - path: config/local/app.env
        required: false
    volumes:
      - .:/workspace
      - venv:/venv
      - uv-cache:/uv-cache
      - workbench-runs:/runs
    ports: ["127.0.0.1:${DD_WORKBENCH_HOST_PORT:-8000}:8000"]

volumes:
  venv:
  uv-cache:
  node-modules:
  app-runs:
  app-projects:
  workbench-runs:
  db-data:
