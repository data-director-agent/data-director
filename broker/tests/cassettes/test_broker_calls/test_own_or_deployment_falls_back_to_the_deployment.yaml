# Written by hand, not recorded: the provider's answers to the broker. vcrpy matches on method and
# URI, so the request headers and bodies below are not compared, and the answers play back in order.
interactions:
- request:
    body: ''
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://api.anthropic.com/v1/messages
  response:
    body:
      string: "{\"id\": \"msg_dep\", \"type\": \"message\", \"role\": \"assistant\", \"model\": \"claude-sonnet-5-5\", \"content\": [{\"type\": \"text\", \"text\": \"Use the Data Documentation Initiative.\"}], \"stop_reason\": \"end_turn\", \"stop_sequence\": null, \"usage\": {\"input_tokens\": 120, \"output_tokens\": 30, \"cache_read_input_tokens\": 10, \"cache_creation_input_tokens\": 0}}"
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
version: 1
