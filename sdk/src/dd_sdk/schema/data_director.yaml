# The core Data Director contract: the fixed format the harness governs every agent by.
# Owned by the SDK; changing it changes the contract spec. `version` is the contract version agent cards declare
# (docs/specs/contract.md). After an edit, run `uv run dd-gen-schema` to regenerate generated/, and keep
# ../contract/models.py in step; sdk/tests/test_contract.py checks both.
id: https://w3id.org/data-director/schema/core
name: data_director_core
title: Data Director core contract
description: >-
  The invocation contract the Data Director harness governs every agent by: the request an agent
  receives, the envelope it returns, the outcome vocabulary, the input classes agents read and the
  payload classes they return. Input and payload are polymorphic unions discriminated by
  schema_class (docs/specs/contract.md); every payload mixes in Grounded so the grounding linter can check it
  without knowing its class (docs/specs/grounding.md). Formats here are fixed; see docs/specs/ for why.
  Generated artefacts live in schema/generated/ and are never hand-edited.
version: 0.9.11
license: MIT

prefixes:
  dd: https://w3id.org/data-director/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  spdx: http://spdx.org/rdf/terms#
default_prefix: dd
default_range: string

imports:
  - linkml:types

classes:

  Any:
    class_uri: linkml:Any
    description: Placeholder range for slots whose value type is enumerated in any_of.

  InvocationRequest:
    description: >-
      What the conductor hands to an agent. One request produces exactly one Envelope. A
      conversation is the set of top-level invocations sharing a conversation_id; each turn is
      one request and one envelope (docs/specs/orchestration.md).
    slots:
      - invocation_id
      - agent_id
      - requirement_ids
      - issued_at
      - conversation_id
      - project_id
      - parent_invocation_id
      - input

  Envelope:
    description: >-
      The agent's response. Every field an agent did not decide (identifiers, timestamps,
      telemetry, the policy applied, the human it acted for) is filled by the conductor, so an
      agent cannot mislabel its own run.
      Conditional rules not expressible in JSON Schema are enforced by contract.validate:
      failed or suspended requires problem; abstained or referred requires outcome.reason_code;
      succeeded requires payload; a payload requires payload_schema, and payload_schema a
      payload.
    slots:
      - invocation_id
      - agent_id
      - agent_version
      - completed_at
      - grounding_mode
      - policy_bundle_ref
      - policy_digest
      - acting_for
      - contract_version
      - input_schema
      - outcome
      - payload
      - payload_schema
      - evidence
      - telemetry
      - requires_human_review
      - problem
      - conversation_id
      - project_id
      - parent_invocation_id
      - delegations

  Delegation:
    description: >-
      One child invocation an agent in grounding mode delegation made through the harness
      (docs/specs/orchestration.md). Recorded by the conductor from its own run of the child, never reported by the
      agent. content_hash is the dd-envelope-json-v1 hash of the child envelope, which is what a
      relayed reply cites.
    slots:
      - delegated_invocation_id
      - delegated_agent_id
      - delegated_agent_version
      - delegated_status
      - content_hash

  Principal:
    class_uri: prov:Agent
    description: >-
      The human an invocation acted for (Blueprint §5.4), or the accountable human role where it
      acted for an institution. Named by the deployment's authentication boundary and recorded
      by the conductor; a request cannot name one, and an agent is never sent one (docs/specs/policy-and-identity.md).
    slots:
      - principal_id
      - name
      - principal_kind
      - assurance
      - vouched_by
    slot_usage:
      name:
        description: How the person or role is named to a reader of the record.
        pattern: "\\S"
    rules:
      - description: An authenticated principal names the issuer that vouched (docs/specs/policy-and-identity.md).
        preconditions:
          slot_conditions:
            assurance:
              equals_string: authenticated
        postconditions:
          slot_conditions:
            vouched_by:
              required: true
      - description: An asserted principal was vouched for by nobody (docs/specs/policy-and-identity.md).
        preconditions:
          slot_conditions:
            assurance:
              equals_string: asserted
        postconditions:
          slot_conditions:
            vouched_by:
              value_presence: ABSENT

  Outcome:
    description: >-
      One class rather than a union of five. The status enum carries the vocabulary; reason_code
      is required when status is abstained or referred; problem (on the Envelope) is required when
      status is failed or suspended.
    slots:
      - status
      - reason_code
      - referred_to
      - statement

  ProblemDetails:
    description: >-
      RFC 9457 Problem Details for HTTP APIs, used verbatim for failed and suspended outcomes.
      The two extension members carry the resumption condition for suspended.
    slots:
      - type
      - title
      - http_status
      - detail
      - instance
      - resume_condition
      - resume_after

  # --- Inputs ---------------------------------------------------------------------------------
  # Each input class carries schema_class as its type designator. An agent declares which input
  # classes it accepts; the conductor refuses any other with problem input-not-accepted.

  Message:
    description: >-
      One conversational turn addressed to an agent: the text of the turn and the conversation so
      far. The history is part of the input, so the input hash covers everything the agent saw.
      In a project that holds an inventory, the conductor adds what it is (docs/specs/projects.md);
      in any project, it adds the entry point chosen, the progress the project log shows and the
      project's title, if it has one (docs/specs/orchestration.md).
    slots:
      - schema_class
      - message_text
      - history
      - project_inventory
      - reply_answers
      - project_entry
      - project_progress
      - project_title
      - project_title_by_researcher
      - project_documentation
      - project_entry_by_researcher

  ConversationTurn:
    description: >-
      One earlier turn of a conversation, as the caller presents it to the agent. An agent turn
      names the agent and version that produced it and the invocation it came from.
    slots:
      - role
      - turn_text
      - turn_agent_id
      - turn_agent_version
      - turn_invocation_id

  ReplyAnswers:
    description: >-
      The researcher's answers to the questions the turn before asked, given together: one
      QuestionAnswer for each question answered, none for a question skipped. The app checks them
      against those questions before it sends the turn (docs/specs/orchestration.md).
    slots:
      - answer_to
      - given_answers

  QuestionAnswer:
    description: >-
      The researcher's answer to one question of a reply, named by its question_key: the values of
      the options chosen, for a choice question, and the answer in their own words, for a text
      question or where a choice question allows it.
    slots:
      - answered_key
      - answer_values
      - answer_words

  StepProgress:
    description: >-
      How far one step of the Blueprint's process flow has gone, as the project log shows it:
      started, done or skipped. A step the list leaves out is open (docs/specs/orchestration.md).
    slots:
      - step_id
      - step_state

  InventorySummary:
    description: >-
      What the inventory a project holds is, without its files: the conductor fills it into a
      Message so that the agent knows the project has one (docs/specs/projects.md).
    slots:
      - inventory_digest
      - inventory_file_count
      - inventory_tool
      - inventory_tool_version
      - inventory_made_at
      - inventory_limitations

  DocumentationSummary:
    description: >-
      What one document a researcher attached to a project is, without its text: the conductor
      fills one per document into a Message so that the agent knows the project holds it
      (docs/specs/projects.md).
    slots:
      - documentation_name
      - documentation_digest
      - documentation_media_type
      - documentation_size
      - documentation_added_at

  FileInventory:
    description: >-
      The facts about a dataset's files that the project holds in place of the files (docs/specs/projects.md):
      for each file its path, size, digest and format, and for a table its fields. Made by a
      command run where the data live; it never contains a file's content. advisor.files reads it.
    slots:
      - schema_class
      - inventory_files
      - inventory_tool
      - inventory_tool_version
      - inventory_identified_with
      - inventory_made_at
      - inventory_limitations

  InventoryFile:
    description: One file of a dataset, as the inventory command found it.
    slots:
      - file_path
      - file_size
      - file_sha256
      - file_media_type
      - file_pronom_ids
      - file_identified_by
      - file_fields
      - file_description
      - file_role

  RequirementSet:
    description: >-
      What a deposit must or should have (docs/specs/deposit.md). A standard's set covers any record in one
      metadata standard and names it in re3data_names; a repository override adds what one
      repository asks and names it in re3data_id. The harness merges the two for the repository a
      researcher chose, checks the project against the result, and gives it to the drafters. Kept
      as YAML in the deployment's configuration, not sent by agents.
    slots:
      - schema_class
      - requirement_set_id
      - version
      - title
      - url
      - conforms_to
      - re3data_names
      - re3data_id
      - fields
      - required_documents
      - recommended_documents
      - media_types
      - max_file_size
      - max_item_size
      - licences
      - guidance
      - unconfirmed
    slot_usage:
      version:
        description: The version of the set, raised on every change.
      title:
        description: What a person calls the standard or the repository.
        required: true
      conforms_to:
        description: >-
          The URI of the metadata schema. An override names the standard's set it builds on.
        required: true

  RequirementField:
    description: One metadata property a requirement set requires or recommends.
    slots:
      - property
      - qualifier
      - schema_org
      - obligation
      - form_label

  RepositoryRequirements:
    description: >-
      The requirements of the repository a researcher chose: its standard's set with the
      repository's override, if there is one, merged on top (ADR-0038 decision 2). The harness
      makes it when the choice is recorded, keeps it among the project's blobs, gives it to the
      drafters and checks the project against it. Not a set of the deployment's configuration, so
      it has no requirement_set_id of its own; requirement_sets names the sets it was merged from.
    slots:
      - re3data_id
      - repository_name
      - conforms_to
      - requirement_sets
      - fields
      - required_documents
      - recommended_documents
      - media_types
      - max_file_size
      - max_item_size
      - licences
      - warnings
      - unconfirmed
      - repository_url
    slot_usage:
      re3data_id:
        description: The repository's re3data identifier, such as r3d100012124.
        required: true
      conforms_to:
        description: The URI of the metadata schema of the standard's set.
        required: true

  RequirementSetUse:
    description: One requirement set a choice of repository was merged from, as the deployment held it.
    slots:
      - ref
      - sha256

  TableField:
    description: >-
      One field of a tabular resource, mirroring a Frictionless Table Schema field descriptor.
      Frictionless publishes no RDF namespace, so these slots carry see_also rather than a
      slot_uri (TODO(#20): revisit if Frictionless publishes term IRIs).
    see_also:
      - https://datapackage.org/standard/table-schema/#field
    slots:
      - name
      - field_type
      - field_format
      - field_description

  DraftRequest:
    description: >-
      What a drafter is asked for: a project document of one kind, drafted from the project's
      facts (docs/specs/projects.md). Every agent that returns a Document accepts it, so an
      agent that drafts a document can replace another without its caller changing. The project's
      facts are the inventory, the requirements of the repository chosen, the metadata record a
      person approved last and, to regenerate a document, its current version with any decision on
      it. In a project, the conductor puts the inventory, the requirements and the metadata record
      in from the project, replacing whatever the caller sent, so a caller leaves them out;
      outside a project, the caller sends them. In a project the conductor also fills
      current_version, the latest version of the project's document of that kind, or of the
      document redraft_document names, so a redraft is that document's next version. The answers
      a person recorded to the current version's questions are filled in by the conductor in the
      same way (docs/specs/drafting.md).
    slots:
      - schema_class
      - document_kind
      - inventory
      - requirements
      - metadata_record
      - current_version
      - draft_answers
      - redraft_document
    slot_usage:
      document_kind:
        description: The kind of document to draft.

  CurrentVersion:
    description: >-
      The version of a project document that a drafter is to regenerate: the document's latest,
      its text, and its state with the reason a person gave for any decision on it (ADR-0036
      decision 7). A drafter that regenerates it names version_ref in its payload's revises.
    slots:
      - version_ref
      - document_title
      - media_type
      - document_text
      - version_state
      - decision_reason

  ApprovedMetadataRecord:
    description: >-
      The project's metadata record as a person approved it: the version named by the last
      approval of a metadata_record document in the project (docs/specs/projects.md). A drafter
      treats what it holds as supplied, given by a person (docs/specs/drafting.md).
    slots:
      - version_ref
      - media_type
      - conforms_to
      - document_text

  DraftAnswer:
    description: >-
      A person's answer to one question a version of the document asked (DocumentQuestion). The
      drafter places answer_text, as given, in the gap or cell the question names and marks it
      supplied (docs/specs/drafting.md).
    slots:
      - answered_question
      - answer_text

  # --- Grounding ------------------------------------------------------------------------------

  GroundingRef:
    description: >-
      The identity and content hash of one retrieved thing a payload rests on. The only way a
      payload may name an external resource as a decided identity, and the only place it names
      it: what the reference identifies is read from the evidence item with the same source_id
      and content_hash (docs/specs/grounding.md). The linter matches every GroundingRef against a retrieval
      span on both fields.
    slots:
      - source_id
      - content_hash

  Grounded:
    mixin: true
    description: >-
      Mixed into every payload class and every item class that asserts an identity. The linter
      walks a payload document for grounded_on lists and never needs to know the payload class;
      a payload that lacks grounded_on at its root is a violation, not a pass.
    slots:
      - grounded_on

  Input:
    abstract: true
    description: >-
      Any input: an object that names its class in schema_class. The core checks nothing else;
      the class schema of the agent's accepted input class does (docs/specs/contract.md).
    annotations:
      open: true
    slots:
      - schema_class

  Payload:
    abstract: true
    description: >-
      Any payload: an object that names its class in schema_class and mixes in Grounded. The core
      checks nothing else; the class schema of the agent's payload class does (docs/specs/contract.md).
    annotations:
      open: true
    mixins:
      - Grounded
    slots:
      - schema_class

  # --- Payloads -------------------------------------------------------------------------------
  # Each payload class carries schema_class and mixes in Grounded.

  Reply:
    description: >-
      The payload of a conversational agent: the text of its reply. An orchestrator's reply is
      grounded on its input and on the envelopes of the invocations it delegated to.
    mixins:
      - Grounded
    slots:
      - schema_class
      - reply_text
      - reply_derivation
      - conversation_title
      - reply_questions
      - new_project_title
      - new_project_entry

  Question:
    description: >-
      One question a conversational agent asks the researcher in its reply, shown as a form field
      and answered with the reply's other questions in the next turn. A choice question has a
      fixed set of options, of which one or several may be chosen, and where question_other is
      true the researcher may answer in their own words instead; option values are unique within
      the question. A short or long text question is answered in the researcher's own words and
      has no options. Asking never suspends the run: the researcher may skip a question, or
      ignore them all and type (docs/specs/orchestration.md).
    slots:
      - question_key
      - question_prompt
      - question_kind
      - question_help
      - question_options
      - question_multiple
      - question_other

  ChoiceOption:
    description: One option of a choice question (a Question of kind choice).
    slots:
      - option_value
      - option_label
      - option_help

  Document:
    description: >-
      The payload of an agent that drafts or regenerates a project document: a metadata record, a
      README, a data dictionary or another document, as text (docs/specs/projects.md). The only payload class
      that becomes a project document.
    mixins:
      - Grounded
    slots:
      - schema_class
      - document_kind
      - document_title
      - media_type
      - conforms_to
      - document_text
      - document_derivation
      - revises
      - document_questions

  DocumentQuestion:
    description: >-
      A question a drafter asks the researcher about one gap in the version it drafted: a README
      section it could not write, or a data dictionary cell it could not fill. The target is
      either gap_section, with gap_part when the section is asked part by part, or gap_file,
      gap_field and gap_column together. question_id is derived
      from the target, so it is the same in every version that leaves the same gap
      (docs/specs/drafting.md). A question may offer a suggested_answer, with how it was derived
      (suggestion_derivation); a suggestion is never placed in the document, and becomes supplied
      only when a person records it as their answer.
    slots:
      - question_id
      - question_prompt
      - gap_section
      - gap_part
      - gap_file
      - gap_field
      - gap_column
      - suggested_answer
      - suggestion_derivation

  DocumentVersionRef:
    description: >-
      One version of a project document: the document the conductor minted an identifier for, and
      the version's number within it, counted from 1.
    slots:
      - document_id
      - version

  EvidenceItem:
    description: >-
      The retrieved content a grounding claim rests on, identified by a hash over its
      canonicalised projection (not the HTTP body).
    slots:
      - source_id
      - source_uri
      - retrieved_at
      - snapshot_ref
      - hash_algorithm
      - canonicalisation
      - content_hash
      - content

  Telemetry:
    description: >-
      Run measurements. The energy slots exist so P14 can be populated later without a schema
      change; at v0 they are null and not_measured.
    slots:
      - trace_id
      - model_id
      - input_tokens
      - output_tokens
      - energy_estimate_j
      - energy_method
      - model_calls

  ModelCall:
    description: >-
      One call an agent made to a language model, as the agent reports it
      (docs/specs/disclosure.md). model_id is the model the provider's response named, which may
      be more exact than the one configured. prompt_digest identifies the messages sent: the
      harness keeps them beside the run, never in the envelope, and checks that they hash to it.
    class_uri: prov:Activity
    slots:
      - model_provider
      - model_id
      - called_at
      - prompt_digest
      - input_tokens
      - output_tokens
    slot_usage:
      model_id:
        required: true

slots:

  invocation_id:
    description: UUIDv7 (RFC 9562), time-ordered so the append-only store sorts without an index.
    identifier: true
    required: true
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  agent_id:
    description: Stable identifier of the agent, e.g. advisor.standards or stub.abstain.
    required: true
    slot_uri: prov:wasAssociatedWith
  agent_version:
    required: true
  requirement_ids:
    description: Blueprint or project requirement identifiers the invocation is exercising.
    multivalued: true
  issued_at:
    range: datetime
    required: true
  completed_at:
    range: datetime
    required: true
  policy_bundle_ref:
    description: >-
      The institutional profile the conductor applied, as profile:<profile_id>@v<version>. The
      deployment chooses the profile; a request cannot name one (docs/specs/policy-and-identity.md).
    required: true
    pattern: "^profile:[a-z0-9][a-z0-9.-]*@v[0-9]+$"
  policy_digest:
    description: SHA-256 of the profile file's bytes, so a stored run names exactly the rules applied.
    required: true
    pattern: "^[0-9a-f]{64}$"
  contract_version:
    description: >-
      The version of this core contract the conductor governed the invocation under (docs/specs/contract.md).
    required: true
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
  input_schema:
    description: >-
      The digest of the class schema the input was checked against, as the agent's card carried
      it. Absent when the agent does not accept the input's class (docs/specs/contract.md).
    pattern: "^[0-9a-f]{64}$"
  payload_schema:
    description: >-
      The digest of the class schema the payload was checked against, as the agent's card
      carried it. Present exactly when there is a payload; the run store keeps the schema under
      this digest, so a stored run renders with the schema it was checked against (docs/specs/contract.md).
    pattern: "^[0-9a-f]{64}$"
  acting_for:
    description: >-
      The human this invocation acted for. Filled by the conductor from the authentication
      boundary, never from the request; a delegated invocation acts for its parent's (docs/specs/policy-and-identity.md).
    range: Principal
    required: true
    inlined: true
    slot_uri: prov:actedOnBehalfOf
  principal_id:
    description: >-
      An absolute IRI for the person or role; an ORCID iD for a person where one exists (P5).
    range: uri
    required: true
    pattern: "^[a-z][a-z0-9+.-]*:\\S+$"
  principal_kind:
    range: PrincipalKind
    required: true
  assurance:
    description: How the harness came to know the principal.
    range: Assurance
    required: true
  vouched_by:
    description: >-
      The IRI of the identity provider's issuer that vouched for the principal, for example
      https://orcid.org, so that a reader can weigh the claim by who made it. Required when
      assurance is authenticated and absent when it is asserted (docs/specs/policy-and-identity.md).
    range: uri
    slot_uri: dd:vouched_by
    pattern: "^[a-z][a-z0-9+.-]*:\\S+$"
  input:
    description: >-
      What the agent is asked to work on: an instance of one of the input classes the agent
      accepts, named by schema_class. The class schema the agent's card carries checks the rest
      (docs/specs/contract.md).
    range: Input
    required: true
    inlined: true
  schema_class:
    description: >-
      Type designator: the name of the class this object is an instance of. Discriminates the
      input and payload unions, and lets a consumer name a payload class it does not recognise.
    designates_type: true
    range: string
    required: true
  grounding_mode:
    description: >-
      The grounding contract the agent declared and the linter applied. Filled by the conductor
      from the agent's specification, never by the agent.
    range: GroundingMode
    required: true
  outcome:
    range: Outcome
    required: true
    inlined: true
  payload:
    description: >-
      Agent-specific payload; absent unless the outcome is succeeded. An instance of the payload
      class the agent declares, named by schema_class; every payload class mixes in Grounded.
      The class schema the agent's card carries checks the rest (docs/specs/contract.md).
    range: Payload
    inlined: true
  grounded_on:
    description: >-
      The retrieved things this object rests on. For grounding mode retrieval, each entry names
      a retrieval span; for input_only and none, the single entry is the input itself
      (source_id input:<invocation_id>, content_hash the dd-input-json-v1 hash).
    range: GroundingRef
    multivalued: true
    inlined_as_list: true
    required: true
  evidence:
    range: EvidenceItem
    multivalued: true
    inlined_as_list: true
  telemetry:
    range: Telemetry
    required: true
    inlined: true
  requires_human_review:
    description: >-
      Always true (C13, C15). Emitted as a constant so no consumer can produce an envelope
      claiming otherwise.
    range: boolean
    required: true
    equals_expression: "true"
  problem:
    range: ProblemDetails
    inlined: true
  conversation_id:
    description: >-
      UUIDv7 shared by every turn of one conversation. On a child invocation, the parent's.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  project_id:
    description: >-
      UUIDv7 of the project the invocation belongs to (docs/specs/projects.md). Set only by the
      conductor, from the conversation the request is a turn of or, on a child invocation, from
      the parent's grant; a caller's request that carries it is refused. Never sent to the agent.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  parent_invocation_id:
    description: >-
      The invocation that delegated this one. Set only by the conductor, from a delegation
      grant; a caller's request that carries it is refused.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  delegations:
    description: The child invocations this invocation delegated to, in the order they ran.
    range: Delegation
    multivalued: true
    inlined_as_list: true
  delegated_invocation_id:
    required: true
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  delegated_agent_id:
    required: true
  delegated_agent_version:
    required: true
  delegated_status:
    range: OutcomeStatus
    required: true

  status:
    range: OutcomeStatus
    required: true
  reason_code:
    range: ReasonCode
  referred_to:
    description: The human role a referred outcome hands to, e.g. data_steward.
  statement:
    description: A human-readable sentence explaining the outcome (C14).
    required: true

  type:
    description: RFC 9457 problem type URI.
    range: uri
    required: true
  title:
    slot_uri: dcterms:title
  http_status:
    range: integer
  detail:
  instance:
    range: uri
  resume_condition:
    description: What must happen for a suspended invocation to resume (extension member).
  resume_after:
    description: Earliest time a suspended invocation may resume (extension member).
    range: datetime

  message_text:
    description: What the user said in this turn.
    required: true
  history:
    description: The earlier turns of the conversation, oldest first.
    range: ConversationTurn
    multivalued: true
    inlined_as_list: true
  project_inventory:
    description: >-
      The inventory the conversation's project holds, filled by the conductor and never by the
      caller. Absent when the run is in no project, or its project holds no inventory.
    range: InventorySummary
    inlined: true
  project_entry:
    description: >-
      The Blueprint entry point (1, 2 or 3) the researcher chose for the conversation's project,
      the latest chosen. Filled by the conductor and never by the caller; absent when the run is
      in no project, or none was chosen.
    # 1 to 3, checked by the SDK's model: a bound is not in the schema, since a card's schemas
    # cross A2A as protobuf Structs, which turn it into a float (#333).
    range: integer
  project_progress:
    description: >-
      The process-flow steps the conversation's project log shows started, done or skipped, in flow
      order. Filled by the conductor and never by the caller; absent when the run is in no
      project. Derived from the log on every turn, never stored.
    range: StepProgress
    multivalued: true
    inlined_as_list: true
  project_title:
    description: >-
      The conversation's project's latest title. Filled by the conductor and never by the caller;
      absent when the run is in no project, or the project has no title yet.
    # 1 to 200 characters (dd_harness.projects.TITLE_MAX_LENGTH); this LinkML has no
    # maximum_length.
    pattern: "^.{1,200}$"
  project_title_by_researcher:
    description: >-
      Whether a person gave the project its title, so that a model's would be refused; false
      while the project has no title. Filled by the conductor and never by the caller; absent
      when the run is in no project.
    range: boolean
  project_documentation:
    description: >-
      The documents the conversation's project holds, without their text, filled by the conductor
      and never by the caller. Absent when the run is in no project, or its project holds none.
    range: DocumentationSummary
    multivalued: true
    inlined_as_list: true
  documentation_name:
    description: >-
      The file name the researcher attached the document under, without any folder.
    required: true
  documentation_digest:
    description: The SHA-256 of the document's UTF-8 text, by which the project keeps it.
    required: true
    pattern: "^[0-9a-f]{64}$"
  documentation_media_type:
    description: The document's media type, text/plain or text/markdown.
    required: true
  documentation_size:
    description: The size of the document's UTF-8 text, in bytes.
    range: integer
    required: true
  documentation_added_at:
    description: When the document was added to the project.
    range: datetime
    required: true
  project_entry_by_researcher:
    description: >-
      Whether the researcher chose the project's entry point, so that a model's would be refused;
      false when an orchestrator's model recorded it. Filled by the conductor and never by the
      caller; absent when the run is in no project, or no entry point was recorded.
    range: boolean
  step_id:
    description: A process-flow step id, `<phase>.<step>` (dd_sdk.process_flow).
    required: true
    pattern: "^[a-z]+\\.[a-z-]+$"
  step_state:
    range: StepState
    required: true
  inventory_digest:
    description: The inventory's dd-input-json-v1 hash, by which the project keeps it.
    required: true
    pattern: "^[0-9a-f]{64}$"
  inventory_file_count:
    description: How many files the inventory lists.
    range: integer
    required: true
  role:
    range: TurnRole
    required: true
  turn_text:
    description: What was said in the turn.
    required: true
  turn_agent_id:
    description: For an agent turn, the agent that produced it.
  turn_agent_version:
    description: For an agent turn, the version of the agent that produced it.
  turn_invocation_id:
    description: For an agent turn, the invocation it came from.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  reply_text:
    description: The reply, as prose.
    required: true
  reply_derivation:
    description: How reply_text came about. template for a rule-based agent, model for a model.
    range: Derivation
    required: true
  conversation_title:
    description: >-
      A short label a person can tell the conversation apart by, written by a model from the
      researcher's first message. Set only on a conversation's first turn, and only by an agent
      that declares it model-derived; absent otherwise.
    slot_uri: dcterms:title
    # One line of 1 to 80 characters; this LinkML has no maximum_length.
    pattern: "^.{1,80}$"
  new_project_title:
    description: >-
      A name for the conversation's project, written by a model once it knows what the research
      or dataset is. The conductor records it as the project's title when the run succeeds,
      unless a person has given one; absent when the reply names nothing. Only an agent that
      declares it model-derived sets it.
    slot_uri: dcterms:title
    # One line of 1 to 80 characters; this LinkML has no maximum_length.
    pattern: "^.{1,80}$"
  new_project_entry:
    description: >-
      The Blueprint entry point (1, 2 or 3) a model worked out from what the researcher said,
      such as data already collected. The conductor records it for the conversation's project
      when the run succeeds, unless the researcher has chosen one; absent when the reply records
      none. Only an agent that declares it model-derived sets it.
    # 1 to 3, checked by the SDK's model: a bound is not in the schema (#333).
    range: integer
  reply_questions:
    description: >-
      The questions the reply asks, in the order they are put to the researcher one at a time;
      between 1 and 8, with unique question_key values. Absent when the reply asks nothing or
      asks in prose.
    range: Question
    multivalued: true
    inlined_as_list: true
    # No cardinality bounds, for the reason given at question_options (#333).
  question_key:
    description: >-
      The question's identifier within its reply, which an answer names: a lower-case letter,
      then up to 39 lower-case letters, digits and hyphens.
    required: true
    pattern: "^[a-z][a-z0-9-]{0,39}$"
  question_prompt:
    description: The question, as a short line a person reads before the options.
    required: true
  question_kind:
    description: How the question is answered.
    range: QuestionKind
    required: true
  question_help:
    description: One or two sentences shown under the question to help the researcher answer it.
  question_options:
    description: >-
      The options of a choice question, in the order they are shown; between 2 and 12, with
      unique values. Absent for a text question.
    range: ChoiceOption
    multivalued: true
    inlined_as_list: true
    # No minimum_cardinality or maximum_cardinality: a card carries class schemas over A2A, which
    # turns their integers into doubles and so breaks the schema digest (#333). The Pydantic model
    # holds the bounds.
  question_multiple:
    description: True when several options may be chosen; one only otherwise. Choice questions only.
    range: boolean
  question_other:
    description: >-
      True when the researcher may answer in their own words instead of an option. Choice
      questions only.
    range: boolean
  option_value:
    description: >-
      What the agent reads back when the option is chosen. A string, never a number: a number
      reaches the agent as a floating-point value over A2A.
    required: true
  option_label:
    description: What the researcher reads.
    required: true
  option_help:
    description: One sentence that helps the researcher tell this option from the others.
  reply_answers:
    description: >-
      The researcher's answers to the questions the previous turn asked, when they answered them
      in the form. message_text still carries the answers as prose.
    range: ReplyAnswers
    inlined: true
  answer_to:
    description: The invocation whose reply asked the questions.
    required: true
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  given_answers:
    description: One answer for each question answered, in the order asked; at least one.
    range: QuestionAnswer
    multivalued: true
    inlined_as_list: true
    required: true
  answered_key:
    description: The question_key of the question answered.
    required: true
    pattern: "^[a-z][a-z0-9-]{0,39}$"
  answer_values:
    description: >-
      The values of the options chosen, for a choice question; empty when the researcher answered
      in their own words, and always empty for a text question.
    multivalued: true
  answer_words:
    description: >-
      The researcher's answer in their own words: the whole answer to a text question, or an
      answer given in place of an option where a choice question allows it.
  document_kind:
    range: DocumentKind
    required: true
  document_title:
    description: A short name a person can tell documents apart by, such as README for raw/.
    slot_uri: dcterms:title
  media_type:
    description: The media type of document_text, such as text/markdown or application/json.
    slot_uri: dcterms:format
    required: true
  conforms_to:
    description: The schema or profile document_text follows, such as a repository's metadata schema.
    slot_uri: dcterms:conformsTo
    range: uri
  document_text:
    description: The content of the document, as text; a structured record is serialised.
    required: true
  document_derivation:
    description: How document_text came about.
    range: Derivation
    required: true
  revises:
    description: >-
      The version this document replaces, when an agent regenerates it. Absent for a new document,
      for which the conductor mints a document_id.
    slot_uri: prov:wasRevisionOf
    range: DocumentVersionRef
    inlined: true
  document_questions:
    description: >-
      The questions this version asks the researcher, one for each gap it leaves. A README marks
      each gap with the HTML comment <!-- dd:gap question_id -->; a data dictionary leaves the cell
      empty and its source unknown.
    range: DocumentQuestion
    multivalued: true
    inlined_as_list: true
  question_id:
    description: >-
      The question's identifier within its document: q- and 16 lower-case hexadecimal digits,
      derived from the gap it targets.
    required: true
    pattern: "^q-[0-9a-f]{16}$"
  gap_section:
    description: The heading of the README section the question would fill, as the drafter wrote it.
  gap_part:
    description: >-
      The part of the README section the question would fill, such as Funding, when the drafter
      asks the section part by part. Present only with gap_section.
  gap_file:
    description: The path of the file whose data dictionary row the question would fill.
  gap_field:
    description: The field whose data dictionary row the question would fill.
  gap_column:
    description: The data dictionary column the question would fill, such as unit.
  suggested_answer:
    description: >-
      An answer the drafter suggests, offered to the person with the question and never placed in
      the document. It becomes supplied only when a person records it, or a correction of it, as
      their answer.
  suggestion_derivation:
    description: How suggested_answer came about. Present exactly when suggested_answer is.
    range: Derivation
  draft_answers:
    description: >-
      The answers a person recorded to the current version's questions. In a project the
      conductor fills them; a caller leaves them out.
    range: DraftAnswer
    multivalued: true
    inlined_as_list: true
  redraft_document:
    description: >-
      The project document to redraft, by its document_id, where the project holds more than one
      of the kind asked for. Without it the conductor gives the latest. In a project the conductor
      refuses a document that is not the project's or is of another kind; outside a project it is
      removed.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  answered_question:
    description: The question_id of the question answered.
    required: true
    pattern: "^q-[0-9a-f]{16}$"
  answer_text:
    description: The answer as the person gave it.
    required: true
  document_id:
    description: The identifier the conductor minted for the document, a UUIDv7.
    required: true
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  version:
    # No minimum_value: a card's schemas cross A2A as a protobuf Struct, which turns the bound
    # into a double and breaks the schema's digest (#333).
    description: The number of a version within its document, counted from 1.
    range: integer
    required: true
  inventory:
    description: >-
      The project's inventory, the latest added. In a project the conductor fills it; a caller
      leaves it out.
    range: FileInventory
    inlined: true
  requirements:
    description: >-
      The requirements of the repository chosen last. In a project the conductor fills it; a
      caller leaves it out.
    range: RepositoryRequirements
    inlined: true
  metadata_record:
    description: >-
      The project's metadata record, the version a person approved last, if any has been. In a
      project the conductor fills it; a caller leaves it out.
    range: ApprovedMetadataRecord
    inlined: true
  current_version:
    description: >-
      The document's latest version, when the drafter is to regenerate it. Absent for a new
      document.
    range: CurrentVersion
    inlined: true
  version_ref:
    description: The version, by its document and number.
    range: DocumentVersionRef
    inlined: true
    required: true
  version_state:
    description: Whether a person has approved or rejected the version, or not yet decided.
    range: VersionState
    required: true
  decision_reason:
    description: >-
      The reason the person gave for their decision, in their words. Present for a rejection,
      and for an approval only if they gave one.

  name:
    required: true
  inventory_files:
    description: Every file under the dataset's root folder that the command read, sorted by path.
    range: InventoryFile
    multivalued: true
    inlined_as_list: true
  inventory_tool:
    description: The command that made the inventory, such as dd-inventory.
    slot_uri: prov:wasGeneratedBy
    required: true
  inventory_tool_version:
    description: The version of the command that made the inventory.
    required: true
  inventory_identified_with:
    description: >-
      What identified the formats, such as fido 1.6.1 with PRONOM signatures v109, or that only
      file extensions were used.
  inventory_made_at:
    description: When the inventory was made.
    slot_uri: prov:generatedAtTime
    range: datetime
    required: true
  inventory_limitations:
    description: What the inventory left out or could not do, such as files it skipped.
    multivalued: true
  file_path:
    description: >-
      The file's path relative to the dataset's root folder, with forward slashes. Never an
      absolute path, which would say where the data live.
    required: true
    pattern: "^[^/]"
  file_size:
    description: The file's size in bytes.
    slot_uri: dcat:byteSize
    range: integer
    required: true
  file_sha256:
    description: >-
      The SHA-256 digest of the file's bytes, in lowercase hex, by which the file deposited can be
      shown to be the file described.
    slot_uri: spdx:checksumValue
    required: true
    pattern: "^[0-9a-f]{64}$"
  file_media_type:
    description: The file's media type (MIME type), when it could be told.
    slot_uri: dcat:mediaType
  file_pronom_ids:
    description: >-
      Every PRONOM unique identifier (PUID) the file matched, such as fmt/95 or x-fmt/18. More than
      one means the identification is ambiguous; none means the format is unknown.
    see_also:
      - https://www.nationalarchives.gov.uk/PRONOM/
    multivalued: true
  file_identified_by:
    description: >-
      How the PRONOM identifiers were arrived at: by the inventory command, or chosen by the
      researcher where the command found several matches or none.
    range: IdentificationMethod
    required: true
  file_fields:
    description: For a table, its fields as a Frictionless Table Schema inferred from a sample of rows.
    range: TableField
    multivalued: true
    inlined_as_list: true
  file_description:
    description: >-
      What the file is, in the researcher's words. The inventory command never fills it; a
      researcher states it beside the facts the command found (docs/specs/projects.md).
    slot_uri: dcterms:description
  file_role:
    description: >-
      What part the file plays in the dataset, as the researcher states it. Unset means not stated,
      not data.
    range: FileRole
  requirement_set_id:
    description: Identifies the requirement set, such as datacite-4 or orda.
    required: true
    pattern: "^[a-z0-9][a-z0-9-]*$"
  url:
    description: Where the standard or the repository is described.
    slot_uri: schema:url
    range: uri
  re3data_names:
    description: >-
      A standard's set only: the metadataStandardName values in re3data that select it.
    multivalued: true
  re3data_id:
    description: "An override only: the repository's re3data identifier, such as r3d100012124."
    pattern: "^r3d[0-9]{9}$"
  fields:
    description: The metadata properties the set requires or recommends.
    range: RequirementField
    multivalued: true
    inlined_as_list: true
  required_documents:
    description: The document kinds that must have an approved version before a package is built.
    range: DocumentKind
    multivalued: true
  recommended_documents:
    description: The document kinds whose absence is a warning.
    range: DocumentKind
    multivalued: true
  media_types:
    description: "An override only: the media types the repository accepts. Empty means any."
    multivalued: true
  max_file_size:
    description: "An override only: the largest file the repository accepts, in bytes."
    range: integer
  max_item_size:
    description: "An override only: the largest deposit the repository accepts, in bytes."
    range: integer
  licences:
    description: >-
      An override only: the licences the repository offers, each an SPDX identifier or the URL of
      the repository's own terms.
    multivalued: true
  guidance:
    description: The pages the set's values were taken from, so that a steward can check them.
    range: uri
    multivalued: true
  unconfirmed:
    description: >-
      What the set's sources leave open, each a short statement naming the issue that will settle
      it, such as "Whether ORDA's form makes any other field mandatory (#385)". Shown to the
      person depositing; in a merged set, the standard's first, then the override's.
    multivalued: true
  repository_url:
    description: >-
      Where the chosen repository is, taken from its override's url; absent when the deployment
      has no override for it.
    range: uri
  property:
    description: The schema's property, such as DataCite's titles or types.resourceTypeGeneral.
    required: true
  qualifier:
    description: >-
      Values that narrow the property, such as a subjectScheme. Part of what identifies a field
      when an override is merged with its standard's set.
    range: Any
  schema_org:
    description: The schema.org term the property maps to, by which the record is read as RDF.
    required: true
  obligation:
    range: Obligation
    required: true
  form_label:
    description: >-
      An override only: the label of the repository's deposit form field the value goes in.
  repository_name:
    description: What the researcher calls the repository chosen, such as ORDA.
    required: true
  requirement_sets:
    description: The sets the requirements were merged from, the standard's first.
    range: RequirementSetUse
    multivalued: true
    inlined_as_list: true
    required: true
  ref:
    description: A requirement set, as <requirement_set_id>@v<version>.
    required: true
    pattern: "^[a-z0-9][a-z0-9-]*@v[0-9]+$"
  sha256:
    description: The SHA-256 digest of the set's file, in lowercase hex.
    required: true
    pattern: "^[0-9a-f]{64}$"
  warnings:
    description: >-
      What the researcher was told when the repository was chosen, such as that it does not list
      DataCite.
    multivalued: true
  field_type:
    description: >-
      Frictionless field type (string, number, integer, boolean, date, datetime, time, duration,
      geopoint, ...).
    see_also:
      - https://datapackage.org/standard/table-schema/#type
  field_format:
    see_also:
      - https://datapackage.org/standard/table-schema/#format
  field_description:
    slot_uri: dcterms:description
  snapshot_ref:
    description: Which copy of the registry answered, e.g. snapshot:2026-09-04 or live.
  source_id:
    required: true
  source_uri:
    range: uri
  retrieved_at:
    range: datetime
  hash_algorithm:
    required: true
  canonicalisation:
    required: true
  content_hash:
    required: true
    pattern: "^[0-9a-f]{64}$"
  content:
    description: >-
      The document the named canonicalisation turns into bytes, already projected, so that a
      reader or the linter (E1) can recompute content_hash from the envelope alone (docs/specs/grounding.md).
      Where a payload cites this item from grounded_on, this is what the citation identifies.
    range: Any

  trace_id:
    description: OpenTelemetry trace identifier, 32 lowercase hex characters.
  model_id:
  model_calls:
    description: >-
      Each call to a language model the agent made during the run, in the order made. Absent for
      an agent that called none.
    range: ModelCall
    multivalued: true
    inlined_as_list: true
  model_provider:
    description: Who serves the model, as the agent's card names it (anthropic).
    required: true
  called_at:
    description: When the agent sent the call.
    range: datetime
    required: true
  prompt_digest:
    description: >-
      SHA-256 of the prompt sent, as dd-prompt-json-v1: the JSON object of what the agent sent
      besides sampling parameters (system prompt, messages, tools), keys sorted, no whitespace,
      UTF-8 (dd_sdk.prompts).
    required: true
    pattern: "^[0-9a-f]{64}$"
  input_tokens:
    range: integer
  output_tokens:
    range: integer
  energy_estimate_j:
    range: float
  energy_method:
    range: EnergyMethod
    required: true

enums:

  Obligation:
    description: Whether a requirement set's field or document stops a package (docs/specs/deposit.md).
    permissible_values:
      required:
        description: A missing value is an sh:Violation; the package is not built.
      recommended:
        description: A missing value is an sh:Warning, shown to the researcher.

  IdentificationMethod:
    description: How a file's format was identified, from strongest to weakest (docs/specs/projects.md).
    permissible_values:
      signature:
        description: A PRONOM byte signature matched the file's content.
      container:
        description: A PRONOM container signature matched the files inside an archive.
      extension:
        description: Only the file name's extension was matched; the content was not recognised.
      none:
        description: Nothing matched.
      researcher:
        description: >-
          The researcher chose the format: one of several PRONOM matches the command found, or a
          media type where nothing matched.

  FileRole:
    description: What part a file plays in a dataset, as the researcher states it (docs/specs/projects.md).
    permissible_values:
      data:
        description: The research data itself.
      documentation:
        description: Describes the data, such as a README, codebook or protocol.
      code:
        description: Software that made, cleaned or analyses the data.
      other:
        description: Anything else.

  OutcomeStatus:
    description: >-
      The outcome vocabulary. The Blueprint does not define one; this is the harness's
      specification contribution.
    permissible_values:
      succeeded:
        description: The agent produced a payload it stands behind.
      abstained:
        description: >-
          The agent declined to recommend; reason_code says why. An equal output to succeeded,
          not an error.
      referred:
        description: The agent hands the decision to a human role named in referred_to.
      failed:
        description: The agent or harness could not complete; problem carries RFC 9457 details.
      suspended:
        description: Awaiting an external condition; problem carries the resumption condition.

  ReasonCode:
    description: >-
      Why an agent abstained or referred. Adapted from the standards-advisor experiment's
      NothingFoundReason.
    permissible_values:
      no_qualifying_resource:
        description: Candidates were retrieved, none met the qualification threshold.
      no_candidates_retrieved:
        description: The registry was searched and returned nothing.
      registry_unavailable:
        description: The registry could not be searched. Distinct from an empty search.
      not_applicable:
        description: The requirement does not apply to this input.
      insufficient_input:
        description: The profile lacks what the agent needs to search.
      capability_not_implemented:
        description: >-
          The agent is a stub or the capability is not yet built. Honest about a stub rather
          than implying a search.
      requires_human_judgement:
        description: The agent judged the decision to need a person.
      policy_requires_approval:
        description: The institutional profile requires approval for this action class.
      outside_agent_scope:
        description: The request asked for something this agent does not do.

  Derivation:
    permissible_values:
      template:
        description: Produced deterministically from retrieved fields.
      model:
        description: Produced by a language model.
      lexical:
        description: Produced by a keyword rule over retrieved fields.
      registry:
        description: Read directly from a curated registry field.

  DocumentKind:
    description: What a project document is for (docs/specs/projects.md).
    permissible_values:
      metadata_record:
        description: A record of the dataset in a repository's metadata schema.
      readme:
        description: A README for the dataset or one of its folders.
      data_dictionary:
        description: The fields of the dataset's tables and what each means.
      dmp:
        description: A data management plan.
      other:
        description: Any other documentation of the dataset.

  VersionState:
    description: >-
      The state of one version of a project document (ADR-0035 decision 6). Every version begins
      proposed; once approved or rejected, it does not change.
    permissible_values:
      proposed:
        description: No person has decided on the version yet.
      approved:
        description: A person approved the version.
      rejected:
        description: A person rejected the version, and gave a reason.

  GroundingMode:
    description: >-
      The grounding contract an agent declares. The linter applies a rule set per mode
      (docs/specs/grounding.md); an envelope always records which one applied.
    permissible_values:
      retrieval:
        description: >-
          The agent retrieves external records before any model call and every identity it
          asserts was retrieved (rules G1–G4).
      input_only:
        description: >-
          The agent works only over the input it was given. No retrieval span may appear; a
          model may be called; every grounding reference is the input hash (rules R1–R3).
      none:
        description: >-
          The agent is deterministic over its input: no retrieval and no model call (rules
          R1–R3 and N1).
      delegation:
        description: >-
          The agent works over its input and the envelopes of invocations it delegated through
          the harness. No retrieval span may appear; a model may be called; every grounding
          reference is the input hash or a recorded delegation (rules R1, D1–D3, docs/specs/orchestration.md).

  PrincipalKind:
    permissible_values:
      person:
        description: A named, identified person.
      accountable_role:
        description: >-
          The designated accountable human role for an invocation made on behalf of an
          institution rather than an individual (Blueprint §5.4).

  Assurance:
    description: >-
      How the harness came to know the principal (docs/specs/policy-and-identity.md).
    permissible_values:
      asserted:
        description: >-
          Named in the deployment's configuration and not verified by anyone. On a shared
          server every caller is recorded as that principal.
      authenticated:
        description: >-
          An identity provider vouched for the principal, and the harness verified its signed
          statement. vouched_by names the provider's issuer.

  StepState:
    description: How far a process-flow step has gone; a step with none of these states is open.
    permissible_values:
      started:
        description: The project holds work towards the step that a person has not yet approved.
      done:
        description: >-
          The project holds what the step produces, approved where a person decides, or the
          researcher marked the step done.
      skipped:
        description: The researcher marked the step as not applying to this project, or not wanted.

  QuestionKind:
    description: How a question a reply asks is answered, and so which form field shows it.
    permissible_values:
      choice:
        description: By choosing one or several of fixed options, or in own words where allowed.
      short_text:
        description: In the researcher's own words, on one line of at most 200 characters.
      long_text:
        description: In the researcher's own words, in up to 4000 characters over several lines.

  TurnRole:
    description: Who spoke in a conversation turn.
    permissible_values:
      user:
        description: The person, or the caller, addressing the agent.
      agent:
        description: An agent's reply, named by turn_agent_id and turn_agent_version.

  EnergyMethod:
    permissible_values:
      not_measured:
      estimated:
      measured:
