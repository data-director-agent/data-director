[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-sdk"
version = "0.2.0-alpha.4"
description = "Data Director agent SDK: the invocation contract, evidence hashing, trace helpers and the A2A agent server"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "pydantic>=2.14.1,<3",
  "jsonschema>=4.23",
  "opentelemetry-sdk>=1.44",
  "a2a-sdk[http-server]>=1.2.2,<2",
  "httpx>=0.28",
  "protobuf>=5",
  "starlette>=0.40",
  "uvicorn>=0.30",
  # So that `serve --reload` sees a prompt change, not only a change to Python.
  "watchfiles>=1.0",
]

[project.scripts]
# Regenerates JSON Schema from LinkML; needs the workspace's development dependencies (docs/specs/contract.md).
dd-gen-schema = "dd_sdk.schema.gen:main"
# Prepares every source an agent builds outside git (dd_sdk.sources, docs/specs/grounding.md).
dd-sources = "dd_sdk.sources:main"

[tool.deptry.per_rule_ignores]
# uvicorn imports watchfiles itself when asked to reload (`serve --reload`); nothing here does.
DEP002 = ["watchfiles"]
# `dd-gen-schema` imports these lazily and needs the workspace's development group (linkml).
DEP003 = ["linkml_runtime", "rdflib"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_sdk"]

# The TypeScript library beside the SDK (sdk/browser) is not part of the Python package.
[tool.hatch.build.targets.sdist]
exclude = ["browser"]
