[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-sdk"
version = "0.2.0-alpha"
description = "Data Director agent SDK: the invocation contract, evidence hashing, trace helpers and the A2A agent server"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]

dependencies = [
  "pydantic>=2.14.1,<3",
  "jsonschema>=4.23",
  "opentelemetry-sdk>=1.44",
  "a2a-sdk[http-server]>=1.2.2,<2",
  "uvicorn>=0.30",
  # So that `serve --reload` sees a prompt change, not only a change to Python.
  "watchfiles>=1.0",
]

[project.scripts]
# Regenerates JSON Schema from LinkML; needs the workspace's development dependencies (ADR-0019).
dd-gen-schema = "dd_sdk.schema.gen:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_sdk"]
