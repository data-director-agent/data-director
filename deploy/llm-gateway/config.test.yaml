# Test configuration: routes to a local fake provider (scripts/testing/fake_upstream.py),
# so no provider keys are needed and nothing is billed. Each fake call with
# max_tokens=50 uses 10 input + 50 output tokens. Input is priced at 0 to keep the
# arithmetic exact: every such call costs 50 x $0.004 = $0.20.
#
#   docker compose -f compose.yaml -f compose.test.yaml up -d
#   scripts/smoke_test.sh

model_list:
  - model_name: test-claude            # exercised via the Anthropic /v1/messages route
    litellm_params:
      model: anthropic/test-claude
      api_base: http://fake-upstream:8080
      api_key: not-used
    model_info:
      input_cost_per_token: 0          # fake prices, deliberately high output
      output_cost_per_token: 0.004

  - model_name: test-gpt               # exercised via the OpenAI /v1/chat/completions route
    litellm_params:
      model: openai/test-gpt
      api_base: http://fake-upstream:8080/v1
      api_key: not-used
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0.004

  # Named like the model Data Director agents use (DD_MODEL_ID), so an agent-style client can
  # be pointed at the test stack with ANTHROPIC_BASE_URL alone.
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_base: http://fake-upstream:8080
      api_key: not-used
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0.004

  # Patterns, as config.yaml routes gpt-* and gemini-*: any model named test-gpt-<x> or
  # test-gemini-<x> is served, as the model broker's calls for OpenAI and Gemini ask for them.
  - model_name: "test-gpt-*"
    litellm_params:
      model: "openai/test-gpt-*"
      api_base: http://fake-upstream:8080/v1
      api_key: not-used
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0.004

  - model_name: "test-gemini-*"
    litellm_params:
      model: "openai/test-gemini-*"
      api_base: http://fake-upstream:8080/v1
      api_key: not-used
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0.004

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  global_max_parallel_requests: 500
  # Small, so that smoke_test.sh can cross each limit with a short request. The calls it makes
  # elsewhere use max_tokens=50 and a short prompt, which are inside them.
  dd_token_guard:
    default_max_tokens: 20
    max_output_tokens: 100
    max_input_chars: 3000

litellm_settings:
  callbacks: ["prometheus", "dd_token_guard.proxy_handler_instance"]
  prometheus_initialize_budget_metrics: true   # publish budget gauges for every key/team/user
  turn_off_message_logging: true
  # As config.yaml, with roomier rates so that no test is slowed by a default, and a budget
  # ceiling of $100 that the team's $1.00 in smoke_test.sh stays well under.
  max_budget: 1000
  budget_duration: 30d
  request_timeout: 120
  num_retries: 1
  default_key_generate_params:
    max_budget: 25
    budget_duration: 30d
    tpm_limit: 1000000
    rpm_limit: 600
    max_parallel_requests: 50
  upperbound_key_generate_params:
    max_budget: 100
    budget_duration: 30d
    tpm_limit: 2000000
    rpm_limit: 1200
    max_parallel_requests: 100
