# Scrapes LiteLLM's /metrics. The endpoint needs an API key: put a LiteLLM key
# (e.g. a dedicated key with max_budget 0) in monitoring/litellm_key.
global:
  scrape_interval: 30s

# The spend alerts (alerts.yml), and where they go (alertmanager.yml).
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm_key
    static_configs:
      - targets: ["litellm:4000"]
