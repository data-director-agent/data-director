# LiteLLM gateway configuration.
# `model_name` is what clients ask for; `litellm_params.model` is the real provider model.
# A client's `model` must match a `model_name` here, or the gateway refuses the call. The entries
# for the providers use the providers' own model IDs, so a Data Director agent keeps its
# DD_MODEL_ID (default claude-sonnet-5-5) when its calls, or the model broker's, go through the
# gateway: Claude by name, and OpenAI and Gemini by pattern (`gpt-*`, `gemini-*`), which serves
# whichever model of that family the agent names. Patterns do not appear in /v1/models.
# Costs for known models come from LiteLLM's built-in price map. Override with
# input_cost_per_token / output_cost_per_token under model_info (USD per token).

model_list:
  # --- Anthropic ----------------------------------------------------------
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- OpenAI: every gpt- model. A model outside that family, such as one of the o-series,
  # needs an entry of its own, named by its ID.
  - model_name: "gpt-*"
    litellm_params:
      model: "openai/gpt-*"
      api_key: os.environ/OPENAI_API_KEY

  # --- Google Gemini (AI Studio key): every gemini- model. For Vertex AI use vertex_ai/gemini-*.
  - model_name: "gemini-*"
    litellm_params:
      model: "gemini/gemini-*"
      api_key: os.environ/GEMINI_API_KEY

  # --- Local Ollama: tokens metered, cost zero ------------------------------
  - model_name: llama-local
    litellm_params:
      model: ollama_chat/llama3.1
      api_base: os.environ/OLLAMA_API_BASE
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Most calls the gateway will have in flight at once, across every key. A backstop against a
  # runaway loop: budgets are checked before a call and can be overshot by the calls in flight.
  global_max_parallel_requests: 50
  # Limits on one request, applied by dd_token_guard.py before it reaches a provider. A request
  # that names no max_tokens gets default_max_tokens; one that asks for more than
  # max_output_tokens, or sends more than max_input_chars (about four per token), is refused.
  # The agents ask for at most 16000 output tokens (agents/orchestrator-model).
  dd_token_guard:
    default_max_tokens: 4096
    max_output_tokens: 32000
    max_input_chars: 1000000

litellm_settings:
  # Prometheus metrics at /metrics (requires an API key to scrape), and the per-request limits.
  callbacks: ["prometheus", "dd_token_guard.proxy_handler_instance"]
  # A budget for the whole gateway, across every key. When it is used up every model call is
  # refused until the period resets, so set it to what the deployment may spend in a period at
  # most, not to what it expects to. The figure is a placeholder: change it to suit.
  max_budget: 500
  budget_duration: 30d
  # A call that has not finished in this many seconds is dropped, and one failed call is retried
  # once, not several times: a retry is billed like the call it repeats.
  request_timeout: 120
  num_retries: 1
  # What a key gets for any limit its creator leaves out, so that no key is unlimited by accident.
  default_key_generate_params:
    max_budget: 25
    budget_duration: 30d
    tpm_limit: 200000
    rpm_limit: 60
    max_parallel_requests: 5
  # The most any key may be given, whoever creates it. A key made without a limit gets this one.
  # These apply to /key/generate only; teams and users are bounded by scripts/admin.py.
  upperbound_key_generate_params:
    max_budget: 100
    budget_duration: 30d
    tpm_limit: 1000000
    rpm_limit: 300
    max_parallel_requests: 20
  prometheus_initialize_budget_metrics: true   # publish budget gauges for every key/team/user
  # Uncomment to send traces to Langfuse (set LANGFUSE_* in .env):
  # success_callback: ["langfuse"]
  # Don't store prompt/response text in the spend logs (privacy):
  turn_off_message_logging: true
