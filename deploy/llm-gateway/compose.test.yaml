# Test overlay: swaps in config.test.yaml and adds a fake provider.
#   docker compose -f compose.yaml -f compose.test.yaml up -d
services:
  litellm:
    volumes: !override
      - ./config.test.yaml:/app/config.yaml:ro
    depends_on:
      fake-upstream:
        condition: service_started

  fake-upstream:
    image: ghcr.io/berriai/litellm:1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035   # reuse the image just for its Python
    entrypoint: ["python3", "/fake_upstream.py"]
    volumes:
      - ./scripts/testing/fake_upstream.py:/fake_upstream.py:ro
