# Test overlay: swaps in config.test.yaml and adds a fake provider.
#   docker compose -f compose.yaml -f compose.test.yaml up -d
services:
  litellm:
    volumes: !override
      - ./config.test.yaml:/app/config.yaml:ro
      - ./dd_token_guard.py:/app/dd_token_guard.py:ro
    depends_on:
      fake-upstream:
        condition: service_started

  fake-upstream:
    image: ghcr.io/berriai/litellm:1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46   # reuse the image just for its Python
    entrypoint: ["python3", "/fake_upstream.py"]
    volumes:
      - ./scripts/testing/fake_upstream.py:/fake_upstream.py:ro
