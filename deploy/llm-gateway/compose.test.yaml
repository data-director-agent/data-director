# Test overlay: swaps in config.test.yaml and adds a fake provider.
#   docker compose -f compose.yaml -f compose.test.yaml up -d
services:
  litellm:
    volumes: !override
      - ./config.test.yaml:/app/config.yaml:ro
    depends_on:
      fake-upstream:
        condition: service_started

  fake-upstream:
    image: ghcr.io/berriai/litellm:1.110.0@sha256:4295b064b22eb88f9530e616afc812edd47048891ba64896bfc3fa74e2b883c3   # reuse the image just for its Python
    entrypoint: ["python3", "/fake_upstream.py"]
    volumes:
      - ./scripts/testing/fake_upstream.py:/fake_upstream.py:ro
