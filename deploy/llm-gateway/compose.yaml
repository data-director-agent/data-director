# LiteLLM gateway + Postgres, with optional Prometheus/Grafana.
#
#   docker compose up -d                          # gateway + database
#   docker compose --profile monitoring up -d     # ...plus Prometheus and Grafana
#
# Test without provider keys: add  -f compose.test.yaml  (see README).

services:
  litellm:
    image: ghcr.io/berriai/litellm:1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46   # read release notes before bumping
    # By hand, the settings and secrets are in .env. On a VM, data-director-llm-gateway.service
    # passes them in its environment instead, from root's files (deploy/README.md), so .env is
    # optional and the ones the gateway needs are named here.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-False}
    volumes:
      # The models: this directory's config.yaml, or the file DD_GATEWAY_CONFIG names (on a VM,
      # /etc/data-director/llm-gateway.yaml when the operator has written one).
      - ${DD_GATEWAY_CONFIG:-./config.yaml}:/app/config.yaml:ro
      # The per-request limits the config names under callbacks: loaded from the config's directory.
      - ./dd_token_guard.py:/app/dd_token_guard.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Bound to localhost only. Put a TLS reverse proxy in front before
      # exposing it to colleagues (see README).
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on the host
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16.16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/litellm_key:/etc/prometheus/litellm_key:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [litellm]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

# Docker would take the next free block of its default pool for this network, which is
# 172.18.0.0/16 on a host that already has docker0, and that is a University's Wi-Fi range. The
# subnet is pinned instead, outside the ranges campus networks use (README, "On the VM").
networks:
  default:
    ipam:
      config:
        - subnet: ${DD_GATEWAY_SUBNET:-10.201.0.0/24}

volumes:
  pgdata:
  promdata:
  grafanadata:
