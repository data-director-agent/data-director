# LiteLLM gateway + Postgres, with optional Prometheus/Grafana.
#
#   docker compose up -d                          # gateway + database
#   docker compose --profile monitoring up -d     # ...plus Prometheus and Grafana
#
# Test without provider keys: add  -f compose.test.yaml  (see README).

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.109.0   # pinned; read release notes before bumping
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Bound to localhost only. Put a TLS reverse proxy in front before
      # exposing it to colleagues (see README).
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on the host
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/litellm_key:/etc/prometheus/litellm_key:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [litellm]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
