# The app's agent list for a deployment that runs the standards advisor as its own service, so
# that it can call a model without the app holding the key (ADR-0026). Point DD_AGENTS_CONFIG
# in /etc/data-director/app.env at this file (deploy/README.md). Otherwise as
# app/config/agents.yaml.
agents:
  - name: hello
    url: http://127.0.0.1:8101
  - name: quality
    url: http://127.0.0.1:8102
  # The name tells the app not to run its own, model-less, standards advisor as well.
  - name: standards
    url: http://127.0.0.1:8105
  - name: director
    url: http://127.0.0.1:8106
    timeout_s: 120
