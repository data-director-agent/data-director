# The orchestrator's model key (ADR-0026). systemd copies the root-only file into this unit's
# own credentials directory, so no other agent, though all run as one user, can read it. The
# unit does not start if the file is missing: enable this instance only once it is in place
# (deploy/README.md).
[Service]
LoadCredential=anthropic-api-key:/etc/data-director/credentials/orchestrator/anthropic-api-key
Environment=ANTHROPIC_API_KEY_FILE=anthropic-api-key
