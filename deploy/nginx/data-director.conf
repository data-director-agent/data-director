# The way in to the Data Director from outside the VM. install.sh copies this to
# /etc/nginx/sites-available/data-director with SERVER_NAME replaced (deploy/README.md).
#
# The app has no authentication of its own yet (#17): every run acts for the operator named in
# /etc/data-director/app.env (ADR-0018). Until it does, NGINX asks for a password, and only the
# people in /etc/nginx/data-director.htpasswd get in. Do not remove auth_basic without that.
#
# TLS follows the TLSRef "modern" configuration (guideline 6.0,
# https://configurator.tlsref.org/#server=nginx&config=modern&hsts&guideline=6.0), except:
# - No OCSP stapling: Let's Encrypt no longer runs an OCSP responder and its certificates name
#   none, so there is nothing to staple.
# - No ssl_ecdh_curve: X25519MLKEM768 needs OpenSSL 3.5, which Ubuntu 24.04 does not have, and
#   an unknown group stops NGINX starting. OpenSSL's default groups are the same set, less
#   ML-KEM where it is not available.
# - "listen ... http2" rather than "http2 on", which needs NGINX 1.25.1 (Ubuntu 24.04 has 1.24).
#
# The certificate is certbot's, filed under the site's name; install.sh gets it if it is missing.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    return 308 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    ssl_certificate /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Two years, on every response including the 401. Not preloaded.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    auth_basic "Data Director (alpha)";
    auth_basic_user_file /etc/nginx/data-director.htpasswd;

    # Inputs are JSON metadata records, not uploads.
    client_max_body_size 2m;

    # The conductor's A2A endpoint takes a delegation agent's call back under a grant (ADR-0012).
    # The agents reach it on loopback; nobody outside the VM has reason to.
    location = /a2a { return 404; }
    location = /.well-known/agent-card.json { return 404; }

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run answers when it has ended, and the orchestrator waits up to 120 s for the agents
        # it delegates to (app/config/agents.yaml).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Ready for streamed runs over AG-UI (#68).
        proxy_buffering off;
    }
}
