# The way in to the Data Director from outside the VM. install.sh copies this to
# /etc/nginx/sites-available/data-director with SERVER_NAME replaced (deploy/README.md).
#
# The app signs people in with ORCID (docs/specs/policy-and-identity.md) and answers 401 to every
# request that names no session, so NGINX adds no password of its own. Sign-in needs HTTPS: the
# session cookie is Secure, and the redirect URI registered with ORCID is https://SERVER_NAME.
#
# TLS follows the TLSRef "modern" configuration (guideline 6.0,
# https://configurator.tlsref.org/#server=nginx&config=modern&hsts&guideline=6.0), except:
# - No OCSP stapling: Let's Encrypt no longer runs an OCSP responder and its certificates name
#   none, so there is nothing to staple.
# - No ssl_ecdh_curve: X25519MLKEM768 needs OpenSSL 3.5, which Ubuntu 24.04 does not have, and
#   an unknown group stops NGINX starting. OpenSSL's default groups are the same set, less
#   ML-KEM where it is not available.
# - "listen ... http2" rather than "http2 on", which needs NGINX 1.25.1 (Ubuntu 24.04 has 1.24).
#
# The certificate is certbot's, filed under the site's name; install.sh gets it if it is missing.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    return 308 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    ssl_certificate /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Two years, on every response including the 401. Not preloaded.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Neither the app nor the workbench is meant to be framed by another site (clickjacking), and
    # no response is to be read as a type other than the one it declares.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Inputs are JSON metadata records, not uploads.
    client_max_body_size 2m;

    # The conductor's A2A endpoint takes a delegation agent's call back under a grant (docs/specs/orchestration.md).
    # The agents reach it on loopback; nobody outside the VM has reason to.
    location = /a2a { return 404; }
    location = /.well-known/agent-card.json { return 404; }

    # The app's version and uptime, for collectd's apache plugin, which reads them straight from
    # 127.0.0.1:7860 and not through here. The exact version tells an attacker which known issues
    # apply, and nobody outside the VM needs it.
    location = /server-status { return 404; }

    # The model broker's enrolment interface, on this origin so that the browser can send a
    # person's own model key to the broker without the app receiving it
    # (docs/specs/model-accounts.md, Enrolment; the app's DD_APP_MODEL_BROKER_URL=/broker). Only
    # /enrolment/ is passed on: the broker's interface for agents stays on loopback. Each request
    # carries a single-use ticket the app issued, so NGINX adds no check of its own. Nothing here
    # logs a request body, and a key is a few hundred bytes.
    location /broker/enrolment/ {
        proxy_pass http://127.0.0.1:8300/enrolment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run answers when it has ended, and the orchestrator waits up to 120 s for the agents
        # it delegates to (app/config/agents.yaml).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Ready for streamed runs over AG-UI (#68).
        proxy_buffering off;
    }
}

# The workbench, for admins only (deploy/systemd/data-director-workbench.service). It is a
# separate service on a port of its own: its viewer is written for the root of a site, so it
# cannot sit under a path of the app's. It signs admins in with ORCID itself, and answers 401 or
# 403 to anyone else, so NGINX adds no password here either. The certificate and TLS are the
# app's: a certificate names a host, not a port.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name SERVER_NAME;

    ssl_certificate /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Plain HTTP sent to this port is sent on to HTTPS rather than refused.
    error_page 497 =308 https://$host:8443$request_uri;

    client_max_body_size 2m;

    # As for the app: the workbench's A2A endpoint is for the agents on loopback.
    location = /a2a { return 404; }
    location = /.well-known/agent-card.json { return 404; }
    # The workbench has no status page; this keeps the app's from being asked for here too.
    location = /server-status { return 404; }

    # The model broker's enrolment interface, on this origin so that the browser can send a
    # person's own model key to the broker without the app receiving it
    # (docs/specs/model-accounts.md, Enrolment; the app's DD_APP_MODEL_BROKER_URL=/broker). Only
    # /enrolment/ is passed on: the broker's interface for agents stays on loopback. Each request
    # carries a single-use ticket the app issued, so NGINX adds no check of its own. Nothing here
    # logs a request body, and a key is a few hundred bytes.
    location /broker/enrolment/ {
        proxy_pass http://127.0.0.1:8300/enrolment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The workbench can run the model-backed orchestrator, which may take 300 s
        # (workbench/agents.yaml).
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
    }
}
