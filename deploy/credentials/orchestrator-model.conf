# The orchestrator's model key (docs/specs/policy-and-identity.md), as a drop-in for
# data-director-agent@orchestrator-model.service. systemd copies the root-only file into this unit's own
# credentials directory, so no other agent, though all run as one user, can read it.
#
# systemd does not start a unit whose credential file is missing (243/CREDENTIALS), so
# deploy/install.sh installs this drop-in only while
# /etc/data-director/credentials/orchestrator-model/anthropic-api-key exists, and removes it otherwise.
[Service]
LoadCredential=anthropic-api-key:/etc/data-director/credentials/orchestrator-model/anthropic-api-key
Environment=ANTHROPIC_API_KEY_FILE=anthropic-api-key
