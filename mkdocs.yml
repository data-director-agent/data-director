site_name: Data Director
site_description: A reference implementation of the RDA Data Director Agentic AI Blueprint
site_url: https://data-director-agent.github.io/data-director/
repo_url: https://github.com/data-director-agent/data-director
# Each page's edit link is its path from the repository root (docs/hooks.py sets it).
edit_uri: edit/main/
docs_dir: docs/guide
site_dir: site

# Mounts the repository's other documents at their own paths; see the docstring.
hooks:
  - docs/hooks.py
  # Writes the user guide's steps for making an inventory from the file the app reads.
  - docs/hooks_inventory.py

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  # The favicon is a copy of app/web/public/favicon.svg, which follows the system scheme itself.
  favicon: assets/favicon.svg
  # Two schemes, each chosen by the system's preference at first. The toggle then stores the
  # reader's choice. primary: custom takes the app's blue from stylesheets/accessibility.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - content.tabs.link
    - content.code.annotate
    - content.action.edit
    - content.code.copy
    - search.highlight

# search must be listed once any plugin is. redirects takes old: new pairs (paths relative to
# docs/guide/) when a page moves, so published links keep working. Page dates come from git.
plugins:
  - search
  - tags
  - redirects:
      redirect_maps: {}
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

# Where the theme falls short of WCAG 2.2 AA; scripts/check_site_accessibility.py checks the site.
extra_css:
  - stylesheets/accessibility.css
extra_javascript:
  - javascripts/accessibility.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A path that starts with / is a file elsewhere in the repository, mounted by docs/hooks.py; a
# glob takes every match the nav does not name elsewhere. Anything else is in docs/guide/.
nav:
  - Home: index.md
  - Privacy notice: privacy.md
  - User guide:
      - user-guide/index.md
      - Getting started: user-guide/getting-started.md
      - The workflow: user-guide/workflow.md
      - Using the conversation: user-guide/conversation.md
      - Running an agent: user-guide/running-an-agent.md
      - Making an inventory: user-guide/making-an-inventory.md
      - Attaching a document: user-guide/attaching-a-document.md
      - Using your ORCID record: user-guide/orcid-facts.md
      - Deciding project facts: user-guide/project-facts.md
      - Working with others: user-guide/members.md
      - Understanding outcomes: user-guide/outcomes.md
      - What is recorded: user-guide/records.md
      - Depositing your data: user-guide/depositing.md
      - Giving feedback: user-guide/feedback.md
      - Alpha usage agreement: user-guide/usage-agreement.md
  - Data Steward's Guide:
