# The Data Director app's institutional profile: the reference set the app uses unless DD_PROFILE
# names another (ADR-0017, ADR-0022). Keys are as in workbench/profiles/README.md.
# TODO: how a steward edits and reviews this profile in a deployment (#41, #57).
profile_id: data-director-app
version: 4
description: Reference profile for the Data Director app; enables every in-tree agent, requires approval for writes.

agents:
  standards.advisor: advise
  hello.world: advise
  quality.reviewer: advise
  director.stub: advise
  orchestrator.model: advise

# The agent the home page converses with (ADR-0024 §10). The rule-based stub needs no model key.
# A deployment with a key names orchestrator.model instead, and raises `version`.
orchestrator: director.stub

actions_requiring_approval:
  - deposit
  - metadata_write
