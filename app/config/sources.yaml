# Independent copies of the sources the app's agents cite (docs/specs/grounding.md), unless DD_SOURCES_CONFIG
# names another list. Paths are relative to this file; each copy is pinned by sha256, and a
# file that no longer matches its pin stops the app from starting. A copy marked `built: true`
# that `uv run dd-sources prepare` has not built leaves evidence citing it unresolved, with a
# warning at start-up.
# Format as in workbench/sources.yaml.
# TODO(#225): how an institution pins a copy of a source of its own.
sources:
  - snapshot_refs: ["snapshot:2026-09-04", "snapshot:2026-09-04 (stale)"]
    path: ../../agents/advisor-standards/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: 969642eed642d2f4cbb0e6999878cb3bf2480734c0bbab4fcd3db212ecdbcdf1
  - snapshot_refs: ["re3data:export:2026-11"]
    path: ../../agents/advisor-repository/data/re3data/registry.jsonl
    # Built from the pinned re3data export, not committed (agents/advisor-repository/README.md).
    built: true
    id_field: re3data_id
    sha256: 37e4ce9d248a72765357d5d14d966f7ac55eb9b9cd2160f442f305fe17acfcbd
  - snapshot_refs: ["fairsharing:snapshot:2026-10-29", "fairsharing:snapshot:2026-10-29 (stale)"]
    path: ../../agents/advisor-repository/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: cca3c0b34ec9510002308fe2b6309ba8f9e8e158070bcdafb9facc7aefff3a87
  - snapshot_refs: ["fairsharing-policy:snapshot:2026-10-29", "fairsharing-policy:snapshot:2026-10-29 (stale)"]
    path: ../../agents/advisor-policy/data/fairsharing/snapshot.jsonl
    id_field: fairsharing_id
    sha256: 828c6229b341ba4864c3af414f9a6be5b8bc32fcc0393babea187a6012a0426f
