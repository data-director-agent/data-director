# What any metadata record in the DataCite Metadata Schema must or should have (ADR-0038). Every
# repository a researcher chooses is checked against it, with the repository's override, if the
# deployment has one, merged on top. Keys are as in README.md one folder up.
requirement_set_id: datacite-4
version: 1
title: DataCite Metadata Schema 4
url: https://schema.datacite.org/meta/kernel-4/
conforms_to: http://datacite.org/schema/kernel-4
re3data_names:
  - DataCite Metadata Schema

# DataCite's mandatory properties are required and its recommended ones recommended; its optional
# ones are not listed. The identifier, publisher and publication year are mandatory in DataCite
# but filled in by the repository that mints the DOI, so they are not listed either. Each
# schema.org term follows DataCite's own mapping to schema.org.
fields:
  - property: titles
    schema_org: name
    obligation: required
  - property: creators
    schema_org: creator
    obligation: required
  - property: types.resourceTypeGeneral
    schema_org: additionalType
    obligation: required
  - property: subjects
    schema_org: keywords
    obligation: recommended
  - property: contributors
    schema_org: contributor
    obligation: recommended
  # DataCite recommends dates of any type. Creation is the one every dataset has.
  - property: dates
    qualifier: {dateType: Created}
    schema_org: dateCreated
    obligation: recommended
  - property: relatedIdentifiers
    schema_org: citation
    obligation: recommended
  - property: descriptions
    qualifier: {descriptionType: Abstract}
    schema_org: description
    obligation: recommended
  - property: geoLocations
    schema_org: spatialCoverage
    obligation: recommended

required_documents:
  - metadata_record
recommended_documents: []

guidance:
  - https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/overview/
  - https://www.re3data.org/schema
