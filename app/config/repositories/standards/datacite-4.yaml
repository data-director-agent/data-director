# What any metadata record in the DataCite Metadata Schema must or should have (docs/specs/deposit.md). A chosen
# repository is checked against it when its override names DataCite, when its re3data record
# declares DataCite, or when no other standard's set applies, with the repository's override, if
# the deployment has one, merged on top. Keys are as in README.md one folder up.
schema_class: RequirementSet
requirement_set_id: datacite-4
version: 3
title: DataCite Metadata Schema 4
url: https://schema.datacite.org/meta/kernel-4/
conforms_to: http://datacite.org/schema/kernel-4
re3data_names:
  - DataCite Metadata Schema

# DataCite's mandatory properties are required and its recommended ones recommended; its optional
# ones are not listed. The identifier, publisher and publication year are mandatory in DataCite
# but filled in by the repository that mints the DOI, so they are not fields: the publisher and
# publication year are listed under filled_by_repository, and the check before packaging says the
# repository fills them in. (The Zenodo transport's _ZENODO_FILLS leaves the same properties out
# of what it sends.) Each term follows DataCite's own mapping to schema.org. A field's
# value is supplied on the project's documents unless supplied_on names another page.
fields:
  - property: titles
    term: schema:name
    obligation: required
  - property: creators
    term: schema:creator
    obligation: required
    supplied_on: researchers
  - property: types.resourceTypeGeneral
    term: schema:additionalType
    obligation: required
  - property: subjects
    term: schema:keywords
    obligation: recommended
  - property: contributors
    term: schema:contributor
    obligation: recommended
    supplied_on: researchers
  # DataCite recommends dates of any type. Creation is the one every dataset has.
  - property: dates
    qualifier: {dateType: Created}
    term: schema:dateCreated
    obligation: recommended
  - property: relatedIdentifiers
    term: schema:citation
    obligation: recommended
  - property: descriptions
    qualifier: {descriptionType: Abstract}
    term: schema:description
    obligation: recommended
  - property: geoLocations
    term: schema:spatialCoverage
    obligation: recommended

required_documents:
  - metadata_record
recommended_documents: []

filled_by_repository:
  - publisher
  - publicationYear

guidance:
  - https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/overview/
  - https://www.re3data.org/schema
