# What the NERC EDS National Geoscience Data Centre (NGDC), run by the British Geological Survey,
# asks beyond DataCite's requirement set (docs/specs/deposit.md). The harness merges it with
# standards/datacite-4.yaml when a researcher chooses the NGDC, so that it can check a project
# against both and a drafter knows what to write. Keys are as in README.md one folder up. Checked
# against the NGDC's public pages, the validation script of its deposit form and its DataCite
# records (listed under `guidance`) on 2026-11-19; what they leave open is TODO(#1250).
#
# The NGDC takes deposits through a self-service form, the NGDC Digital Data Deposit Application,
# whose terms and conditions the depositor accepts there. Its steps after the first sit behind a
# CAPTCHA, so the form labels here are the names its metadata guidance uses. A DOI is asked for by
# email after the deposit.
schema_class: RequirementSet
requirement_set_id: ngdc
version: 1
title: NERC EDS National Geoscience Data Centre
url: https://transfer.bgs.ac.uk/ingestion
re3data_id: r3d100010189

# The NGDC's catalogue record is ISO 19115 (ISO 19139 XML, UK GEMINI 2.3 for some), but it
# registers every DOI it assigns with DataCite (client bl.nerc, prefix 10.5285). The drafter writes
# DataCite records only, so DataCite is the standard here until a GEMINI/ISO 19115 set exists
# (#401). The NGDC publishes no crosswalk from its form to DataCite; each field below is the
# DataCite property the form's answer would go in.
conforms_to: http://datacite.org/schema/kernel-4

fields:
  - property: titles
    schema_org: name
    obligation: required
    form_label: Title
  # 100 to 4000 characters: what, where, when, how, why and who, and whether the data are complete.
  - property: descriptions
    qualifier: {descriptionType: Abstract}
    schema_org: description
    obligation: required
    form_label: Abstract and data description
  # Required for every deposit. The NGDC's DataCite records do not carry it, but a DataCite record
  # would as a Methods description; its schema.org term must differ from the abstract's
  # (README.md), so it is measurementTechnique, as for the EIDC.
  - property: descriptions
    qualifier: {descriptionType: Methods}
    schema_org: measurementTechnique
    obligation: required
    form_label: Lineage statement
  - property: geoLocations
    schema_org: spatialCoverage
    obligation: required
    form_label: Area / geographical extent
  # The form requires the dates and the grant number of a NERC-funded deposit, but not of a
  # statutory or commercial one, so they are recommended here.
  - property: dates
    qualifier: {dateType: Collected}
    schema_org: temporalCoverage
    obligation: recommended
    form_label: Begin date and end date
  - property: fundingReferences
    schema_org: funding
    obligation: recommended
    form_label: Grant number

# The NGDC asks for README notes (acronyms, file types and versions, software, methods and
# instruments), and, for a DOI, every parameter labelled and given its units, for which the data
# dictionary stands. A NERC-funded project agrees a data management plan with the NGDC early in
# the grant.
required_documents:
  - metadata_record
  - readme
  - data_dictionary
recommended_documents:
  - dmp

# The NGDC prefers open formats and takes proprietary ones case by case, so no media type is
# refused here. A folder is uploaded as one zip, not zips within zips.
media_types: []

# max_file_size and max_item_size are left out: the form takes files of up to 1 GB, and about 20
# of them, but a larger deposit is handed over another way by arrangement, not refused.

# Open data are released under the Open Government Licence; another licence is agreed by email.
licences:
  - OGL-UK-3.0

guidance:
  - https://www.bgs.ac.uk/ngdc/deposit-data-with-ngdc/
  - https://transfer.bgs.ac.uk/ingestion
  - https://transfer.bgs.ac.uk/ingestion/js/validate.js
  - https://www.bgs.ac.uk/ngdc/download/ngdc-terms-and-conditions/?wpdmdl=630
  - https://www.bgs.ac.uk/ngdc/support-and-guidance/metadata/
  - https://www.bgs.ac.uk/ngdc/support-and-guidance/good-data-guidelines/
  - https://www.bgs.ac.uk/ngdc/support-and-guidance/preferred-digital-formats/
  - https://www.bgs.ac.uk/ngdc/support-and-guidance/nerc-grant-funded-researchers/
  - https://www.bgs.ac.uk/ngdc/support-and-guidance/confidentiality-and-data-sharing-agreements/
  - https://www.bgs.ac.uk/ngdc/citing-data/
  - https://api.datacite.org/dois?client-id=bl.nerc&query=publisher:%22NERC%20EDS%20National%20Geoscience%20Data%20Centre%22
  - https://www.re3data.org/repository/r3d100010189

# What the public pages leave open, as the researcher depositing by hand is told. Each names the
# issue that will settle it.
unconfirmed:
  - The labels of the deposit form's fields, and whether it requires keywords; they are behind a CAPTCHA (#1250).
  - Which licences the NGDC agrees to besides the Open Government Licence (#1250).
  - The ISO 19115 fields its catalogue record carries and a DataCite record does not (#401, #1250).
