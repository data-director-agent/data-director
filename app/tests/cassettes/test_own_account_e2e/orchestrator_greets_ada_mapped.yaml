# Written by hand, not recorded: three Chat Completions replies from OpenAI, for the orchestrator
# routed by the profile's model map (#843). The first asks for example.hello, the second replies
# and the third is the title model's. vcrpy matches on method and URI, so the request headers and
# bodies below are not compared, and the replies play back in order.
