[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-app"
# Alpha: exploratory (README.md).
version = "0.3.0-alpha.9"
description = "An alpha Data Director: a browser shell drawn from each agent's manifest, over the harness (docs/specs/app.md)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  # Capacity limiter for the listing routes (dd_app.listing_limit).
  "anyio>=4.15",
  "data-director-harness>=0.2.0a0",
  # Describing a folder on a local install (dd_app.folder_scan).
  "data-director-inventory>=0.1.0a4",
  "data-director-sdk>=0.2.0a0",
  "detect-secrets==1.5.0",
  "httpx>=0.28",
  "joserfc>=1.0",
  "pydantic>=2.14.1,<3",
  "starlette>=1.8.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
data-director = "dd_app.app:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-orchestrator-stub",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
  # A FAIR report run in a project, for the per-project runs listing
  # (tests/test_project_runs_by_class.py).
  "data-director-agent-advisor-fairness",
  # The minimum loop's agents and scanner (tests/test_minimum_loop.py).
  "data-director-agent-advisor-files",
  "data-director-agent-advisor-metadata",
  "data-director-agent-advisor-documentation",
  # The model broker, in process, for the enrolment flow (tests/test_model_account.py) and for
  # a run paid for by a person's own account (tests/test_own_account_e2e.py).
  "data-director-model-broker",
  "data-director-agent-orchestrator-model",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_app"]
