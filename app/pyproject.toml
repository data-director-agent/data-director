[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-app"
# Alpha: exploratory (README.md).
version = "0.3.0-alpha.2"
description = "An alpha Data Director: a browser shell drawn from each agent's manifest, over the harness (ADR-0024)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  "data-director-harness",
  "httpx>=0.28",
  "starlette>=1.8.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
data-director = "dd_app.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_app"]
