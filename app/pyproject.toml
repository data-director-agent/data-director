[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-app"
# Alpha: exploratory (README.md).
version = "0.3.0-alpha.4"
description = "An alpha Data Director: a browser shell drawn from each agent's manifest, over the harness (ADR-0024)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  "data-director-harness>=0.2.0a0",
  "data-director-sdk>=0.2.0a0",
  "httpx>=0.28",
  "starlette>=1.8.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
data-director = "dd_app.app:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-orchestrator-stub",
  "data-director-agent-example-hello",
  "data-director-agent-advisor-quality",
  "data-director-agent-advisor-standards",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_app"]
