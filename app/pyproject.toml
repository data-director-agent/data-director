[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-app"
# Alpha: exploratory, and ungoverned by the workbench (README.md).
version = "0.1.0a1"
description = "An alpha Data Director: a browser chat with a tool-using model over the FAIRsharing snapshot"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  "data-director-agent-r3",
  "pydantic-ai-slim[anthropic,openai]>=1.0",
  "gradio>=5.0",
]

[project.scripts]
data-director = "dd_app.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_app"]
