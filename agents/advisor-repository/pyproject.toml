[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-repository"
version = "0.1.0-alpha"
description = "advisor.repository: recommends and describes data repositories from re3data and FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "httpx>=0.28", "pyyaml>=6.0", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]

[project.scripts]
dd-advisor-repository = "dd_agent_advisor_repository.factory:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_repository"]
