[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-repository"
version = "0.1.0-alpha.3"
description = "advisor.repository: recommends and describes data repositories from re3data and FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "httpx>=0.28", "pydantic>=2.14.1,<3", "pyyaml>=6.0", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
# The SDK builds the Claude client (dd_sdk.model_anthropic.anthropic_client).
anthropic = ["data-director-sdk[anthropic]"]

[project.scripts]
dd-advisor-repository = "dd_agent_advisor_repository.factory:main"
dd-re3data = "dd_agent_advisor_repository.registry:main"

# The re3data registry is built from its pinned export, not committed; `dd-sources prepare` builds it.
[project.entry-points."dd.sources"]
re3data = "dd_agent_advisor_repository.registry:SOURCE"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_repository"]
