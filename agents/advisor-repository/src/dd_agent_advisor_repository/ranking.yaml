# How advisor.repository shortlists repositories when none is mandated. Read by rank.py.
#
# Certification carries no weight. Figure 3 says the agent should not weight paid certification
# above free evaluation, and re3data lists few certificates, so the fair weight is none.
# A commercial operator is never dropped; at an equal score it is listed after the others, and
# then one that lists a deposit fee after those that do not.
#
# Left out whatever their score: a repository closed to deposits, and one that takes deposits
# only from its own institution's members (re3data's "institutional membership" restriction,
# or typed only "institutional") unless the researcher's institution operates it.

# The researcher's institution's repositories are a fallback, in case no more specific
# destination (a repository of the discipline, or one a funder, journal or project requires)
# suits the data (#441). Affiliation adds no score. One that matches the discipline is ranked as
# any other; one that does not is offered as the institutional fit, without needing the floor,
# unless it lacks the access the data needs. Either is added beyond the cap and takes no other
# repository's place, so naming an institution never removes one from the shortlist.

# The shortlist is ordered by kind of fit, then by score within a kind.
order: [discipline, institutional, generalist]

# At most this many repositories are recommended, besides those the researcher's own institution
# operates.
max_candidates: 5
# Records retrieved per query from the registry: per theme, this many found by its text and this
# many filed under the DFG subjects it names.
search_limit: 10
# Text hits graded per theme or kind of data, so that a repository retrieved for its subject is
# graded on its text too. Only the first `search_limit` are retrieved for their text.
text_hits: 50
# The score a repository needs to be recommended.
confidence_floor: 0.3

# Generalist repositories, which take data from any discipline: Figure 3's "domain-specific or
# generalist". They are taken by identifier for every shortlist, and rank below any repository
# that matches the dataset's discipline.
generalists:
  - r3d100010468  # Zenodo
  - r3d100010066  # figshare
  - r3d100010051  # Harvard Dataverse
  - r3d100000044  # Dryad
  - r3d100011137  # Open Science Framework
  - r3d100011868  # Mendeley Data

# How well a repository matches one theme, from 0 to 1.
theme_match:
  # A text hit contains every word of the theme. The weakest hit for a theme grades this, the
  # best 1, and the rest by BM25 score in between.
  text_base: 0.5
  # Where the theme names a DFG subject (`dfg.resolve`) and the record lists subjects, this share
  # of the grade is how near the repository is filed to that subject, the rest its text. A theme
  # that names no subject, such as "moorland", is graded on its text alone.
  subject_share: 0.5
  # The subject grade when the repository is filed under the theme's subject (or one below it),
  # the subject just above it, or two levels above. The top level, such as Natural Sciences, never
  # counts: a third of re3data is filed under each.
  subject_grades: [1.0, 0.5, 0.25]

weights:
  # The mean of the theme grades: how well the repository matches the dataset's themes (its
  # disciplines), by text and by DFG subject.
  theme: 1.0
  # The mean of the text grades for the kinds of data. Kept below the floor, so a kind of data
  # alone never recommends a repository from another discipline (#440).
  data_kind: 0.2
  # A generalist repository. Above the floor and below a full theme match.
  generalist: 0.4
  # Operated in the researcher's country (#741). Far below the floor, so it reorders repositories
  # that already match and never recommends one by itself.
  country: 0.1
  # The access the data needs (Phase 2) is not listed.
  access_unmet: -0.5
