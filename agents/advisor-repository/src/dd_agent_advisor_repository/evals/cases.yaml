# The repository advisor's evaluation cases (docs/specs/evaluation.md; #1334, #1342).
#
# SOURCE. Real repositories and institutions only. Durham University's data repository, "Durham
# University Repositories" (DataCite bl.durham, https://researchdata.durham.ac.uk/), and the
# British Library Research Repository (DataCite bl.repo) both mint DataCite DOIs, and re3data
# lists neither under any name or address, as it does not list many an institution's own
# repository. The University of York's is in re3data (r3d100013241). Durham University's ROR is
# https://ror.org/01v29qb04, York's https://ror.org/04m01e293. The themes and kinds of data are
# those of an oral-history project; the plan's sentence is written for these cases.
#
# bases: the needs each case starts from, as `RepositoryNeeds` without `project_decisions`.
# plan: the sharing commitments of the plan, as a researcher confirmed them. Each is sent as a
#   `sharing_commitment` project fact, as the conductor gives confirmed ones in a project; outside
#   a project it leaves them as sent (dd_harness.project_facts).
#
# cases:
#   id, base     the case and the needs it starts from
#   commitments  which of `plan`'s commitment sets are confirmed (none if absent)
#   expect:
#     status, reason_code   the outcome (reason_code optional)
#     in_plan               each repository the plan names, by its registry identifier, which
#                           the researcher must see as "In your plan" and be able to choose
#     institutional         each repository of the researcher's institution re3data does not
#                           list, by its DataCite identifier, that must be offered
#     not_offered           each such repository of another institution, which must not be
#     shortlist             true where a shortlist is still expected beside what the plan names:
#                           a plan's repository adds to the shortlist and removes nothing

bases:
  durham:
    themes: [oral history]
    data_kinds: [audio recordings, interview transcripts, photographs]
    access: open
    affiliation: {name: Durham University, ror: "https://ror.org/01v29qb04"}
    country: GBR
  york:
    themes: [oral history]
    data_kinds: [audio recordings, interview transcripts, photographs]
    access: open
    affiliation: {name: University of York, ror: "https://ror.org/04m01e293"}
    country: GBR
  # Nothing to search for: no theme, kind of data or affiliation given, as when a researcher asks
  # only about the repositories their plan names.
  plan-only: {}

quote: &quote >-
  At the end of the project, audio masters, transcripts and the image archive will be deposited
  in Durham University Repositories and a copy offered to the British Library Research
  Repository.

plan:
  # One commitment per destination, each with the repository in its subject, as the plan checker
  # reads one sentence that names both (dd_agent_advisor_dmp.read_plan).
  separate:
    - subject: Audio masters, transcripts and image archive (Durham University Repositories)
      repository: Durham University Repositories
    - subject: Audio masters, transcripts and image archive (British Library Research Repository)
      repository: British Library Research Repository

cases:
  # A Durham researcher with no plan: the university's repository is offered beside the
  # shortlist, from DataCite's record, though re3data does not list it.
  - id: durham-no-plan
    base: durham
    expect: {status: succeeded, shortlist: true, institutional: [bl.durham]}

  # Another institution's researcher is not offered it: it takes deposits from Durham's members.
  - id: york-no-plan
    base: york
    expect: {status: succeeded, shortlist: true, not_offered: [bl.durham]}

  - id: durham-plan-confirmed
    base: durham
    commitments: separate
    expect:
      status: succeeded
      shortlist: true
      in_plan: [bl.durham, bl.repo]

  # A succeeded payload must rest on a record retrieved (docs/specs/grounding.md, G2). DataCite's
  # records are retrieved, so the plan's repositories are described and can be chosen, though
  # there is nothing else to search for.
  - id: plan-without-shortlist
    base: plan-only
    commitments: separate
    expect:
      status: succeeded
      in_plan: [bl.durham, bl.repo]
