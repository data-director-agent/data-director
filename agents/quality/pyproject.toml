[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-quality"
version = "0.1.0"
description = "quality.reviewer: a demonstration metadata-completeness agent"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk", "pyyaml>=6.0"]

[project.scripts]
dd-quality = "dd_agent_quality.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_quality"]
