[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-quality"
version = "0.1.1-alpha"
description = "quality.reviewer: a demonstration metadata-completeness agent"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "pyyaml>=6.0"]

[project.scripts]
dd-quality = "dd_agent_quality.agent:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_quality"]
