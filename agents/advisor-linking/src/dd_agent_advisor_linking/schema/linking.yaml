# The input and payload classes of advisor.linking, owned by this package (docs/specs/contract.md). It imports the
# core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-linking/src/dd_agent_advisor_linking/schema/linking.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's sketch (docs/specs/agents.md), not a settled format.
id: https://w3id.org/data-director/agents/linking
name: dd_agent_advisor_linking
title: advisor.linking classes
description: >-
  Identifiers a researcher wants to link a dataset to, and the Linking Adviser's suggested
  related identifiers in reply, for the researcher to review.
version: 0.3.0
license: MIT

prefixes:
  linking: https://w3id.org/data-director/agents/linking/
  linkml: https://w3id.org/linkml/
default_prefix: linking
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  LinkCandidates:
    description: >-
      Identifiers of the publications, people, organisations, grants and software a researcher
      wants to link a dataset to, as they were given: DOIs, ORCID iDs, ROR ids, grant numbers or
      anything else.
    slots:
      - schema_class
      - identifiers

  RelatedIdentifiers:
    description: >-
      The payload of advisor.linking: each identifier recognised, checked for form and put in
      canonical form, with a suggested way to record it, what it names where it was resolved, and
      every grant a grant number may name. It suggests linking metadata for the
      researcher to review; registering the links stays with the researcher and the repository
      (R11).
    mixins:
      - Grounded
    slots:
      - schema_class
      - links
      - summary
      - summary_derivation
      - limitations

  RelatedLink:
    description: One identifier as given, and what the adviser made of it.
    slots:
      - given
      - scheme
      - normalised
      - relation
      - valid
      - resolved
      - title
      - resource_type
      - candidates
      - message

  GrantCandidate:
    description: >-
      A grant that a grant number may name, as the source that holds it describes it. Where a
      number names more than one, the researcher chooses; the adviser does not.
    slots:
      - id
      - award
      - title
      - funder
      - funder_identifier
      - funding_stream
      - source

slots:

  identifiers:
    description: The identifiers to link, each as given.
    multivalued: true
  links:
    range: RelatedLink
    multivalued: true
    inlined_as_list: true
  summary:
    description: >-
      A short summary of the findings in plain language, for the researcher. It restates the
      findings and changes none of them.
  summary_derivation:
    description: >-
      How the summary came about: template, the rules' own summary, or model, where a model wrote
      it from the findings.
    range: Derivation
  limitations:
    description: What the adviser did not do, such as the identifiers it did not resolve.
    multivalued: true
  given:
    description: The identifier, as given.
    required: true
  scheme:
    description: The scheme it was recognised as, from schemes.yaml (doi, orcid, ror, grant), or unknown.
    required: true
  normalised:
    description: >-
      The identifier's canonical https form, for a DOI, ORCID iD or ROR id, or a grant number's
      grant DOI where it names one grant that has one.
  relation:
    description: >-
      A suggested DataCite relationType, such as IsSupplementTo, for the researcher to confirm.
      Absent where the adviser cannot tell.
  valid:
    description: >-
      Whether the identifier is well formed for its scheme. True does not mean it exists: only a
      link with resolved true was looked up.
    range: boolean
    required: true
  resolved:
    description: >-
      Whether the identifier (a DOI, ORCID iD, ROR id or grant number) was found through the tool
      gateway. A grant number is found when it names at least one grant, listed in candidates. Absent
      when no lookup was made; false when it was made and found nothing or failed, with the reason
      in message.
    range: boolean
  title:
    description: >-
      What a resolved identifier names, as the source gives it: a DOI's title, a person's public
      name, an organisation's name or a grant's title. Absent for a grant number that names more
      than one grant.
  resource_type:
    description: >-
      The type of what a resolved identifier names, as the source gives it: a DOI's resource type,
      Person for an ORCID iD, an organisation's first ROR type, or Grant for a grant number.
  candidates:
    description: >-
      Every grant a resolved grant number may name, for the researcher to choose from where there
      is more than one.
    range: GrantCandidate
    multivalued: true
    inlined_as_list: true
  message:
    description: What the researcher should check or do with the identifier.
    required: true
  id:
    description: >-
      What the grant's record is cited by: its grant DOI as a URL, or its OpenAIRE project page.
    required: true
  award:
    description: The award number, as the source gives it.
  funder:
    description: The funder's name.
  funder_identifier:
    description: >-
      The funder's identifier as a URL, a Crossref Funder ID or ROR id, where the source gives one.
  funding_stream:
    description: The funder's scheme or programme the grant was made under.
  source:
    description: The source that holds the grant's record (Crossref or OpenAIRE).
    required: true
