[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-linking"
version = "0.3.0a1"
description = "advisor.linking: the Linking Adviser persona"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "pydantic>=2.14.1,<3", "pyyaml>=6.0"]

[project.scripts]
dd-advisor-linking = "dd_agent_advisor_linking.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
  # The PID resolver's servers, which the gateway tests serve in process.
  "data-director-mcp-pid",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_linking"]
