# The input and payload classes of advisor.ethics, owned by this package (docs/specs/contract.md). It imports the
# core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-ethics/src/dd_agent_advisor_ethics/schema/ethics.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's (docs/specs/agents.md, invariant 14), not a settled format.
id: https://w3id.org/data-director/agents/ethics
name: dd_agent_advisor_ethics
title: advisor.ethics classes
description: >-
  What a researcher says about a dataset that bears on sensitive data and embargo, and the
  Research Ethics Adviser's flags in reply.
version: 0.1.0
license: MIT

prefixes:
  ethics: https://w3id.org/data-director/agents/ethics/
  linkml: https://w3id.org/linkml/
default_prefix: ethics
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  SensitivityContext:
    description: >-
      What the researcher has said about the dataset that bears on sensitive data: its field
      names, whether it involves people, and whether they intend an embargo. In a project the
      conductor also gives the project's inventory, whose field, file and folder names are
      checked as well, and whose personal data findings are carried over (#1540).
    mixins:
      - GivenProjectInventory
    slots:
      - schema_class
      - title
      - description
      - fields
      - involves_people
      - embargo_intended

  SensitivityFlags:
    description: >-
      The payload of advisor.ethics: fields that may hold sensitive data, for a person to review,
      and the questions the researcher must answer before sharing. It flags and never decides how
      sensitive data is treated (C2).
    mixins:
      - Grounded
    slots:
      - schema_class
      - flags
      - questions
      - inventory_findings
      - limitations
      - dropped

  SensitivityFlag:
    description: >-
      One field that may hold sensitive data, flagged by keyword (lexical) or by a model. A model
      may add a flag but never remove one the keywords raised.
    slots:
      - field
      - category
      - files
      - matched
      - reason
      - derivation

  SensitivityQuestion:
    description: >-
      One thing the researcher must answer or confirm before sharing, from the adviser's template
      or added by a model. A question about consent names the data use conditions it asks about.
    slots:
      - text
      - derivation
      - data_use_terms

  DataUseTerm:
    description: >-
      A data use condition from the GA4GH Data Use Ontology (DUO), as a pinned DUO release
      defines it: a permission, such as general research use, or a modifier, such as ethics
      approval required. Named for the researcher to check consent against, never chosen for
      them.
    slots:
      - term_id
      - shorthand
      - term_label
      - term_kind
      - term_iri

slots:

  title:
    description: The dataset's title.
  description:
    description: A short description of the dataset.
  fields:
    description: The names of the dataset's fields or columns.
    multivalued: true
  involves_people:
    description: Whether the data were collected from or about people. Unknown if absent.
    range: boolean
  embargo_intended:
    description: Whether the researcher intends an embargo. Unknown if absent.
    range: boolean
  flags:
    range: SensitivityFlag
    multivalued: true
    inlined_as_list: true
  questions:
    description: What the researcher must answer or confirm, with the people who can help.
    range: SensitivityQuestion
    multivalued: true
    inlined_as_list: true
  inventory_findings:
    description: >-
      Where the inventory command's personal data detector found what may be personal data,
      copied from the project's inventory as it is: never a value. Absent when no inventory was
      given or its detector did not run; empty when it ran and found nothing, which does not mean
      there is nothing.
    range: PersonalDataFinding
    multivalued: true
    inlined_as_list: true
  files:
    description: >-
      The inventory's files in which the name appears, as a table's field, a file's name or a
      folder in its path. Empty for a name only the caller gave.
    multivalued: true
  limitations:
    description: What this alpha does not yet do.
    multivalued: true
  dropped:
    description: >-
      What a model returned that was not used, and why: a flag naming a field not in the input or
      a category not in the table, or a question too long to be one.
    multivalued: true
  field:
    description: The field, file or folder name, as given.
    required: true
  category:
    description: The kind of sensitive data the name suggests, e.g. direct identifier.
    required: true
  matched:
    description: >-
      The keyword in keywords.yaml that the field name matched. Present exactly when the flag is
      lexical.
  reason:
    description: >-
      Why the model flagged the field, in a short phrase. Present exactly when the flag is from a
      model.
  derivation:
    description: How the value came about, lexical (the keyword table), template or model.
    range: Derivation
    required: true
  text:
    description: The question, as put to the researcher.
    required: true
  data_use_terms:
    description: >-
      The DUO conditions the question asks the researcher to check consent against, from the
      adviser's own list. Empty for a question that is not about consent.
    range: DataUseTerm
    multivalued: true
    inlined_as_list: true
  term_id:
    description: The DUO identifier, e.g. DUO:0000021.
    required: true
    pattern: "^DUO:[0-9]{7}$"
  shorthand:
    description: DUO's short code for the term, e.g. IRB, where it gives one.
  term_label:
    description: The term's label in the pinned DUO release.
    required: true
  term_kind:
    description: Whether the term is a data use permission or a modifier.
    required: true
    range: DataUseKind
  term_iri:
    description: The term's persistent IRI.
    range: uri
    required: true

enums:

  DataUseKind:
    description: The two kinds of DUO term.
    permissible_values:
      permission:
        description: What use the data may be put to.
      modifier:
        description: A condition on that use.
