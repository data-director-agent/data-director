[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-ethics"
version = "0.1.0a1"
description = "advisor.ethics: the Research Ethics Adviser persona (alpha)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "pydantic>=2.14.1,<3", "pyyaml>=6.0"]

[project.optional-dependencies]
# The SDK's model adapters, which the model-backed reader calls through (dd_sdk.model_provider):
# Claude, and any OpenAI-compatible endpoint.
model = ["data-director-sdk[anthropic,openai]"]

[project.scripts]
dd-advisor-ethics = "dd_agent_advisor_ethics.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_ethics"]
