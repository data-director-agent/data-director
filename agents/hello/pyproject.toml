[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-hello"
version = "0.1.0"
description = "hello.world: the template Data Director agent"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk"]

[project.scripts]
dd-hello = "dd_agent_hello.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_hello"]
