[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-chat"
# Alpha (agents/README.md): exploratory, ungoverned, and not an A2A service.
version = "0.1.0a1"
description = "An alpha Data Director: a browser chat with a tool-using model over the FAIRsharing snapshot"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  "data-director-agent-r3",
  "pydantic-ai-slim[anthropic,openai]>=1.0",
  "gradio>=5.0",
]

[project.scripts]
dd-chat = "dd_agent_chat.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_chat"]
