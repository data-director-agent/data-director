[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-director"
version = "0.1.1-alpha"
description = "director.stub: a rule-based stand-in for the Data Director orchestrator"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk", "pyyaml>=6.0"]

[project.scripts]
dd-director = "dd_agent_director.agent:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-hello",
  "data-director-agent-quality",
  "data-director-agent-standards",
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_director"]
