# director.stub's routing rules. Tried in order against the whole message text, ignoring case.
#
#   name          identifies the rule in the reply and in tests
#   agent_id      the agent the message is delegated to
#   pattern       a Python regular expression; its named groups fill `input`
#   input         the child input document; "{group}" placeholders are filled from the match;
#                 it names a class of the target agent's own; the workbench checks it against
#                 the class schema that agent's card carries (ADR-0019)
#   mention_input the child input for "@<agent_id> <text>"; "{rest}" is the text
#   relay_field   the child payload field quoted in the reply, if the child succeeded
#   example       shown to the user when nothing matches
#
# A new agent is routable only once a rule names it. The model-backed orchestrator,
# orchestrator.model, routes from the harness's manifest instead (ADR-0012 decision 13).
#
# entries: how a message names one of the Blueprint's three entry points (§8.1, ADR-0028), tried
# in order with re.search, ignoring case, after the rules above found nothing. A message that
# names one is answered with the steps from that entry, each with the agents whose manifest
# entry serves its requirement (dd_sdk.process_flow). Entry 1 is tried before Entry 2 so that
# "not yet collected" is not read as "collected".
rules:
  - name: greet
    agent_id: hello.world
    pattern: '^(?:hello|hi|greet)\s+(?P<name>.+?)[.!]*$'
    input: { schema_class: Salutation, greeted_name: "{name}" }
    mention_input: { schema_class: Salutation, greeted_name: "{rest}" }
    relay_field: greeting_text
    example: hello Ada

  - name: standards
    agent_id: standards.advisor
    pattern: '^(?:recommend\s+)?standards\s+for\s+(?P<topic>.+?)[.?!]*$'
    input: { schema_class: DatasetProfile, title: "{topic}", keywords: ["{topic}"] }
    mention_input: { schema_class: DatasetProfile, title: "{rest}", keywords: ["{rest}"] }
    example: standards for soil chemistry

  - name: quality
    agent_id: quality.reviewer
    pattern: '^review\s+(?:the\s+)?metadata\s+(?:for|of)\s+(?P<title>.+?)[.?!]*$'
    input: { schema_class: MetadataRecord, title: "{title}" }
    mention_input: { schema_class: MetadataRecord, title: "{rest}" }
    relay_field: score
    example: review metadata for Soil cores 2024

entries:
  - entry: 1
    pattern: '^(?:entry\s*)?1[.!]?$|before\s+(?:\w+\s+)?(?:data\s+)?collection|new\s+project|(?:not|n[''’]t)\s+(?:yet\s+)?(?:been\s+)?collected'
  - entry: 2
    pattern: '^(?:entry\s*)?2[.!]?$|\bcollected\b|prepar\w*\b.*\bfor\s+sharing'
  - entry: 3
    pattern: '^(?:entry\s*)?3[.!]?$|ready\s+to\s+(?:deposit|publish)'
