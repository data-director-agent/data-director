[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-standards"
version = "0.1.1-alpha.3"
description = "advisor.standards: recommends standards from FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "httpx>=0.28", "pydantic>=2.14.1,<3", "pyyaml>=6.0", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
# The SDK builds the Claude client (dd_sdk.model_anthropic.anthropic_client).
anthropic = ["data-director-sdk[anthropic]"]

[project.scripts]
dd-advisor-standards = "dd_agent_advisor_standards.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
  "data-director-workbench",
]

[tool.deptry.per_rule_ignores]
# The evaluations and test kit in src/ use the workbench, its `eval` extra (Inspect AI) and the
# harness; scripts/boundaries.toml lists the same ties. TODO(#275): move them out of src/.
DEP003 = ["inspect_ai"]
DEP004 = ["dd_harness", "workbench"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_standards"]
