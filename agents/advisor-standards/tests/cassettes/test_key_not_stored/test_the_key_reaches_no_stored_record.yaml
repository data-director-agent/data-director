# Written by hand, not recorded: one Messages API reply for the standards advisor's prompt, which
# submits a rationale for the first rule pick.
# vcrpy matches on method and URI, so the request headers and body below are not compared.
# A cassette recorded for real has its credential headers removed by `vcr_config` in the root
# conftest.py.
interactions:
- request:
    body: ''
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://api.anthropic.com/v1/messages
  response:
    body:
      string: "{\"id\": \"msg_cassette\", \"type\": \"message\", \"role\": \"assistant\", \"model\": \"claude-opus-5\", \"content\": [{\"type\": \"tool_use\", \"id\": \"toolu_cassette\", \"name\": \"submit_recommendations\", \"input\": {\"rationales\": [{\"record\": \"S1\", \"target\": \"dataset\", \"rationale\": \"This standard fits the soil survey described in the profile.\"}], \"additions\": [], \"concerns\": []}}], \"stop_reason\": \"tool_use\", \"stop_sequence\": null, \"usage\": {\"input_tokens\": 812, \"output_tokens\": 60}}"
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
version: 1
