# The input and payload classes of advisor.standards, owned by this package (docs/specs/contract.md). It
# imports the core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-standards/src/dd_agent_advisor_standards/schema/standards.yaml` to regenerate generated/, and
# keep ../classes.py in step; ClassSchema.of refuses a model that has drifted.
id: https://w3id.org/data-director/agents/standards
name: dd_agent_advisor_standards
title: advisor.standards classes
description: >-
  A minimal description of a dataset being planned or prepared (docs/specs/contract.md), and the vocabularies,
  ontologies and formats recommended for it.
version: 0.3.0
license: MIT

prefixes:
  standards: https://w3id.org/data-director/agents/standards/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
default_prefix: standards
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  DatasetProfile:
    class_uri: dcat:Dataset
    description: >-
      A minimal description of a dataset being planned or prepared: what it is about and how it
      is shaped. Every slot maps onto an external vocabulary rather than a Data Director namespace.
      In a project the conductor also gives the facts people decided; a decided field of study,
      description of the data or summary of the project fills what the profile leaves empty
      (#1529).
    mixins:
      - GivenProjectDecisions
    slots:
      - schema_class
      - title
      - description
      - keywords
      - themes
      - media_types
      - fields

  Recommendations:
    description: >-
      The standards advisor payload. Recommended vocabularies, ontologies and formats, each also
      proposed as a standard project fact for the researcher to choose or reject
      (docs/specs/projects.md).
    mixins:
      - Grounded
      - ProposesFacts
    slots:
      - schema_class
      - items
      - searched
      - limitations

  Recommendation:
    description: >-
      One recommended resource for one target. The resource is named only in grounded_on; its
      name, status and DOI are in the cited evidence item's content (docs/specs/grounding.md).
    mixins:
      - Grounded
    slots:
      - kind
      - target
      - score
      - rationale
      - rationale_derivation
      - classification_derivation
      - selection_derivation
      - concern
      - notes

  SearchedSummary:
    description: >-
      What was looked for, so a reader can judge an abstention as well as a recommendation.
    slots:
      - queries
      - snapshot_ref
      - candidates_retrieved
      - candidates_qualifying
      - from_project_record

slots:

  title:
    slot_uri: dcterms:title
  description:
    slot_uri: dcterms:description
  keywords:
    slot_uri: dcat:keyword
    multivalued: true
  themes:
    description: Discipline or subject, as free text or an IRI.
    slot_uri: dcat:theme
    multivalued: true
  media_types:
    slot_uri: dcat:mediaType
    multivalued: true
  fields:
    range: TableField
    multivalued: true
    inlined_as_list: true

  items:
    range: Recommendation
    multivalued: true
    inlined_as_list: true
  searched:
    range: SearchedSummary
    inlined: true
  kind:
    range: RecommendationKind
    required: true
  target:
    description: dataset, or field:<name> for a field-level recommendation.
    required: true
  score:
    range: float
  rationale:
    required: true
  rationale_derivation:
    range: Derivation
    required: true
  classification_derivation:
    range: Derivation
  selection_derivation:
    description: >-
      Who chose the record: lexical, by the ranking rules over the first search, or model, by a
      model from the records retrieved in the run, its own searches included.
    range: Derivation
  concern:
    description: >-
      A model's doubt that a record the rules chose suits the dataset. The recommendation is kept;
      a person decides.
  notes:
    description: Facts to weigh beside the recommendation, such as that a model chose it.
    multivalued: true
  limitations:
    description: What the advisor does not yet do.
    multivalued: true

  queries:
    multivalued: true
  snapshot_ref:
    description: Which copy of the registry answered, e.g. snapshot:2026-09-04 or live.
  candidates_retrieved:
    range: integer
  candidates_qualifying:
    range: integer
  from_project_record:
    description: >-
      Each value of the profile taken from a fact people in the project decided, because the input
      left it empty, said in a few words, such as the subject from the decided field of study.
    multivalued: true

enums:

  RecommendationKind:
    permissible_values:
      controlled_vocabulary:
        description: Concept linkage of field values to terms.
      ontology:
        description: Schema or model alignment.
      terminology_unclassified:
        description: >-
          A terminology resource the agent could not classify as vocabulary or ontology from
          the fields available.
      data_format:
      field_format:
        description: A field-level standard such as ISO 8601 for dates.
