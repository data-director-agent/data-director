# The input and payload classes of advisor.rights, owned by this package (docs/specs/contract.md). It imports the
# core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-rights/src/dd_agent_advisor_rights/schema/rights.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's sketch (docs/specs/agents.md), not a settled format: the
# licences come from the SPDX licence list (mcp-spdx) through the tool gateway where granted.
id: https://w3id.org/data-director/agents/rights
name: dd_agent_advisor_rights
title: advisor.rights classes
description: >-
  What a researcher says about a dataset that bears on its licence and access, and the Rights and
  Licensing Adviser's options in reply.
version: 0.1.0
license: MIT

prefixes:
  rights: https://w3id.org/data-director/agents/rights/
  linkml: https://w3id.org/linkml/
default_prefix: rights
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  RightsContext:
    description: >-
      What the researcher has said about the dataset that bears on its licence and access: the
      reuse they want to allow, whether the data are sensitive, any licence they are required to
      use, and whether the data include content from third parties. In a project the conductor
      also gives the facts people decided: a decided licence is the mandated one, and a decision
      to withhold or generalise a sensitive field or file says the data are sensitive.
    mixins:
      - GivenProjectDecisions
    slots:
      - schema_class
      - reuse_wanted
      - sensitive
      - mandated_licence
      - third_party_content

  RightsOptions:
    description: >-
      The payload of advisor.rights: licences and access levels for the researcher to choose
      from, and the questions to answer first. It lists options and never chooses one.
    mixins:
      - Grounded
    slots:
      - schema_class
      - licences
      - access_levels
      - questions
      - limitations
      - dropped

  LicenceOption:
    description: >-
      One licence the researcher could choose, always from the adviser's own table. A model may
      choose which of the table's licences fit the reuse wanted and their order, never add one.
    slots:
      - spdx_id
      - name
      - url
      - note
      - derivation

  RightsQuestion:
    description: >-
      One thing the researcher must answer or confirm first, from the adviser's template or added
      by a model.
    slots:
      - text
      - derivation

  AccessOption:
    description: One access level the researcher could set, and when it applies.
    slots:
      - level
      - when

slots:

  reuse_wanted:
    description: >-
      The reuse the researcher wants to allow, in their own words or as one of any, attribution,
      share-alike or non-commercial. Unknown if absent.
  sensitive:
    description: Whether the data hold personal or otherwise sensitive information. Unknown if absent.
    range: boolean
  mandated_licence:
    description: >-
      The SPDX identifier of a licence that a funder, journal or institution requires, if any.
  third_party_content:
    description: Whether the data include content whose rights belong to others. Unknown if absent.
    range: boolean
  licences:
    range: LicenceOption
    multivalued: true
    inlined_as_list: true
  access_levels:
    range: AccessOption
    multivalued: true
    inlined_as_list: true
  questions:
    description: What the researcher must answer or confirm, with the people who can help.
    range: RightsQuestion
    multivalued: true
    inlined_as_list: true
  limitations:
    description: What this adviser does not yet do.
    multivalued: true
  dropped:
    description: >-
      What the model replied that was not used, and why: a reuse it named that the table does not
      know, a licence not among those that fit, or a question it may not ask.
    multivalued: true
  derivation:
    description: >-
      How the value came about: template, by the adviser's rules (a keyword in the reuse wanted, a
      mandate, the fixed questions), or model, where a model read the reuse wanted or added a
      question.
    range: Derivation
    required: true
  text:
    description: The question, as put to the researcher.
    required: true
  spdx_id:
    description: The licence's SPDX identifier.
    required: true
  name:
    description: The licence's full name.
    required: true
  url:
    description: Where the licence text is published.
    required: true
  note:
    description: What the researcher should know about this licence, if anything.
  level:
    description: The access level, one of open, embargoed, restricted or closed.
    required: true
  when:
    description: When this access level applies, as a fixed sentence.
    required: true
