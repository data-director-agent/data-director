[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-policy"
version = "0.1.0-alpha.3"
description = "advisor.policy: checks funder, journal and institutional data policies from FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "httpx>=0.28", "pydantic>=2.14.1,<3", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
# The SDK builds the Claude client (dd_sdk.model_anthropic.anthropic_client).
anthropic = ["data-director-sdk[anthropic]"]

[project.scripts]
dd-advisor-policy = "dd_agent_advisor_policy.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_policy"]
