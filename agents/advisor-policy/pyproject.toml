[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-policy"
version = "0.1.0-alpha.3"
description = "advisor.policy: checks funder, journal and institutional data policies from FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
# pypdf reads policies published as PDF, behind `pdf_text.py` (docs/specs/dependencies.md).
dependencies = [
    "data-director-sdk>=0.2.0a0",
    # ROR's records and the readers of its registry and API (dd_mcp_pid.ror), shared with the PID
    # resolver server.
    "data-director-mcp-pid",
    # DOAJ's client (dd_mcp_doaj.journals): an open access journal's terms, with no key (#1517).
    "data-director-mcp-doaj",
    # ISSNs written as ISO 3297 writes them (dd_journals.issn), shared with the journal registry.
    "data-director-journals",
    "httpx>=0.28",
    "pydantic>=2.14.1,<3",
    "pypdf>=6.21.4,<8",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# The SDK's model adapters, which the model-backed writer or explainer calls through
# (dd_sdk.model_provider): Claude, and any OpenAI-compatible endpoint.
model = ["data-director-sdk[anthropic,openai]"]

[project.scripts]
dd-advisor-policy = "dd_agent_advisor_policy.factory:main"
dd-ror = "dd_agent_advisor_policy.ror:main"

# The ROR registry and the journal registry are built from their pinned dumps, not committed;
# `dd-sources prepare` builds them.
[project.entry-points."dd.sources"]
ror = "dd_agent_advisor_policy.ror_source:SOURCE"
journals = "dd_agent_advisor_policy.journals_source:SOURCE"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_policy"]
