# The input and payload classes of advisor.policy, owned by this package (docs/specs/contract.md). It imports
# the core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-policy/src/dd_agent_advisor_policy/schema/policy.yaml` to regenerate
# generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has drifted.
id: https://w3id.org/data-director/agents/policy
name: dd_agent_advisor_policy
title: advisor.policy classes
description: >-
  The funders, journals and institutions behind a dataset, and what their data policies ask of
  it (Phase 2 of the Blueprint's process flow).
version: 0.1.0
license: MIT

prefixes:
  policy: https://w3id.org/data-director/agents/policy/
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  schema: http://schema.org/
default_prefix: policy
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  PolicyContext:
    description: >-
      Who funds, publishes and hosts the research, and what the data is. The agent looks up each
      actor's data policy.
    slots:
      - schema_class
      - actors
      - disciplines
      - data_kinds
      - publication_date

  Actor:
    description: >-
      A funder, journal or institution. The FAIRsharing identifier of its policy is used when
      given; otherwise the name is looked up. A funder is first identified in ROR, by its ROR
      identifier when given, otherwise by its name. A journal is first identified in Crossref, by
      its ISSN when given, otherwise by its exact title, so that its publisher's policy is found
      too. The policy's own text is read from policy_url when given, as well as from the address
      each matched record names.
    slots:
      - role
      - name
      - fairsharing_id
      - ror_id
      - issn
      - policy_url

  PolicyChecks:
    description: >-
      The policy advisor payload. The policies matched to each actor, what each asks, where they
      differ, and the actors with no policy record. Conflicts are flagged for human review; the
      agent does not resolve them.
    mixins:
      - Grounded
    slots:
      - schema_class
      - policies
      - conflicts
      - mandated_repositories
      - no_record
      - readings
      - funders
      - journals
      - ambiguous
      - searched

  MatchedPolicy:
    description: >-
      One policy record matched to an actor. It is named only in grounded_on; the record's name,
      clauses and relations are in the cited evidence item's content (docs/specs/grounding.md).
    mixins:
      - Grounded
    slots:
      - actor
      - role
      - obligations
      - notes
      - rationale
      - rationale_derivation

  Obligation:
    description: >-
      What a policy record says about one kind of obligation, read from a curated field by a
      fixed rule.
    slots:
      - kind
      - strength
      - recorded_as

  PolicyConflict:
    description: >-
      Matched policies that state one kind of obligation differently. Grounded on every policy
      involved, and flagged for human review.
    mixins:
      - Grounded
    slots:
      - kind
      - description

  RepositoryRef:
    description: >-
      A repository a policy requires, in the form advisor.repository takes as
      RepositoryNeeds.mandated.
    slots:
      - name
      - re3data_id

  ResolvedFunder:
    description: >-
      A funder identified in ROR. Its ROR identifier is stated only in grounded_on; what ROR
      records about it is in the cited evidence item's content (docs/specs/grounding.md).
    mixins:
      - Grounded
    slots:
      - actor
      - crossref_funder_id

  PolicyReading:
    description: >-
      What a model read in one policy's own text, fetched from the address its FAIRsharing
      record names or the researcher gave. Grounded on the text, and on the policy record it was
      reached from, if any. Each obligation kept quotes the text word for word, and the code has
      found the quote in it; what was dropped, and why, is in dropped. A person confirms each
      against the policy.
    mixins:
      - Grounded
    slots:
      - actor
      - role
      - status
      - stated
      - dropped
      - reason

  StatedObligation:
    description: >-
      One obligation a policy's own text states, as a model read it: its kind, its strength and
      what it asks, with the passage that says so.
    slots:
      - kind
      - strength
      - value
      - quote

  ResolvedJournal:
    description: >-
      A journal identified in Crossref, grounded on each of its Crossref records. The publisher
      Crossref records is in the cited evidence items' content (docs/specs/grounding.md); its
      policy was searched for as well as the journal's own.
    mixins:
      - Grounded
    slots:
      - actor
      - issn

  AmbiguousActor:
    description: >-
      A funder whose name could mean more than one organisation in ROR, or a journal title that
      Crossref gives to journals of different publishers. Grounded on each candidate, likeliest
      first; the agent does not choose. Its policy was not looked up: the researcher says which
      they mean, by giving a funder's ROR identifier or a journal's ISSN.
    mixins:
      - Grounded
    slots:
      - actor
      - role

  SearchedSummary:
    description: >-
      What was looked for, so a reader can judge an abstention as well as a match.
    slots:
      - queries
      - snapshot_ref
      - policies_retrieved

slots:

  actors:
    range: Actor
    multivalued: true
    inlined_as_list: true
  disciplines:
    description: Discipline or subject, as free text.
    slot_uri: dcat:theme
    multivalued: true
  data_kinds:
    description: What the data is, e.g. interview transcripts or household survey microdata.
    multivalued: true
  publication_date:
    description: >-
      When the work the data supports is, or will be, published (YYYY, YYYY-MM or YYYY-MM-DD).
    pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$"

  role:
    range: ActorRole
    required: true
  name:
    slot_uri: schema:name
    required: true
  fairsharing_id:
    description: The FAIRsharing identifier of the actor's policy, e.g. FAIRsharing.636kdn.
    pattern: "^FAIRsharing\\.\\S+$"
  ror_id:
    description: >-
      The organisation's ROR identifier, e.g. https://ror.org/02b5d8509 or 02b5d8509.
    pattern: "^(https?://ror\\.org/)?0[a-z0-9]{6}[0-9]{2}$"
  issn:
    description: >-
      A journal's ISSN, print or electronic, e.g. 0022-1694. Given for a journal, it is how the
      journal and its publisher are identified in Crossref.
    pattern: "^\\d{4}-?\\d{3}[\\dXx]$"
  policy_url:
    description: >-
      The address of the page or PDF that publishes the actor's data policy, when the researcher
      knows it. Its text is read as well as that of any policy record matched.
    pattern: "^https?://\\S+$"
  re3data_id:
    description: The re3data identifier, e.g. r3d100010230.
    pattern: "^r3d\\d+$"

  policies:
    range: MatchedPolicy
    multivalued: true
    inlined_as_list: true
  conflicts:
    range: PolicyConflict
    multivalued: true
    inlined_as_list: true
  mandated_repositories:
    description: >-
      Repositories a matched policy requires, as FAIRsharing relates them. Empty when no policy
      record names one, which is not evidence that none is mandated.
    range: RepositoryRef
    multivalued: true
    inlined_as_list: true
  no_record:
    description: Actors for which no FAIRsharing policy record was found.
    multivalued: true
  readings:
    description: >-
      What a model read in each policy's own text, or why the text was not read. Each obligation
      quotes the passage it comes from; a person confirms it.
    range: PolicyReading
    multivalued: true
    inlined_as_list: true
  status:
    range: ReadingStatus
    required: true
  stated:
    range: StatedObligation
    multivalued: true
    inlined_as_list: true
  dropped:
    description: >-
      What the model said that was not kept, and why, such as a quote not found in the text.
    multivalued: true
  reason:
    description: Why the text was not read, or was read in part.
  value:
    description: What the policy asks, in a few words, such as a repository, a period or a licence.
    required: true
  quote:
    description: The passage of the policy's text that says so, word for word.
    required: true
  funders:
    description: >-
      The funders identified in ROR, each grounded on its ROR record, so that the identifier can
      be passed on.
    range: ResolvedFunder
    multivalued: true
    inlined_as_list: true
  journals:
    description: >-
      The journals identified in Crossref, each grounded on its Crossref records, so that its
      publisher's policy could be searched for too.
    range: ResolvedJournal
    multivalued: true
    inlined_as_list: true
  ambiguous:
    description: >-
      Funders whose name could mean more than one organisation in ROR, and journal titles that
      Crossref gives to journals of different publishers. The researcher should say which; their
      policies were not looked up.
    range: AmbiguousActor
    multivalued: true
    inlined_as_list: true
  crossref_funder_id:
    description: >-
      The Crossref Funder ID ROR prefers for the funder, where it names one, e.g. 501100000270.
  searched:
    range: SearchedSummary
    inlined: true

  actor:
    description: The name of the actor, as given in the input.
    required: true
  obligations:
    range: Obligation
    multivalued: true
    inlined_as_list: true
  notes:
    description: >-
      Facts to weigh beside the obligations, such as a policy subject outside the discipline or a
      policy dated after the publication.
    multivalued: true
  rationale:
    required: true
  rationale_derivation:
    range: Derivation
    required: true

  kind:
    range: ObligationKind
    required: true
  strength:
    range: Strength
    required: true
  recorded_as:
    description: >-
      The value FAIRsharing's curators recorded, such as "suggested" or "no", kept so that an
      unstated strength does not hide what the record says.
  description:
    required: true

  queries:
    multivalued: true
  snapshot_ref:
    description: Which copy of the registry answered, e.g. fairsharing-policy:snapshot:2026-10-29.
  policies_retrieved:
    range: integer

enums:

  ActorRole:
    permissible_values:
      funder:
      journal:
        description: >-
          A journal or its publisher. A journal's publisher's own policy is matched as well as
          the journal's.
      institution:
        description: The researcher's university or research organisation.

  ObligationKind:
    permissible_values:
      deposit:
        description: Sharing the data, usually by depositing it.
      data_availability_statement:
        description: A statement in the publication of where and how the data can be accessed.
      repository:
        description: Depositing in a particular repository.
      standard:
        description: Using a particular metadata or data standard.
      embargo:
        description: How long the data may be withheld.
      licence:
        description: The licence the outputs are released under.
      timing:
        description: When the data must be shared.

  ReadingStatus:
    permissible_values:
      read:
        description: The text was read; what it states is in stated.
      not_read:
        description: >-
          The text was not read: it could not be fetched, no model is configured, or the
          deployment's profile turns reading off.
      unreadable:
        description: The address answered with nothing that could be read as text.

  Strength:
    permissible_values:
      required:
      recommended:
      unstated:
        description: The policy record does not say.
