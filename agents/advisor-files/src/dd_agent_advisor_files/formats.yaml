# advisor.files's own judgements, which no registry gives (#955). A format's name, version, media
# type and extensions come from its PRONOM record (dd-formats); PRONOM says nothing about whether a
# format is open, so this table does.
#
# `open`: for each PRONOM identifier (PUID), whether the format is open (publicly specified and
# readable without proprietary software). A PUID not listed is described from its record but not
# judged open or not; add it here, with its record checked, rather than guess.
#
# `extensions`: for a file the inventory gives no PUID for, the format its last extension (lower
# case, no dot) suggests, that format's media type and whether it is open. The extension alone
# says nothing certain about a file's content, so such a file is reported as identified by
# extension only. A known extension the PRONOM record does not list is a check for a person.
open:
  x-fmt/18: true      # Comma Separated Values
  x-fmt/13: true      # Tab-separated Values
  x-fmt/111: true     # Plain Text File
  fmt/1149: true      # Markdown
  fmt/817: true       # JSON
  fmt/880: true       # JSON-LD
  fmt/101: true       # XML 1.0
  fmt/818: true       # YAML
  fmt/96: true        # HTML
  fmt/14: true        # PDF 1.0
  fmt/15: true        # PDF 1.1
  fmt/16: true        # PDF 1.2
  fmt/17: true        # PDF 1.3
  fmt/18: true        # PDF 1.4
  fmt/19: true        # PDF 1.5
  fmt/20: true        # PDF 1.6
  fmt/276: true       # PDF 1.7
  fmt/136: true       # OpenDocument Text 1.0
  fmt/290: true       # OpenDocument Text 1.1
  fmt/291: true       # OpenDocument Text 1.2
  fmt/1756: true      # OpenDocument Text 1.3
  fmt/2044: true      # OpenDocument Text 1.4
  fmt/137: true       # OpenDocument Spreadsheet 1.0
  fmt/294: true       # OpenDocument Spreadsheet 1.1
  fmt/295: true       # OpenDocument Spreadsheet 1.2
  fmt/1755: true      # OpenDocument Spreadsheet 1.3
  fmt/2045: true      # OpenDocument Spreadsheet 1.4
  fmt/412: true       # Microsoft Word 2007 onwards (OOXML)
  fmt/214: true       # Microsoft Excel 2007 onwards (OOXML)
  fmt/40: false       # Microsoft Word 97-2003
  fmt/61: false       # Microsoft Excel 97-2003
  fmt/62: false       # Microsoft Excel 2000-2003
  fmt/638: false      # SPSS Data File
  fmt/1029: false     # Stata Data 104
  fmt/1030: false     # Stata Data 105
  fmt/1031: false     # Stata Data 110
  fmt/1032: false     # Stata Data 111
  fmt/1033: false     # Stata Data 113
  fmt/1034: false     # Stata Data 114
  fmt/1035: false     # Stata Data 115
  fmt/1036: false     # Stata Data 117
  fmt/1037: false     # Stata Data 118
  fmt/1015: false     # SAS Data (Windows), generic
  fmt/1016: false     # SAS Data (Unix), generic
  fmt/607: false      # SAS Data (Windows) 9.1
  fmt/608: false      # SAS Data (Unix) 9.1
  fmt/1017: false     # SAS Data (Windows) 8.2
  fmt/1018: false     # SAS Data (Unix) 8.2
  fmt/1019: false     # SAS Data (Windows) 9.2
  fmt/1020: false     # SAS Data (Unix) 9.2
  fmt/1021: false     # SAS Data (Windows) 9.3
  fmt/1022: false     # SAS Data (Unix) 9.3
  fmt/1550: false     # MATLAB MAT-file Level 4
  fmt/806: false      # MATLAB MAT-file Level 5
  fmt/828: false      # MATLAB MAT-file Level 7.3
  fmt/282: true       # netCDF-3 Classic
  fmt/283: true       # netCDF-3 64-bit
  fmt/807: true       # HDF5 0
  fmt/286: true       # HDF5 1
  fmt/287: true       # HDF5 2
  fmt/2023: true      # Apache Parquet
  fmt/1135: true      # SQLite 2
  fmt/729: true       # SQLite 3
  fmt/353: true       # TIFF
  fmt/11: true        # PNG 1.0
  fmt/12: true        # PNG 1.1
  fmt/13: true        # PNG 1.2
  fmt/42: true        # JPEG (JFIF) 1.00
  fmt/43: true        # JPEG (JFIF) 1.01
  fmt/44: true        # JPEG (JFIF) 1.02
  fmt/91: true        # SVG 1.0
  fmt/92: true        # SVG 1.1
  fmt/6: true         # WAVE audio
  fmt/141: true       # WAVE audio (PCMWAVEFORMAT)
  fmt/279: true       # FLAC
