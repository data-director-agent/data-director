  fmt/199: false      # MPEG-4
  x-fmt/263: true     # ZIP
  x-fmt/266: true     # GZIP
  x-fmt/265: true     # Tar
  # Code: plain text in a publicly specified language, so open (#1071).
  fmt/1599: true      # R script
  fmt/938: true       # Python script
  fmt/1678: true      # MATLAB script
  fmt/1598: true      # Stata do-file
  fmt/1119: true      # Jupyter notebook
