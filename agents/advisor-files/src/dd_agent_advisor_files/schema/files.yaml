# The payload class of advisor.files, owned by this package (ADR-0019). It imports the core
# contract as `data_director`, whose FileInventory is the agent's input. After an edit, run
# `uv run dd-gen-schema agents/advisor-files/src/dd_agent_advisor_files/schema/files.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are a mock's sketch (ADR-0033 decision 5), not a settled format.
id: https://w3id.org/data-director/agents/files
name: dd_agent_advisor_files
title: advisor.files classes
description: >-
  The File Archivist's assessment, in reply to a project's file inventory, of whether each file's
  format is open.
version: 0.2.0
license: MIT

prefixes:
  files: https://w3id.org/data-director/agents/files/
  linkml: https://w3id.org/linkml/
default_prefix: files
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  FormatAssessment:
    description: >-
      The payload of advisor.files: each file of the inventory with the format it is judged to
      be, and whether that format is open. It judges from the inventory alone and reads no file.
    mixins:
      - Grounded
    slots:
      - schema_class
      - assessments
      - limitations

  FileAssessment:
    description: One file of the inventory and the format it is judged to be.
    slots:
      - path
      - extension
      - format_name
      - media_type
      - open_format
      - judged_by

slots:

  assessments:
    range: FileAssessment
    multivalued: true
    inlined_as_list: true
  path:
    description: The file's path in the inventory (file_path).
    required: true
  extension:
    description: The file name's last extension, lower case and without the dot; empty if none.
    required: true
  format_name:
    description: The format the file is judged to be, from formats.yaml, or unknown.
    required: true
  media_type:
    description: The format's media type, from the inventory if it gave one, else from formats.yaml.
  open_format:
    description: Whether formats.yaml records the format as open. False for an unknown format.
    range: boolean
    required: true
  judged_by:
    description: What the judgement rests on.
    range: JudgedBy
    required: true
  limitations:
    description: What this mock does not yet do.
    multivalued: true

enums:

  JudgedBy:
    permissible_values:
      media_type:
        description: The media type the inventory gives, which fido may have read from content.
      extension:
        description: The file name's extension; the inventory's media type was absent or unknown.
      nothing:
        description: Neither the media type nor the extension is in formats.yaml.
