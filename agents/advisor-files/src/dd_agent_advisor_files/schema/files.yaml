# The payload class of advisor.files, owned by this package (docs/specs/contract.md). It imports the core
# contract as `data_director`, whose FileInventory is the agent's input. After an edit, run
# `uv run dd-gen-schema agents/advisor-files/src/dd_agent_advisor_files/schema/files.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's sketch (docs/specs/agents.md), not a settled format.
id: https://w3id.org/data-director/agents/files
name: dd_agent_advisor_files
title: advisor.files classes
description: >-
  The File Archivist's assessment, in reply to a project's file inventory, of each file's format,
  described from its PRONOM record where it has one, and whether that format is open.
version: 0.6.0
license: MIT

prefixes:
  files: https://w3id.org/data-director/agents/files/
  linkml: https://w3id.org/linkml/
default_prefix: files
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  FormatAssessment:
    description: >-
      The payload of advisor.files: each file of the inventory with the format it is judged to
      be, and whether that format is open. It reads no file: it judges from the inventory and the
      PRONOM records of the identifiers the inventory gives.
    mixins:
      - Grounded
    slots:
      - schema_class
      - assessments
      - checks
      - summary
      - summary_derivation
      - limitations

  FileAssessment:
    description: >-
      One file of the inventory and the format it is judged to be. grounded_on cites the PRONOM
      record the format is described from, when judged_by is pronom, and is empty otherwise.
    mixins:
      - Grounded
    slots:
      - path
      - extension
      - format_name
      - media_type
      - open_format
      - judged_by
      - pronom_id

  FileCheck:
    description: >-
      A file a person should look at before deposit, and why, judged from names, size and digest
      in the inventory alone (dd_sdk.inventory_hints). A prompt for a person, never a finding
      about the file's contents, which are never read.
    slots:
      - path
      - kind
      - matched
      - question
      - related_paths

slots:

  assessments:
    range: FileAssessment
    multivalued: true
    inlined_as_list: true
  path:
    description: The file's path in the inventory (file_path).
    required: true
  extension:
    description: The file name's last extension, lower case and without the dot; empty if none.
    required: true
  format_name:
    description: >-
      The format the file is judged to be: its PRONOM record's name and version when judged_by is
      pronom, else the name formats.yaml gives, or unknown.
    required: true
  media_type:
    description: >-
      The format's media type, from the inventory if it gave one, else from the PRONOM record or
      formats.yaml.
  open_format:
    description: >-
      Whether the agent judges the format open, from formats.yaml (PRONOM does not say). Absent
      when the format is unknown or formats.yaml does not judge it.
    range: boolean
  judged_by:
    description: What the judgement rests on.
    range: JudgedBy
    required: true
  pronom_id:
    description: >-
      The PRONOM identifier (PUID) of the record the format is described from (the current one,
      where the inventory gave a deprecated identifier), or, when judged_by is pronom_unlisted,
      the first identifier the inventory gave. Absent when the inventory gave none.
  checks:
    description: >-
      The files a person should look at, in the inventory's order and, for each file, in the order
      of the rules in dd_sdk.inventory_hints. Empty when no name, size or digest called for one,
      which says nothing about what the files hold.
    range: FileCheck
    multivalued: true
    inlined_as_list: true
  kind:
    description: What the name, size or digest suggests.
    range: CheckKind
    required: true
  matched:
    description: >-
      The word of a folder, file or field name, or the file name, that called for the check;
      absent for an empty file or a duplicate.
  question:
    description: What a person should check, from dd_sdk.inventory_hints.
    required: true
  related_paths:
    description: For a duplicate, the paths of the other files with the same digest.
    multivalued: true
  summary:
    description: >-
      A short summary of the findings in plain language, for the researcher. It restates the
      findings and changes none of them.
  summary_derivation:
    description: >-
      How the summary came about: template, the rules' own summary, or model, where a model wrote
      it from the findings.
    range: Derivation
  limitations:
    description: What this agent does not yet do.
    multivalued: true

enums:

  JudgedBy:
    permissible_values:
      pronom:
        description: >-
          A PRONOM identifier the inventory gives, whose record in the pinned PRONOM release the
          format is described from.
      pronom_unlisted:
        description: >-
          The inventory gives PRONOM identifiers and the pinned PRONOM release has a record for
          none of them: the file is identified, but not described.
      media_type:
        description: The media type the inventory gives, which fido may have read from content.
      extension:
        description: The file name's extension; the inventory's media type was absent or unknown.
      nothing:
        description: >-
          The inventory gives no PRONOM identifier, and neither the media type nor the extension
          is in formats.yaml.

  CheckKind:
    permissible_values:
      free_text:
        description: A folder or file name suggests free text, such as notes, a diary or a transcript.
      coordinates:
        description: A table field name suggests coordinates or a location.
      third_party:
        description: A folder name suggests material from someone else.
      governance:
        description: A folder or file name suggests terms or an agreement.
      system_file:
        description: The file name is that of a file an operating system or program makes.
      credentials:
        description: >-
          The file name suggests configuration or credentials, which may hold passwords, keys or
          tokens.
      empty:
        description: The file is empty.
      duplicate:
        description: Another file in the inventory has the same digest.
      extension_mismatch:
        description: >-
          The file's PRONOM record does not list its extension, one that formats.yaml knows: its
          content-based identification and its name suggest different formats.
