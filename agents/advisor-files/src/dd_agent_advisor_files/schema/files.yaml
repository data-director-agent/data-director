# The payload class of advisor.files, owned by this package (docs/specs/contract.md). It imports the core
# contract as `data_director`, whose FileInventory is the agent's input. After an edit, run
# `uv run dd-gen-schema agents/advisor-files/src/dd_agent_advisor_files/schema/files.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are a mock's sketch (docs/specs/agents.md), not a settled format.
id: https://w3id.org/data-director/agents/files
name: dd_agent_advisor_files
title: advisor.files classes
description: >-
  The File Archivist's assessment, in reply to a project's file inventory, of whether each file's
  format is open.
version: 0.4.0
license: MIT

prefixes:
  files: https://w3id.org/data-director/agents/files/
  linkml: https://w3id.org/linkml/
default_prefix: files
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  FormatAssessment:
    description: >-
      The payload of advisor.files: each file of the inventory with the format it is judged to
      be, and whether that format is open. It judges from the inventory alone and reads no file.
    mixins:
      - Grounded
    slots:
      - schema_class
      - assessments
      - checks
      - limitations

  FileAssessment:
    description: One file of the inventory and the format it is judged to be.
    slots:
      - path
      - extension
      - format_name
      - media_type
      - open_format
      - judged_by
      - pronom_id

  FileCheck:
    description: >-
      A file a person should look at before deposit, and why, judged from names, size and digest
      in the inventory alone (hints.yaml). A prompt for a person, never a finding about the file's
      contents, which are never read.
    slots:
      - path
      - kind
      - matched
      - question
      - related_paths

slots:

  assessments:
    range: FileAssessment
    multivalued: true
    inlined_as_list: true
  path:
    description: The file's path in the inventory (file_path).
    required: true
  extension:
    description: The file name's last extension, lower case and without the dot; empty if none.
    required: true
  format_name:
    description: The format the file is judged to be, from formats.yaml, or unknown.
    required: true
  media_type:
    description: The format's media type, from the inventory if it gave one, else from formats.yaml.
  open_format:
    description: Whether formats.yaml records the format as open. False for an unknown format.
    range: boolean
    required: true
  judged_by:
    description: What the judgement rests on.
    range: JudgedBy
    required: true
  pronom_id:
    description: >-
      The PRONOM identifier (PUID) the judgement rests on, or, when judged_by is pronom_unlisted,
      the first identifier the inventory gave. Absent when the inventory gave none that was used.
  checks:
    description: >-
      The files a person should look at, in the inventory's order and, for each file, in the order
      of hints.yaml. Empty when no name, size or digest called for one, which says nothing about
      what the files hold.
    range: FileCheck
    multivalued: true
    inlined_as_list: true
  kind:
    description: What the name, size or digest suggests.
    range: CheckKind
    required: true
  matched:
    description: >-
      The word of a folder, file or field name, or the file name, that called for the check;
      absent for an empty file or a duplicate.
  question:
    description: What a person should check, from hints.yaml.
    required: true
  related_paths:
    description: For a duplicate, the paths of the other files with the same digest.
    multivalued: true
  limitations:
    description: What this agent does not yet do.
    multivalued: true

enums:

  JudgedBy:
    permissible_values:
      pronom:
        description: A PRONOM identifier the inventory gives, which is in formats.yaml.
      pronom_unlisted:
        description: >-
          The inventory gives PRONOM identifiers and none is in formats.yaml: the file is
          identified, but not as a format this table knows.
      media_type:
        description: The media type the inventory gives, which fido may have read from content.
      extension:
        description: The file name's extension; the inventory's media type was absent or unknown.
      nothing:
        description: Neither the media type nor the extension is in formats.yaml.

  CheckKind:
    permissible_values:
      free_text:
        description: A folder or file name suggests free text, such as notes, a diary or a transcript.
      coordinates:
        description: A table field name suggests coordinates or a location.
      third_party:
        description: A folder name suggests material from someone else.
      governance:
        description: A folder or file name suggests terms or an agreement.
      system_file:
        description: The file name is that of a file an operating system or program makes.
      empty:
        description: The file is empty.
      duplicate:
        description: Another file in the inventory has the same digest.
      extension_mismatch:
        description: >-
          The inventory's content-based identification and the file name's extension name
          different formats.
