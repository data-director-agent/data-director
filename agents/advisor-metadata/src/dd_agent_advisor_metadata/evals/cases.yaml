  # --- When the librarian must stop ------------------------------------------------------------
  - id: unknown-standard-repository
    # A repository asking for a standard no registered definition covers: the librarian maps
    # nothing between schemas (R6), so it says the capability is not implemented (TODO(#1363)).
    input:
      conforms_to: https://ddialliance.org/Specification/DDI-Codebook/2.5/
      files:
        - [README.md, text/markdown, 1840]
    expect:
      status: abstained
      reason_code: capability_not_implemented
  - id: no-repository-chosen
    input:
      no_repository: true
      files:
        - [README.md, text/markdown, 1840]
    expect:
      status: abstained
      reason_code: insufficient_input
  - id: readme-asked-for
    input:
      document_kind: readme
      files:
        - [README.md, text/markdown, 1840]
    expect:
      status: abstained
      reason_code: outside_agent_scope
