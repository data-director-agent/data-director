        - [data/sites.tsv, text/tab-separated-values, 2210, {fields: [[site, string], [latitude, number], [longitude, number]]}]
    expect:
      status: succeeded
      subjects: {"4106": Soil sciences, "4105": Pollution and contamination}
      asked: [titles, descriptions, subjects, rightsList, geoLocations]
      never_placed: [titles, descriptions, rightsList]
  - id: river-flow
