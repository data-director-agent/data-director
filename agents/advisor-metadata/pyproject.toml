[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-metadata"
version = "0.3.0a0"
description = "advisor.metadata: the Metadata Librarian persona (alpha)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "pydantic>=2.14.1,<3", "pyyaml>=6.0"]

[project.optional-dependencies]
# The evaluation in `evals/` (docs/specs/evaluation.md): it sends each case through the harness's
# conductor, through the workbench, and scores it with the workbench's Inspect AI scorers. The
# subject classifications server is served in process behind the harness's tool gateway.
eval = [
  "data-director-workbench[eval]",
  "data-director-harness[gateway]",
  "data-director-mcp-subjects",
]

[project.scripts]
dd-advisor-metadata = "dd_agent_advisor_metadata.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness[gateway]",
  # The subject classifications server, served in process behind the gateway in the tests.
  "data-director-mcp-subjects",
]

[tool.deptry.per_rule_ignores]
# Inspect AI comes with the workbench's `eval` extra, which the `eval` extra above names.
DEP003 = ["inspect_ai"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_metadata"]
