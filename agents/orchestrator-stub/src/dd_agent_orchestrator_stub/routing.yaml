# orchestrator.stub's routing rules. Tried in order against the whole message text, ignoring case.
#
#   name          identifies the rule in the reply and in tests
#   agent_id      the agent the message is delegated to
#   pattern       a Python regular expression; its named groups fill `input`
#   input         the child input document; "{group}" placeholders are filled from the match;
#                 it names a class of the target agent's own; the conductor checks it against
#                 the class schema that agent's card carries (docs/specs/contract.md)
#   mention_input the child input for "@<agent_id> <text>"; "{rest}" is the text
#   relay_field   the child payload field quoted in the reply, if the child succeeded
#   example       shown to the user when nothing matches
#
# A new agent is routable only once a rule names it. The model-backed orchestrator,
# orchestrator.model, routes from the harness's manifest instead (docs/specs/orchestration.md).
#
# entries: how a message names one of the Blueprint's three entry points (§8.1, docs/specs/orchestration.md), tried
# in order with re.search, ignoring case, after the rules above found nothing. A message that
# names one is answered with the steps from that entry, each with the agents whose manifest
# entry serves its requirement (dd_sdk.process_flow). Entry 1 is tried before Entry 2 so that
# "not yet collected" is not read as "collected".
#
# next: how a message asks what to do next, tried with re.search after the entries. The reply
# lists where the project is and offers the suggested step and a few others as choices; nothing
# stops the researcher choosing any step, or saying anything else (docs/specs/orchestration.md).
#
# steps: the input the stub sends when the researcher chooses a step, by step id: one or more
# input documents, each sent to the first agent whose manifest entry serves the step and accepts
# its class. The conductor fills each from the project (docs/specs/projects.md), so none needs
# the researcher's words. A step with agents but no template here is answered with how to ask
# them directly; a step with no agent is named as having none.
rules:
  - name: greet
    agent_id: example.hello
    pattern: '^(?:hello|hi|greet)\s+(?P<name>.+?)[.!]*$'
    input: { schema_class: Salutation, greeted_name: "{name}" }
    mention_input: { schema_class: Salutation, greeted_name: "{rest}" }
    relay_field: greeting_text
    example: hello Ada

  - name: standards
    agent_id: advisor.standards
    pattern: '^(?:recommend\s+)?standards\s+for\s+(?P<topic>.+?)[.?!]*$'
    input: { schema_class: DatasetProfile, title: "{topic}", keywords: ["{topic}"] }
    mention_input: { schema_class: DatasetProfile, title: "{rest}", keywords: ["{rest}"] }
    example: standards for soil chemistry

  - name: quality
    agent_id: advisor.quality
    pattern: '^review\s+(?:the\s+)?metadata\s+(?:for|of)\s+(?P<title>.+?)[.?!]*$'
    input: { schema_class: MetadataRecord, title: "{title}" }
    mention_input: { schema_class: MetadataRecord, title: "{rest}" }
    relay_field: score
    example: review metadata for Soil cores 2024

entries:
  - entry: 1
    pattern: '^(?:entry\s*)?1[.!]?$|before\s+(?:\w+\s+)?(?:data\s+)?collection|new\s+project|(?:not|n[''’]t)\s+(?:yet\s+)?(?:been\s+)?collected'
  - entry: 2
    pattern: '^(?:entry\s*)?2[.!]?$|\bcollected\b|prepar\w*\b.*\bfor\s+sharing'
  - entry: 3
    pattern: '^(?:entry\s*)?3[.!]?$|ready\s+to\s+(?:deposit|publish)'

next: '^\s*(?:what(?:[''’]s|\s+is)?\s+next|next(?:\s+step)?|what\s+now|continue|carry\s+on|where\s+(?:am\s+i|are\s+we|is\s+my\s+project))\b'

steps:
  preparation.files:
    - { schema_class: FileInventory }
  preparation.metadata:
    - { schema_class: DraftRequest, document_kind: metadata_record }
  preparation.documentation:
    - { schema_class: DraftRequest, document_kind: readme }
    - { schema_class: DraftRequest, document_kind: data_dictionary }
