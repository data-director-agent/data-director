[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-stub"
version = "0.1.0"
description = "stub.abstain: an agent that abstains unconditionally"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk"]

[project.scripts]
dd-stub = "dd_agent_stub.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_stub"]
