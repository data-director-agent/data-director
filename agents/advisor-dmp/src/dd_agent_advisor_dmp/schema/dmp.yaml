# The input and payload classes of advisor.dmp, owned by this package (docs/specs/contract.md). It imports the
# core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-dmp/src/dd_agent_advisor_dmp/schema/dmp.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's sketch (docs/specs/agents.md), not a settled format: the
# plan itself is read in the RDA DMP Common Standard later (#701, #284).
id: https://w3id.org/data-director/agents/dmp
name: dd_agent_advisor_dmp
title: advisor.dmp classes
description: >-
  What a data management plan committed to share and what the researcher now plans to share, and
  the Data Management Plan Checker's discrepancies in reply.
version: 0.1.0
license: MIT

prefixes:
  dmp: https://w3id.org/data-director/agents/dmp/
  linkml: https://w3id.org/linkml/
default_prefix: dmp
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  DmpCommitments:
    description: >-
      The outputs a data management plan committed to share, and the outputs the researcher plans
      to share at publication.
    slots:
      - schema_class
      - dmp_identifier
      - committed_outputs
      - planned_outputs

  SharingCommitment:
    description: One output to be shared, with where, how openly and under what licence.
    slots:
      - output
      - repository
      - access
      - licence

  DmpDiscrepancies:
    description: >-
      The payload of advisor.dmp: where the planned sharing differs from the plan's commitments,
      for a person to review (R8). It flags and never enforces; a reviewed decision not to share
      is a valid outcome.
    mixins:
      - Grounded
    slots:
      - schema_class
      - discrepancies
      - reconciled
      - dropped
      - limitations

  Discrepancy:
    description: >-
      One difference between what the plan committed to and what is planned. Found by rule
      (discrepancy_derivation lexical), or, for a renamed output, by a model pairing a committed
      output with a planned one (discrepancy_derivation model, with its reason). Either way it is
      for a person to review.
    slots:
      - output
      - aspect
      - committed
      - planned
      - message
      - discrepancy_derivation
      - reason

  Reconciliation:
    description: >-
      A difference the rules found in an aspect that a model judged to name the same thing, such
      as two spellings of one licence. It is shown, with the model's reason, so a person can see
      and overrule it, and is not counted as a discrepancy. Always found by a model.
    slots:
      - output
      - aspect
      - committed
      - planned
      - reason

slots:

  dmp_identifier:
    description: The data management plan's identifier, such as a DOI, if it has one.
  committed_outputs:
    description: What the data management plan committed to share.
    range: SharingCommitment
    multivalued: true
    inlined_as_list: true
  planned_outputs:
    description: What the researcher now plans to share at publication.
    range: SharingCommitment
    multivalued: true
    inlined_as_list: true
  output:
    description: The output, by name, such as a dataset or software.
    required: true
  repository:
    description: The repository the output is or will be deposited in.
  access:
    description: How openly the output is shared, e.g. open, restricted or closed.
  licence:
    description: The licence the output is shared under.
  discrepancies:
    range: Discrepancy
    multivalued: true
    inlined_as_list: true
  aspect:
    description: >-
      What differs: missing (committed, not planned), unplanned (planned, not committed), renamed
      (a committed output a model paired with a planned one of another name; committed and
      planned give the two names), repository, access or licence.
    required: true
  committed:
    description: What the plan committed to for this aspect, if anything.
  planned:
    description: What is planned for this aspect, if anything.
  message:
    description: The difference, said for a person to review.
    required: true
  discrepancy_derivation:
    description: >-
      How the discrepancy was found: lexical, by the agent's rule matching names and comparing
      text, or model, by a model pairing a renamed output.
    range: Derivation
    required: true
  reason:
    description: >-
      The model's short reason for a pairing or a reconciliation. Present exactly when a model
      found it.
  reconciled:
    description: >-
      Differences in repository, access or licence that a model judged to be the same thing,
      each with its reason, for a person to check. Empty when no model is configured.
    range: Reconciliation
    multivalued: true
    inlined_as_list: true
  dropped:
    description: >-
      What the model proposed that was not used, and why: a pairing or reconciliation naming
      something not in the input, or a second pairing for one output.
    multivalued: true
  limitations:
    description: What this checker does not yet do.
    multivalued: true
