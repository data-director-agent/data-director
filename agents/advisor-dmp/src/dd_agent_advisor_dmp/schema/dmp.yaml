# The input and payload classes of advisor.dmp, owned by this package (docs/specs/contract.md). It imports the
# core contract as `data_director`. After an edit, run
# `uv run dd-gen-schema agents/advisor-dmp/src/dd_agent_advisor_dmp/schema/dmp.yaml` to
# regenerate generated/, and keep ../classes.py in step; ClassSchema.of refuses a model that has
# drifted. These classes are an alpha's sketch (docs/specs/agents.md), not a settled format: the
# plan itself is read in the RDA DMP Common Standard later (#701, #284).
id: https://w3id.org/data-director/agents/dmp
name: dd_agent_advisor_dmp
title: advisor.dmp classes
description: >-
  What a data management plan committed to share and what the researcher now plans to share, a
  request to review an attached plan, and the Data Management Plan Checker's findings in reply.
version: 0.2.0
license: MIT

prefixes:
  dmp: https://w3id.org/data-director/agents/dmp/
  linkml: https://w3id.org/linkml/
default_prefix: dmp
default_range: string

imports:
  - linkml:types
  - data_director

classes:

  DmpCommitments:
    description: >-
      The outputs a data management plan committed to share, and the outputs the researcher plans
      to share at publication. In a project the conductor also gives the documents the researcher
      attached, from which the checker reads a plan's commitments for the researcher to confirm,
      and the facts people decided, among them the commitments they confirmed (#962).
    mixins:
      - GivenProjectDocuments
      - GivenProjectDecisions
    slots:
      - schema_class
      - dmp_identifier
      - committed_outputs
      - planned_outputs

  DmpReviewRequest:
    description: >-
      A request to review the data management plan the researcher attached (setup.dmp-review):
      which of the core requirements it covers, and where it disagrees with what people in the
      project decided. In a project the conductor gives the attached documents and the decided
      facts; outside one, the caller sends them.
    mixins:
      - GivenProjectDocuments
      - GivenProjectDecisions
    slots:
      - schema_class

  SharingCommitment:
    description: One output to be shared, with where, how openly and under what licence.
    slots:
      - output
      - repository
      - access
      - licence

  DmpDiscrepancies:
    description: >-
      The payload of advisor.dmp: where the planned sharing differs from the plan's commitments,
      for a person to review (R8). It flags and never enforces; a reviewed decision not to share
      is a valid outcome. Where it has read an attached plan and nobody has confirmed its
      commitments yet, it proposes each commitment as a project fact for the researcher to
      confirm, quoting the passage it rests on, and compares nothing until they do. A review of
      an attached plan (setup.dmp-review) fills section_findings and decision_conflicts instead.
    mixins:
      - Grounded
      - ProposesFacts
    slots:
      - schema_class
      - discrepancies
      - reconciled
      - section_findings
      - decision_conflicts
      - dropped
      - limitations

  Discrepancy:
    description: >-
      One difference between what the plan committed to and what is planned. Found by rule
      (discrepancy_derivation lexical), or, for a renamed output, by a model pairing a committed
      output with a planned one (discrepancy_derivation model, with its reason). Either way it is
      for a person to review.
    slots:
      - output
      - aspect
      - committed
      - planned
      - message
      - discrepancy_derivation
      - reason

  Reconciliation:
    description: >-
      A difference the rules found in an aspect that a model judged to name the same thing, such
      as two spellings of one licence. It is shown, with the model's reason, so a person can see
      and overrule it, and is not counted as a discrepancy. Always found by a model.
    slots:
      - output
      - aspect
      - committed
      - planned
      - reason

  SectionFinding:
    description: >-
      How the plan meets one core requirement: covered, vague or missing, with the plan's heading
      and words it rests on. The rules decide the finding from the plan's headings
      (finding_derivation lexical); a model may only raise it, from covered to vague, never lower
      it (finding_derivation model, with its reason). Either way it is for a person to judge.
    slots:
      - section
      - finding
      - plan_heading
      - quote
      - message
      - finding_derivation
      - reason

  DecisionConflict:
    description: >-
      A decision people in the project made that the plan does not reflect, such as a licence or
      repository it does not name, for a person to review: the plan may need updating, or the
      decision may. Found by rule.
    slots:
      - fact_kind
      - decided
      - message

slots:

  section_findings:
    description: For each core requirement of a data management plan, how the plan meets it.
    range: SectionFinding
    multivalued: true
    inlined_as_list: true
  decision_conflicts:
    description: The decisions people in the project made that the plan does not reflect.
    range: DecisionConflict
    multivalued: true
    inlined_as_list: true
  section:
    description: The core requirement, by its heading, such as Storage and backup during the project.
    required: true
  finding:
    description: >-
      covered (a heading of the plan names it, with text under it), vague (it has a heading but
      nothing, or too little, under it to answer its questions) or missing (no heading names it).
    required: true
  plan_heading:
    description: The plan's heading that names the requirement, if one does.
  quote:
    description: The plan's own words the finding rests on, found in its text.
  finding_derivation:
    description: >-
      How the finding was reached: lexical, by the rule reading the plan's headings, or model, by
      a model that read the plan as too vague to answer the requirement's questions.
    range: Derivation
    required: true
  decided:
    description: What people in the project decided, as recorded.
    required: true

  dmp_identifier:
    description: The data management plan's identifier, such as a DOI, if it has one.
  committed_outputs:
    description: What the data management plan committed to share.
    range: SharingCommitment
    multivalued: true
    inlined_as_list: true
  planned_outputs:
    description: What the researcher now plans to share at publication.
    range: SharingCommitment
    multivalued: true
    inlined_as_list: true
  output:
    description: The output, by name, such as a dataset or software.
    required: true
  repository:
    description: The repository the output is or will be deposited in.
  access:
    description: How openly the output is shared, e.g. open, restricted or closed.
  licence:
    description: The licence the output is shared under.
  discrepancies:
    range: Discrepancy
    multivalued: true
    inlined_as_list: true
  aspect:
    description: >-
      What differs: missing (committed, not planned), unplanned (planned, not committed), renamed
      (a committed output a model paired with a planned one of another name; committed and
      planned give the two names), repository, access or licence.
    required: true
  committed:
    description: What the plan committed to for this aspect, if anything.
  planned:
    description: What is planned for this aspect, if anything.
  message:
    description: The difference, said for a person to review.
    required: true
  discrepancy_derivation:
    description: >-
      How the discrepancy was found: lexical, by the agent's rule matching names and comparing
      text, or model, by a model pairing a renamed output.
    range: Derivation
    required: true
  reason:
    description: >-
      The model's short reason for a pairing or a reconciliation. Present exactly when a model
      found it.
  reconciled:
    description: >-
      Differences in repository, access or licence that a model judged to be the same thing,
      each with its reason, for a person to check. Empty when no model is configured.
    range: Reconciliation
    multivalued: true
    inlined_as_list: true
  dropped:
    description: >-
      What the model proposed that was not used, and why: a pairing or reconciliation naming
      something not in the input, or a second pairing for one output.
    multivalued: true
  limitations:
    description: What this checker does not yet do.
    multivalued: true
