[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-dmp"
version = "0.2.0a1"
description = "advisor.dmp: the Data Management Planner persona (alpha)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = [
  "data-director-dmp-template>=0.1.0a0",
  "data-director-sdk>=0.2.0a0",
  "pydantic>=2.14.1,<3",
]

[project.optional-dependencies]
# The evaluation in `evals/` (docs/specs/evaluation.md): it sends each case through the harness's
# conductor, through the workbench, and scores it with the workbench's Inspect AI scorers.
eval = ["data-director-workbench[eval]", "pyyaml>=6.0"]

[project.scripts]
dd-advisor-dmp = "dd_agent_advisor_dmp.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.deptry.per_rule_ignores]
# Inspect AI comes with the workbench's `eval` extra, which the `eval` extra above names.
DEP003 = ["inspect_ai"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_dmp"]
