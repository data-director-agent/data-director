[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-orchestrator-model"
version = "0.1.1-alpha.5"
description = "orchestrator.model: the model-backed Data Director orchestrator"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
# Every provider's adapter behind the SDK's model seam; the orchestrator imports neither package.
dependencies = [
  "data-director-sdk[anthropic,openai]>=0.2.0a0",
  # The subject classifications the discipline question suggests fields from (asking.py).
  "data-director-subjects>=0.1.0a0",
]

[project.scripts]
dd-orchestrator-model = "dd_agent_orchestrator_model.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-example-hello",
  "data-director-agent-advisor-standards",
  "data-director-agent-advisor-files",
  "data-director-agent-advisor-metadata",
  "data-director-agent-advisor-documentation",
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_orchestrator_model"]
