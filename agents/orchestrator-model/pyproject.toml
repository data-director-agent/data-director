[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-orchestrator-model"
version = "0.1.1-alpha"
description = "orchestrator.model: the model-backed Data Director orchestrator"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "anthropic>=1.15.0"]

[project.scripts]
dd-orchestrator-model = "dd_agent_orchestrator_model.factory:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-agent-example-hello",
  "data-director-agent-advisor-standards",
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_orchestrator_model"]
