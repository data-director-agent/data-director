# Written by hand, not recorded: one Messages API reply for the orchestrator, to a researcher who
# asks in chat to leave files out. vcrpy matches on method and URI, so the request body is not
# compared; the cassette shows the reply the system prompt asks for (#1171).
interactions:
- request:
    body: ''
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
  response:
    body:
      string: "{\"id\": \"msg_cassette_1\", \"type\": \"message\", \"role\": \"assistant\", \"model\": \"claude-sonnet-5-5\", \"content\": [{\"type\": \"text\", \"text\": \"I cannot change which files are in the dataset from this conversation. To leave out batch B1 (S1, S2 and images 1 to 3), untick those files in **Edit inventory**, beside the project's inventory. The drafts follow once they are unticked there.\"}], \"stop_reason\": \"end_turn\", \"stop_sequence\": null, \"usage\": {\"input_tokens\": 900, \"output_tokens\": 60, \"cache_read_input_tokens\": 0, \"cache_creation_input_tokens\": 0}}"
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
version: 1
