[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-orchestrator"
version = "0.1.1-alpha"
description = "orchestrator.model: the model-backed Data Director orchestrator"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk", "anthropic>=1.15.0"]

[project.scripts]
dd-orchestrator = "dd_agent_orchestrator.factory:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_orchestrator"]
