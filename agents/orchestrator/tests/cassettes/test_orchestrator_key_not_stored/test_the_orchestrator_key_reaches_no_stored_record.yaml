# Written by hand, not recorded: two Messages API replies for the orchestrator's tool loop, the
# first asking for hello.world and the second replying. vcrpy matches on method and URI, so the
# request headers and bodies below are not compared, and the two play back in order. A cassette
# recorded for real has its credential headers removed by `vcr_config` in the root conftest.py.
interactions:
- request:
    body: ''
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
  response:
    body:
      string: "{\"id\": \"msg_cassette_1\", \"type\": \"message\", \"role\": \"assistant\", \"model\": \"claude-sonnet-5-5\", \"content\": [{\"type\": \"thinking\", \"thinking\": \"\", \"signature\": \"sig-cassette\"}, {\"type\": \"tool_use\", \"id\": \"toolu_cassette\", \"name\": \"hello_world\", \"input\": {\"greeted_name\": \"Ada\"}}], \"stop_reason\": \"tool_use\", \"stop_sequence\": null, \"usage\": {\"input_tokens\": 900, \"output_tokens\": 40, \"cache_read_input_tokens\": 0, \"cache_creation_input_tokens\": 600}}"
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
- request:
    body: ''
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://api.anthropic.com/v1/messages?beta=true
  response:
    body:
      string: "{\"id\": \"msg_cassette_2\", \"type\": \"message\", \"role\": \"assistant\", \"model\": \"claude-sonnet-5-5\", \"content\": [{\"type\": \"text\", \"text\": \"The greeting agent says: Hello, Ada!\"}], \"stop_reason\": \"end_turn\", \"stop_sequence\": null, \"usage\": {\"input_tokens\": 80, \"output_tokens\": 12, \"cache_read_input_tokens\": 600, \"cache_creation_input_tokens\": 0}}"
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
version: 1
