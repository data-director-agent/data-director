# advisor.documentation's README template: the draft's sections, in order
# (docs/specs/drafting.md). A model, where one is configured, writes prose only for a section with
# a fact to draft from, and never in place of its `ask`.
#
# The sections are the common core of the research data README templates compared in #200:
# Cornell's Data README, Dryad's and the Borealis working group's minimum README. `ask` says what
# the researcher writes in the section, and the draft shows it as a placeholder. `from` names the
# project fact, or the list of facts in order, a section is drafted from:
#
#   files            the inventory's files, as a table of path, format and size
#   licences         the licences the chosen repository offers, for the researcher to choose from
#   record_general   the approved metadata record's title, creators and funders
#   record_abstract  the approved metadata record's abstract
#   record_rights    the licence the approved metadata record names
#   record_citation  a citation by the approved metadata record's creators, year and title
#
# A section drafted from a fact still shows its `ask`, for what the fact cannot say, unless the
# fact named by `complete_from` gives it: that fact says all the section asks.
#
# A section may list `parts` instead of one `ask`: each part is asked as a question of its own,
# with its own `label` and `ask`, and placed as a `- **label:** answer` line. A part with
# `given_by` is not asked when the approved metadata record gives it:
#
#   title     the record's title
#   creators  the record's creators
#   funding   the record's funders
- heading: General information
  from: record_general
  parts:
    - label: Title
      given_by: title
      ask: the dataset's title.
    - label: Principal investigator
      ask: name, institution, email and ORCID iD.
    - label: Contact
      ask: >-
        who answers questions about the data: name, institution, email and ORCID iD, or say it is
        the principal investigator.
    - label: Dates of data collection
      ask: when the data were collected, as YYYY-MM-DD to YYYY-MM-DD.
    - label: Geographic location
      ask: where the data were collected, or say it does not apply.
    - label: Funding
      given_by: funding
      ask: the funders and grant numbers.
- heading: Description
  from: record_abstract
  complete_from: record_abstract
  ask: what the dataset is, and what it is for.
- heading: Files
  from: files
  ask: how the files relate to one another, and any related data not included.
- heading: Methods
  ask: >-
    how the data were collected and processed; the software and instruments, with their versions;
    the standards, calibration and quality assurance applied.
- heading: Variables
  ask: >-
    where the data dictionary is, which describes each field's definition, type, unit and missing
    value codes; any abbreviations or coding conventions shared across the tables.
- heading: Access and licence
  from: [record_rights, licences]
  ask: the licence, any restrictions, related publications and other places the data are held.
- heading: How to cite
  from: record_citation
  ask: the recommended citation. The repository gives the DOI when the dataset is deposited.
- heading: Software requirements
  ask: anything needed to open or reuse the data.
