[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-advisor-documentation"
version = "0.2.0a1"
description = "advisor.documentation: the Documentation Editor, drafter of READMEs and data dictionaries"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "pyyaml>=6.0"]

[project.optional-dependencies]
# The SDK's Claude adapter, which `AnthropicWriter` calls through (dd_sdk.model_anthropic).
anthropic = ["data-director-sdk[anthropic]"]

[project.scripts]
dd-advisor-documentation = "dd_agent_advisor_documentation.factory:main"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_advisor_documentation"]
