[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-agent-policy"
version = "0.1.0-alpha"
description = "policy.advisor: checks funder, journal and institutional data policies from FAIRsharing"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
dependencies = ["data-director-sdk>=0.2.0a0", "httpx>=0.28", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]

[project.scripts]
dd-policy = "dd_agent_policy.factory:main"

# What this package's tests import from the workspace (ADR-0031, scripts/check_boundaries.py).
[dependency-groups]
dev = [
  "data-director-harness",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_agent_policy"]
