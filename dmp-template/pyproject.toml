[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-dmp-template"
version = "0.1.0-alpha.0"
description = "The Science Europe core requirements for a Data Management Plan, and a rule that finds which of them a plan's headings cover"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
keywords = ["data management plan", "dmp", "science europe", "research data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

# Framework-neutral (docs/specs/system.md): no workspace member is imported and nothing outside the
# standard library, so publishing this library on its own is a copy.
dependencies = []

[project.urls]
Homepage = "https://data-director-agent.github.io/data-director/"
Repository = "https://github.com/data-director-agent/data-director/tree/main/dmp-template"
Issues = "https://github.com/data-director-agent/data-director/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_dmp_template"]
