[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-director-inventory"
version = "0.1.0-alpha.4"
description = "Describe a dataset's files where they live: size, digest, PRONOM format and table fields, without uploading them"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Heffer", email = "j.heffer@sheffield.ac.uk" }]
keywords = ["research data", "inventory", "FAIR", "PRONOM", "checksum", "data management", "Frictionless"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: System :: Archiving",
  "Typing :: Typed",
]

# No workspace member: the command runs without the contract (docs/specs/system.md). What it
# writes is a core `FileInventory`, which the tests check against the contract's schema.
dependencies = [
  # fido 1.6.1's library defaults name a signature file its wheel does not ship; identify.py
  # reads the shipped versions.xml instead. Check that still holds before allowing a newer fido.
  "opf-fido==1.6.1",
  "frictionless>=5.18,<6",
]

[project.scripts]
dd-inventory = "dd_inventory.cli:main"
# So that `uvx data-director-inventory path/to/dataset` works: uvx runs the script named like the
# package.
data-director-inventory = "dd_inventory.cli:main"

[project.urls]
Homepage = "https://data-director-agent.github.io/data-director/"
Documentation = "https://data-director-agent.github.io/data-director/user-guide/making-an-inventory/"
Repository = "https://github.com/data-director-agent/data-director/tree/main/inventory"
Changelog = "https://github.com/data-director-agent/data-director/blob/main/inventory/CHANGELOG.md"
Issues = "https://github.com/data-director-agent/data-director/issues"

# What this package's tests import from the workspace (docs/specs/system.md, scripts/check_boundaries.py).
[dependency-groups]
dev = ["data-director-sdk"]

[tool.deptry.per_rule_ignores]
# `pyodide` is provided by the Pyodide runtime itself, not installed from PyPI (dd_inventory.scan.detect_runtime).
DEP001 = ["pyodide"]

[tool.hatch.build.targets.wheel]
packages = ["src/dd_inventory"]

# inventory/browser is the TypeScript package for the browser (its README); it is not part of the
# Python distribution.
[tool.hatch.build.targets.sdist]
exclude = ["browser"]
