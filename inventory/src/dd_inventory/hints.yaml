# What a person should look at before deposit, judged from names in the inventory alone (#449), read
# by `hints.py`: the File Archivist lists every hint, and the drafters leave out or ask about the
# files they mark (#1072). The inventory never holds file contents, so these are prompts for a
# person, never findings: a file with no check may still hold personal data, sensitive locations or
# someone else's material (docs/specs/personal-data.md). Kept in step with
# inventory/browser/src/hints.ts, which the app uses to mark the same files.
#
# Each kind is checked in this order. `words` are matched as whole lower-case words of the part
# named by `in`: `folders` (each folder in the path), `file` (the file name) or `fields` (a table's
# field names). `names` are whole file names, case ignored; `prefixes` begin a file name. `empty`
# and `duplicate` are judged from size and digest.

free_text:
  in: [folders, file]
  words: [notes, fieldnotes, fieldnote, diary, diaries, journal, notebook, logbook, interview,
          interviews, transcript, transcripts, consent, correspondence, email, emails, letters,
          minutes]
  question: >-
    Its name suggests free text, which often holds names, telephone numbers, access codes or
    instructions. Read it before it is shared, and decide whether to leave it out or share a
    redacted copy.

coordinates:
  in: [fields]
  words: [lat, lon, lng, latitude, longitude, easting, northing, eastings, northings,
          gridref, coord, coords, coordinates, gps, geom, geometry, location]
  question: >-
    A field name suggests coordinates or a location. Precise locations may expose people, private
    land or protected species: a person decides whether to publish, generalise or withhold them.

third_party:
  in: [folders]
  words: [reference, references, external, thirdparty, third, vendor, downloaded, purchased,
          licensed, bought, supplied]
  question: >-
    It is in a folder whose name suggests material from someone else, which may come under its own
    licence or terms. Check who holds the rights before it is included.

governance:
  in: [folders, file]
  words: [agreement, agreements, licence, license, licences, licenses, permission, permissions,
          contract, contracts, governance, dpa, dsa, nda, terms]
  question: >-
    Its name suggests terms or an agreement. Check what it allows and whether it is still in force
    before deposit.

system_file:
  names: [thumbs.db, desktop.ini, .ds_store, ehthumbs.db]
  prefixes: ["~$", "._"]
  question: >-
    Its name is that of a file an operating system or program makes for itself. It is rarely part
    of a dataset: leave it out unless it is.

empty:
  question: The file is empty. Leave it out, or find what it should hold.

duplicate:
  question: >-
    It has the same digest as another file, so the two are byte-for-byte copies. Keep one.
