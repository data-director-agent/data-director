name: Conformance review
description: Report a review of whether Data Director meets a Blueprint requirement, such as security, accessibility or the quality of its advice. No code needed.
title: "Review of <requirement>: "
type: Task
labels: ["blueprint"]
body:
  - type: markdown
    attributes:
      value: |
        Some requirements cannot be settled by an automated test and need a person's judgement:
        whether advice is appropriate, whether the interface is accessible, where data is kept.
        This form records such a review. A maintainer then adds it to the
        [review record](https://github.com/data-director-agent/data-director/blob/main/docs/reviews.yaml),
        and it appears in [CONFORMANCE.md](https://github.com/data-director-agent/data-director/blob/main/CONFORMANCE.md).
        [The conformance report](https://github.com/data-director-agent/data-director/blob/main/docs/conformance.md)
        explains how reviews are used.

        A review finds a requirement met or not met *within the scope you describe*. It is not a
        certification, and a finding of "not met" is as useful as one of "met".
  - type: input
    id: requirement
    attributes:
      label: Requirement
      description: |
        The identifier from the [requirements register](https://github.com/data-director-agent/data-director/blob/main/docs/requirements.yaml),
        for example C6 (accessibility) or R3 (standards recommendations). Review one requirement per issue.
      placeholder: C6
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      options:
        - Meets the requirement
        - Does not meet the requirement
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: Your name and affiliation, as they should appear in the record.
      placeholder: A. Reviewer (University of Example)
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date finished
      placeholder: "2026-10-01"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: What you reviewed
      description: |
        The commit, release or deployment you examined. If you used a running instance, give its
        address and the build shown at the foot of each page.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What you examined and how, in one or two sentences. This goes into the record as written.
      placeholder: The app's Run and History pages, tested against WCAG 2.1 AA with NVDA and keyboard only.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: What you found, with enough detail that someone else could check it. Attach notes or a report if you have one.
    validations:
      required: true
  - type: checkboxes
    id: instruction
    attributes:
      label: Recording the review
      description: Only the reviewer, or someone acting on the reviewer's written instruction, records a review.
      options:
        - label: I carried out this review, and I ask a maintainer to record it in the review record on my behalf, linking to this issue.
          required: true
