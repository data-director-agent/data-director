# Weekly version updates, grouped so that one pull request carries each ecosystem's minor and
# patch updates, and only for releases at least a week old, so a compromised release has time to
# be noticed and withdrawn. Security updates are separate and immediate (repository settings).
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local composite actions, which pin actions of their own.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # The shell and the libraries it links (inventory/browser, sdk/browser) share their tooling.
  - package-ecosystem: npm
    directories: [/app/web, /inventory/browser, /sdk/browser]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # typescript-eslint caps its typescript peer range below 6.1.0, so TypeScript 7 cannot be
    # installed with it. Lift this once a typescript-eslint release accepts TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # The base images in docker/ (development and release), pinned by digest, in one group.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The release copies a virtual environment built in the uv image into the Python image, so
    # both must have the same Python minor. The uv image names its Python in the tag prefix
    # (python3.14-…), which Dependabot cannot move, so a new Python minor moves by hand in both
    # images at once (#716 broke every script's interpreter by moving only one). Node majors
    # move by hand too: LTS only, with the node-version CI tests on (.github/workflows/ci.yml).
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
