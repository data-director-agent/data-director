name: Built sources
description: >-
  Build every source copy that agents build outside git (dd-sources prepare, sdk/src/dd_sdk/sources.py),
  keeping what they download in a cache keyed on their pins. Expects the workspace synced with uv.
runs:
  using: composite
  steps:
    # The key changes only when some source's pin does, so each pin is downloaded once: by the
    # `sources` job, which saves the cache that the jobs needing it then restore.
    - name: Key the cache on every source's pin
      id: key
      shell: bash
      run: echo "key=built-sources-$(uv run --no-sync dd-sources pins | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/sources
        key: ${{ steps.key.outputs.key }}
    - name: Prepare every built source
      shell: bash
      run: uv run --no-sync dd-sources prepare --cache-dir .cache/sources
