name: CI

# One workflow for the whole repository, ending in one job, "CI passed", that a ruleset can
# require. A workflow-level path filter would leave that required check waiting for a run that
# never starts, so the filter is per job instead: the "changes" job reads which files a pull
# request touches, the Python and app/web jobs run only when their side changed, and "CI passed"
# counts a skipped job as passed. Pushes to main, the merge queue and the weekly run always run
# every job. The cheap repository-wide jobs run on every pull request.
#
#   Python workspace (ADR-0011): Ruff, mypy, generated schemas, pytest with CONFORMANCE.md,
#     packages, the agents as real services, the workbench viewer in a browser (#9)
#   app/web (ADR-0024): ESLint, tsc, Vitest with coverage, Vite build, Playwright
#   Deployment: the NGINX reverse proxy in deploy/nginx, set up as install.sh does
#   Repository: links, citation file, workflows, sign-off, dependency review
#
# The weekly run catches what changes without a commit: the latest uv and Python 3.14 patch
# release, the runner image, a browser build, a newly published advisory (see audit.yml).
#
# .python-version holds uv to Python 3.14. Without it uv takes the newest CPython that
# requires-python allows, and on a release that few dependencies publish wheels for yet, every
# job spends more than a minute compiling them from source.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"  # every uv command refuses a uv.lock that pyproject.toml has moved past

jobs:
  # --- Which side of the repository a pull request touches ------------------------------------

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      # A pull request is checked out as GitHub's merge commit, whose first parent is the base
      # branch, so HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      # The rules err towards running a job. Anything under .github/ or in the Python toolchain
      # runs everything; app/ outside app/web runs both sides (app/tests writes
      # app/web/fixtures); prose (Markdown other than CONFORMANCE.md and the readmes that twine
      # checks, and the documentation site) runs neither; any other path is the Python
      # workspace's. scripts/ci_changes.sh holds the rules so that they can be tried locally.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | bash scripts/ci_changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'python=true\nweb=true\ndeploy=true\n' >> "$GITHUB_OUTPUT"
          fi

  # --- Python workspace: every step runs from the root, where the tooling config lives. ---------

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      # Ruff reads source, not imports: the development tools are enough, without the workspace.
      - run: uv sync --only-dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy and generated schemas
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - run: uv run mypy
      - run: uv run dd-gen-schema
      # The SHACL file is excluded: rdflib does not order blank nodes stably, so it is compared as
      # a graph by sdk/tests/test_contract.py instead.
      - run: git diff --exit-code -- 'sdk/src/dd_sdk/schema/generated/*.json'

  test:
    name: pytest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      # --record-mode=none --block-network come from pyproject addopts: no cassette, no call.
      # The JSON report is handed to the conformance job, which decides CONFORMANCE.md from it.
      # Coverage is measured over the same session (pyproject.toml, [tool.coverage]); the report
      # goes to the job summary, and one XML goes to Codecov, which splits it into a flag per
      # package (codecov.yml).
      # pytest-xdist spreads the session over the runner's cores. --dist loadfile keeps each test
      # module on one worker, so a module's fixtures and teardown run as they do serially; the
      # JSON report and coverage are merged from the workers into the one session.
      - run: >-
          uv run pytest -n auto --dist loadfile
          --json-report --json-report-file=.report.json --cov --cov-report=
      - name: Hand the test report to the conformance job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: .report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Coverage report
        run: |
          {
            echo '## Coverage'
            echo '```'
            uv run coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: uv run coverage xml -o coverage.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # A fork's pull request has no secret; the report in the job summary still shows.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: sdk,harness,workbench,app,agents
          fail_ci_if_error: false

  # CONFORMANCE.md is decided by the register, the review record, the report script and the outcome
  # of every requirement-marked test, so this job reads the report that `test` wrote. It runs even
  # when a test failed, so a stale file is reported beside the failure.
  conformance:
    name: CONFORMANCE.md is current
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-report
      - run: uv run python scripts/conformance_report.py --check --summary "$GITHUB_STEP_SUMMARY"

  packages:
    name: Packages and agents as services
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv build --all-packages --out-dir dist
      # Metadata errors only: --strict would also refuse a package without a readme, which
      # matters only once the packages are published.
      - run: uvx twine check dist/*
      # The workspace installs every member together; this installs each wheel on its own, with
      # the workspace's Python.
      - run: uv run python scripts/check_wheels.py dist
      # Then the agents as real services, from the workspace.
      - run: uv sync --all-packages --all-extras
      - run: uv run python scripts/smoke_agents.py

  viewer:
    name: Workbench viewer in a browser
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      # The browser matches the locked Playwright; the CDN modules come from the recorded HAR.
      # Headless runs need only chromium-headless-shell, not the full browser.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest workbench/browser_tests --tracing=retain-on-failure --output=test-results
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-traces
          path: test-results
          retention-days: 14

  # --- app/web: the browser shell (ADR-0024). --------------------------------------------------

  web:
    name: App shell (lint, types, unit, build, browser)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # ESLint (with jsx-a11y), tsc, Vitest with axe, and Playwright (axe in light and dark,
      # keyboard-only use, reflow at 320 CSS pixels). The fixtures it reads are kept current by
      # app/tests/test_app.py, which the test job runs. Vitest measures coverage as the pytest job
      # does: the report goes to the job summary, and lcov to Codecov under the `web` flag.
      - run: npm test -- --coverage
      - name: Coverage report
        run: |
          {
            echo '## Coverage (app/web)'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # A fork's pull request has no secret; the report in the job summary still shows.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
      - run: npm run build
      # Headless runs need only chromium-headless-shell, not the full browser.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/web/playwright-report
          retention-days: 14

  # --- Deployment: the way in from outside the VM (deploy/README.md). -----------------------------

  nginx:
    name: NGINX reverse proxy
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site as install.sh sets it up, without the packaged default site, in front of a
      # stand-in for the app and with a self-signed certificate in place of certbot's: the
      # redirect to HTTPS, TLS 1.3, HSTS, the password, the closed A2A routes, the headers.
      - run: sudo apt-get install -y -q nginx apache2-utils
      - run: sudo bash scripts/check_nginx.sh

  # --- Repository ------------------------------------------------------------------------------

  docs:
    name: Links and citation file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Relative links and their #fragments only: an external link that goes down is not a
      # defect in a pull request. docs/BLUEPRINT.md is external material, reproduced verbatim.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            --exclude-path docs/BLUEPRINT.md --exclude-path node_modules
            '**/*.md'
          fail: true
          jobSummary: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uvx cffconvert --validate --infile CITATION.cff
      # Each to-do marker names the issue that will resolve it (AGENTS.md, writing conventions).
      - run: uv run --no-project --python 3.14 scripts/check_todos.py

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint (with shellcheck) from its image; the tag is updated by hand.
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          persona: regular

  dco:
    name: Developer Certificate of Origin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Every commit in the pull request carries a Signed-off-by trailer naming its author
      # (`git commit -s`; CONTRIBUTING.md). A bot's commits are exempt: Dependabot signs off
      # with an address other than the one it commits from. So are release-please's release
      # commits, which it makes with a personal access token and cannot sign off.
      - name: Every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in *"[bot] <"*) continue ;; esac
            case "$(git log -1 --format=%s "$sha")" in "chore(main): release "*) continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha"): no 'Signed-off-by: $author'"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Sign off with 'git commit -s'; amend earlier commits with 'git rebase --signoff $BASE_SHA'."
          fi
          exit "$status"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Refuses a pull request that adds a dependency with a known advisory of moderate severity
      # or worse. TODO(#82): decide which dependency licences the project accepts, then deny the rest.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # --- The one check to require ----------------------------------------------------------------

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - test
      - conformance
      - packages
      - viewer
      - web
      - nginx
      - docs
      - workflows
      - dco
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job skipped by its own `if` (dco and dependency-review outside pull requests, a side
      # of the repository that a pull request does not touch) passes; a job that failed or was
      # cancelled does not.
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
