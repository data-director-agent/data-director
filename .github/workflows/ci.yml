name: CI

# One workflow for the whole repository, ending in one job, "CI passed", that a ruleset can
# require. A workflow-level path filter would leave that required check waiting for a run that
# never starts, so the filter is per job instead: the "changes" job reads which files a pull
# request touches, the Python and app/web jobs run only when their side changed, and "CI passed"
# counts a skipped job as passed. Pushes to main, the merge queue and the weekly run always run
# every job. The cheap repository-wide jobs run on every pull request.
#
#   Python workspace (docs/specs/agents.md): Ruff, mypy, generated schemas, architecture checks,
#     pytest with CONFORMANCE.md, packages, the agents as real services, the workbench viewer in a browser (#9)
#   app/web (docs/specs/app.md): ESLint, tsc and the Vite build; Vitest with coverage; Playwright,
#     as three jobs side by side so that the slowest, not their sum, sets how long the run takes
#   Deployment: the NGINX reverse proxy in deploy/nginx, set up as install.sh does, and the
#     systemd units in deploy/systemd
#   Repository: links, citation file, workflows, sign-off, dependency review
#
# The jobs that test the Python workspace do not wait for one another: each restores the built
# sources and the Playwright browser from the cache (.github/actions/), so the longest single job
# decides when "CI passed" reports. Each job installs only what it needs.
#
# The weekly run catches what changes without a commit: the latest uv and Python 3.14 patch
# release, the runner image, a browser build, a newly published advisory (see audit.yml).
#
# .python-version holds uv to Python 3.14. Without it uv takes the newest CPython that
# requires-python allows, and on a release that few dependencies publish wheels for yet, every
# job spends more than a minute compiling them from source.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"  # every uv command refuses a uv.lock that pyproject.toml has moved past

jobs:
  # --- Which side of the repository a pull request touches ------------------------------------

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      # A pull request is checked out as GitHub's merge commit, whose first parent is the base
      # branch, so HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The rules err towards running a job. Anything under .github/, the rules themselves or the
      # Python toolchain runs everything; app/ outside app/web runs both sides (app/tests writes
      # app/web/fixtures); prose (Markdown other than CONFORMANCE.md and the readmes that twine
      # checks, and the documentation site) runs neither; any other path is the Python
      # workspace's. scripts/ci_changes.sh holds the rules, which accessibility.yml and
      # codeql.yml share, so that they can be tried locally.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=off diff --name-only --no-renames HEAD^1 HEAD | bash scripts/ci_changes.sh >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci_changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  # --- Python workspace: every step runs from the root, where the tooling config lives. ---------

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      # Ruff reads source, not imports: the development tools are enough, without the workspace.
      - run: uv sync --only-dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy and generated schemas
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - run: uv run mypy
      # Each member declares the third-party packages it imports and imports those it declares
      # (docs/specs/dependencies.md). Needs the synced environment, so it runs here.
      - run: uv run python scripts/check_dependencies.py
      - run: uv run dd-gen-schema
      # The SHACL file is excluded: rdflib does not order blank nodes stably, so it is compared as
      # a graph by sdk/tests/test_contract.py instead.
      - run: git diff --exit-code -- 'sdk/src/dd_sdk/schema/generated/*.json'

  architecture:
    name: Architecture (import direction, boundaries)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      # Packages depend only in the direction docs/specs/system.md gives, directly or not.
      - run: uv run lint-imports
      # Each workspace member imports only what it declares and reads only its own files
      # (docs/specs/system.md). Known exceptions only shrink: a stale one fails.
      - run: uv run --no-project --python 3.14 scripts/check_boundaries.py
      # The VM and the Compose stack run every agent the app lists, on the port it expects
      # (deploy/README.md, docker/agents.yaml).
      - run: uv run python scripts/check_deploy.py
      # The canary: a planted violation of each kind must fail its check, so that a misconfigured
      # check cannot pass silently.
      - run: uv run pytest scripts/tests/test_architecture_canary.py scripts/tests/test_check_boundaries.py

  # Sources that agents build outside git, such as the repository advisor's re3data registry
  # (dd-sources, sdk/src/dd_sdk/sources.py). This job builds them and saves what they are built
  # from in the cache, keyed on every source's pin (Blueprint P14). The jobs that need the sources
  # do not wait for it: on the usual cache hit they build from the cache straight away. Only on
  # the first run after a pin changes do they each download it, at the same time as this job.
  sources:
    name: Built sources
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - uses: ./.github/actions/built-sources # zizmor: ignore[self-repository]

  test:
    name: pytest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      # Sources agents build outside git, from the cache the `sources` job filled.
      - uses: ./.github/actions/built-sources # zizmor: ignore[self-repository]
      # --record-mode=none --block-network come from pyproject addopts: no cassette, no call.
      # The JSON report is handed to the conformance job, which decides CONFORMANCE.md from it.
      # Coverage is measured over the same session (pyproject.toml, [tool.coverage]); the report
      # goes to the job summary, and one XML goes to Codecov, which splits it into a flag per
      # package (codecov.yml).
      # pytest-xdist spreads the session over the runner's cores (pyproject addopts); the JSON
      # report and coverage are merged from the workers into the one session. --durations lists
      # the slowest tests in the log, to show where the time goes.
      - run: >-
          uv run pytest --durations=20
          --json-report --json-report-file=.report.json --cov --cov-report=
      - name: Hand the test report to the conformance job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: .report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Coverage report
        run: |
          {
            echo '## Coverage'
            echo '```'
            uv run coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: uv run coverage xml -o coverage.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # A fork's pull request has no secret; the report in the job summary still shows.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: sdk,harness,workbench,app,agents,inventory
          fail_ci_if_error: false

  # CONFORMANCE.md is decided by the register, the review record, the report script and the outcome
  # of every requirement-marked test, so this job reads the report that `test` wrote. It runs even
  # when a test failed, so a stale file is reported beside the failure.
  # It is advisory for now: `ci-passed` does not need it, and a stale file is raised as a warning
  # annotation, so the job stays green and nothing blocks a pull request.
  # TODO(#458): decide how the file is kept current and require it again.
  conformance:
    name: CONFORMANCE.md is current
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-report
      - name: Check CONFORMANCE.md (warning only)
        run: |
          if ! uv run python scripts/conformance_report.py --check --summary "$GITHUB_STEP_SUMMARY"; then
            echo "::warning title=CONFORMANCE.md is out of date::Run scripts/conformance_report.py after pytest and commit the result (docs/conformance.md)."
          fi

  packages:
    name: Packages and agents as services
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv build --all-packages --out-dir dist
      # Metadata errors only: --strict would also refuse a package without a readme, which
      # matters only once the packages are published.
      - run: uvx twine check dist/*
      # The workspace installs every member together; this installs each wheel on its own, with
      # the workspace's Python.
      - run: uv run python scripts/check_wheels.py dist
      # Then the agents as real services, from the workspace.
      - run: uv sync --all-packages --all-extras
      # Sources agents build outside git, from the cache the `sources` job filled.
      - uses: ./.github/actions/built-sources # zizmor: ignore[self-repository]
      - run: uv run python scripts/smoke_agents.py

  viewer:
    name: Workbench viewer in a browser
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      # Sources agents build outside git, from the cache the `sources` job filled.
      - uses: ./.github/actions/built-sources # zizmor: ignore[self-repository]
      # The browser matches the locked Playwright; the CDN modules come from the recorded HAR.
      - uses: ./.github/actions/playwright # zizmor: ignore[self-repository]
        with:
          playwright: uv run playwright
      # The viewer's accessibility checks run in accessibility.yml.
      - run: >-
          uv run pytest workbench/browser_tests --tracing=retain-on-failure --output=test-results
          --ignore=workbench/browser_tests/test_viewer_accessibility.py
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-traces
          path: test-results
          retention-days: 14

  # --- app/web: the browser shell (docs/specs/app.md). --------------------------------------------------

  # Three jobs, side by side, each with its own `npm ci` from the npm cache. ESLint (with jsx-a11y),
  # tsc, Vitest with axe, and Playwright (axe in light and dark, keyboard-only use, reflow at 320
  # CSS pixels). The fixtures they read are kept current by app/tests/test_app.py, which the
  # pytest job runs.

  web-checks:
    name: App shell (lint, types, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/web/package-lock.json
            inventory/browser/package-lock.json
      # The inventory library the shell links (inventory/browser/README.md): its own lint, types
      # and tests. The shell compiles its source, so the shell's checks cover it as used.
      - name: Inventory library
        working-directory: inventory/browser
        run: npm ci && npm run lint && npm run typecheck && npm test -- --coverage
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  web-unit:
    name: App shell (Vitest)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      # Vitest measures coverage as the pytest job does: the report goes to the job summary, and
      # lcov to Codecov under the `web` flag.
      - run: npm test -- --coverage
      - name: Coverage report
        run: |
          {
            echo '## Coverage (app/web)'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        # A fork's pull request has no secret; the report in the job summary still shows.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

  web-e2e:
    name: App shell in a browser (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright # zizmor: ignore[self-repository]
        with:
          playwright: npx playwright
          working-directory: app/web
      # playwright.config.ts builds the shell before it serves it, so there is no build step here.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/web/playwright-report
          retention-days: 14

  # --- Deployment: the way in from outside the VM (deploy/README.md). -----------------------------

  nginx:
    name: NGINX reverse proxy
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site as install.sh sets it up, without the packaged default site, in front of
      # stand-ins for the app and the workbench and with a self-signed certificate in place of
      # certbot's: the redirect to HTTPS, TLS 1.3, HSTS, no password, the closed A2A routes, the
      # headers, and port 8443 reaching the workbench.
      - run: sudo apt-get update -q && scripts/retry.sh sudo apt-get install -y -q nginx
      - run: sudo bash scripts/check_nginx.sh

  systemd:
    name: systemd units
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # systemd-analyze verify over deploy/systemd, against a throwaway root that stands in for
      # /opt/data-director/current and the service user: bad directives and values, missing units
      # and executables. Then systemdlint, whose findings must be in deploy/systemd-lint-baseline.txt.
      - run: bash scripts/check_systemd.sh

  # --- Repository ------------------------------------------------------------------------------

  docs:
    name: Links and citation file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for check_citation.py.
          fetch-depth: 0
      # Relative links and their #fragments only: an external link that goes down is not a
      # defect in a pull request. This covers docs/blueprint/, whose cross-references are links.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            --exclude-path node_modules
            '**/*.md'
          fail: true
          jobSummary: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx cffconvert --validate --infile CITATION.cff
      # Everyone who authors or co-authors a commit is cited (CONTRIBUTING.md, Credit).
      - run: uv run --python 3.14 scripts/check_citation.py
      # Each to-do marker names the issue that will resolve it (AGENTS.md, "Writing").
      - run: uv run --no-project --python 3.14 scripts/check_todos.py
      # Both sources.yaml files pin the re3data registry that the repository advisor's manifest
      # pins (agents/advisor-repository/README.md, "Sources").
      - run: uv run --no-project --python 3.14 scripts/pin_re3data.py --check

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint (with shellcheck) from its image; the tag is updated by hand.
      - run: scripts/retry.sh docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: regular
      # "CI passed" and "Accessibility passed" must wait for every job in their workflow.
      - run: python3 scripts/check_ci_gate.py

  dco:
    name: Developer Certificate of Origin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Every commit in the pull request carries a Signed-off-by trailer naming its author
      # (`git commit -s`; CONTRIBUTING.md), and none is signed off by a coding agent: only a human
      # can approve a commit, an agent may co-author it (scripts/check_signoff.py). A bot's
      # commits are exempt: Dependabot signs off with an address other than the one it commits
      # from. So are release-please's release commits, which it makes with a personal access
      # token and cannot sign off. A bot that is itself an agent is not exempt.
      - name: Every commit is signed off by a human
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_signoff.py "$BASE_SHA" "$HEAD_SHA" \
            | while IFS= read -r line; do echo "::error::$line"; done
          exit "${PIPESTATUS[0]}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Refuses a pull request that adds a dependency with a known advisory of moderate severity
      # or worse. TODO(#82): decide which dependency licences the project accepts, then deny the rest.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # --- The one check to require ----------------------------------------------------------------

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - architecture
      - sources
      - test
      - packages
      - viewer
      - web-checks
      - web-unit
      - web-e2e
      - nginx
      - systemd
      - docs
      - workflows
      - dco
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job skipped by its own `if` (dco and dependency-review outside pull requests, a side
      # of the repository that a pull request does not touch) passes; a job that failed or was
      # cancelled does not.
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
