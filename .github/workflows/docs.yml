name: Docs

# Publishes the documentation site (mkdocs.yml, docs/hooks.py, docs/guide/ and the Markdown it
# publishes) to GitHub Pages when main changes. Pages must use the "GitHub Actions" source. A pull
# request that touches the site builds it in accessibility.yml, which runs the same strict build
# before checking it, so this workflow does not run on pull requests.
on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - docs/hooks.py
      - docs/hooks_inventory.py
      - inventory/browser/src/making.json
      - docs/guide/**
      - "**/*.md"
      - .github/workflows/docs.yml
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # page dates come from git history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv run --locked --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
