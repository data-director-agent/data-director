name: Docs

# Builds the documentation site (mkdocs.yml, docs/guide/) on every pull request that touches it,
# and publishes it to GitHub Pages when main changes. Pages must use the "GitHub Actions" source.
on:
  pull_request:
    paths: [mkdocs.yml, "docs/guide/**", .github/workflows/docs.yml, pyproject.toml, uv.lock]
  push:
    branches: [main]
    paths: [mkdocs.yml, "docs/guide/**", .github/workflows/docs.yml, pyproject.toml, uv.lock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv run --locked --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
