name: release-please

# Each package is versioned on its own (release-please-config.json). Conventional commits that
# touch a package's directory decide its next version; release-please keeps one release PR open
# per package and tags `<component>-v<version>` when that PR is merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.release.outputs.prs }}
    steps:
      # A token other than GITHUB_TOKEN, so that CI runs on the release PRs it opens.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please edits each pyproject.toml but cannot regenerate uv.lock, which records the
  # workspace members' versions. Refresh it on every release PR branch.
  refresh-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.pr.headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - name: Commit the lock file
        run: |
          if git diff --quiet uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -s -m "chore: refresh uv.lock for release"
          git push
