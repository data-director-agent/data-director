name: Benchmark

# A first benchmark of the harness over the PostgreSQL run store (harness/scripts/bench_postgres.py,
# docs/specs/evaluation.md "Benchmark"): an invocation's latency, reads in a store of 1,000 and
# 20,000 runs, and runs per second with 1, 2, 4 and 8 concurrent writers, for Blueprint C10
# (performance) and C11 (scalability).
#
# The figures go to the job summary and an artefact, never to CONFORMANCE.md: they vary from run to
# run and from runner to runner, there is no budget to hold them to, and the Blueprint assesses C10
# and C11 at deployment. So the job fails only if the benchmark cannot run, and it is not part of
# any required check. Weekly, so a trend shows, and on demand.
on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  postgres:
    name: PostgreSQL benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The same throwaway database as ci.yml's pytest job: the password reaches libpq through
    # PGPASSWORD, never the URL, and guards a container only this job can reach.
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: dd-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DD_TEST_POSTGRES: postgresql://postgres@localhost:5432/postgres
      PGPASSWORD: dd-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - name: Run the benchmark
        run: >-
          uv run python harness/scripts/bench_postgres.py
          --json bench-postgres.json --markdown bench-postgres.md
      - name: Report it in the job summary
        run: cat bench-postgres.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-postgres
          path: bench-postgres.json
          if-no-files-found: error
          retention-days: 90
