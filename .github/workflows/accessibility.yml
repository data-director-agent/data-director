name: Accessibility

# What people read and use, checked against WCAG 2.2 AA in a browser: axe-core with the rule tags
# wcag2a, wcag2aa, wcag21a, wcag21aa and wcag22aa, and reflow at 320 CSS pixels (WCAG 1.4.10).
# docs/ui/best-practices.md says why; automated checks find perhaps a third of the barriers, so
# they do not replace testing with assistive technology and with the people who use it (#74).
#
#   Documentation site: every page mkdocs builds, by scripts/check_site_accessibility.py (#429)
#   Workbench viewer: Chat, Inspect, the Glossary and the Agents page, light and dark, by
#     workbench/browser_tests/test_viewer_accessibility.py (#85)
#
# The app shell's checks (jsx-a11y, jest-axe, and Playwright with axe, keyboard-only use and
# reflow) stay in ci.yml's "App shell" job, because they share their specs with its behaviour.
#
# As in ci.yml, the path filter is per job, so that "Accessibility passed" can be a required check:
# a pull request checks the site when it touches the site and the viewer when it touches the Python
# workspace (scripts/ci_changes.sh), and "Accessibility passed" counts a skipped job as passed.
# Pushes to main, the merge queue and the weekly run always run every job. The weekly run catches
# what changes without a commit: the theme, axe-core and the browser.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      # The script, and in a pull request the merge commit's first parent, so that HEAD^1..HEAD
      # is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=off diff --name-only --no-renames HEAD^1 HEAD | bash scripts/ci_changes.sh >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci_changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  # A pull request builds the site here, not in docs.yml, which publishes it from main.
  site:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      # The site as docs.yml builds and publishes it.
      - run: uv run --only-group docs mkdocs build --strict
      # Headless runs need only chromium-headless-shell, not the full browser.
      - run: scripts/retry.sh uv run --only-group accessibility playwright install --with-deps --only-shell chromium
      - run: >-
          uv run --only-group docs --only-group accessibility
          scripts/check_site_accessibility.py site --summary "$GITHUB_STEP_SUMMARY"

  viewer:
    name: Workbench viewer
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --all-extras
      - run: scripts/retry.sh uv run playwright install --with-deps --only-shell chromium
      - run: >-
          uv run pytest workbench/browser_tests/test_viewer_accessibility.py
          --tracing=retain-on-failure --output=test-results
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-accessibility-traces
          path: test-results
          retention-days: 14

  # --- The one check to require ----------------------------------------------------------------

  accessibility-passed:
    name: Accessibility passed
    if: always()
    needs: [changes, site, viewer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job skipped because a pull request does not touch what it checks passes; a job that
      # failed or was cancelled does not.
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
