name: workbench CI

# Covers the uv workspace at the repository root (ADR-0011): sdk/, workbench/ and agents/. Every
# step runs from the root, where the shared tooling config and the dev dependency group live.
on:
  push:
    branches: [main]
    paths: &paths
      - "sdk/**"
      - "workbench/**"
      - "agents/**"
      - "pyproject.toml"
      - "uv.lock"
      - "conftest.py"
      - ".github/workflows/workbench-ci.yml"
  pull_request:
    paths: *paths

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras
      - run: uv run mypy

  test:
    name: pytest (no network) + conformance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras
      # --record-mode=none --block-network come from pyproject addopts: no cassette, no call.
      - run: uv run pytest --json-report --json-report-file=workbench/.report.json
      - name: CONFORMANCE.md is current
        run: uv run python workbench/scripts/conformance_report.py --check --summary "$GITHUB_STEP_SUMMARY"

  schemas:
    name: Generated schemas up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --all-extras
      - run: uv run python sdk/scripts/gen_schema.py
      # The SHACL file is excluded: rdflib does not order blank nodes stably, so it is compared as
      # a graph by sdk/tests/test_contract.py instead.
      - run: git diff --exit-code -- 'sdk/src/dd_sdk/schema/generated/*.json'
