name: workbench CI

# Scoped to experiments/workbench/: GitHub only picks up workflows from .github/workflows/ at the
# repository root, so this file lives here even though the project it tests lives entirely under
# experiments/workbench/.
on:
  push:
    branches: [main]
    paths:
      - "experiments/workbench/**"
      - ".github/workflows/workbench-ci.yml"
  pull_request:
    paths:
      - "experiments/workbench/**"
      - ".github/workflows/workbench-ci.yml"

defaults:
  run:
    working-directory: experiments/workbench

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "experiments/workbench/pyproject.toml"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "experiments/workbench/pyproject.toml"
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    name: pytest (no network) + conformance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "experiments/workbench/pyproject.toml"
      - run: uv sync --all-extras
      # --record-mode=none --block-network come from pyproject addopts: no cassette, no call.
      - run: uv run pytest --json-report --json-report-file=.report.json
      - name: CONFORMANCE.md is current
        run: uv run python scripts/conformance_report.py --check

  schemas:
    name: Generated schemas up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "experiments/workbench/pyproject.toml"
      - run: uv sync --all-extras
      - run: uv run python scripts/gen_schema.py
      # The SHACL file is excluded: rdflib does not order blank nodes stably, so it is compared as
      # a graph by tests/test_contract.py instead.
      - run: git diff --exit-code -- schema/generated/*.json
