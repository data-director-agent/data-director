name: app shell CI

# The browser shell in app/web (ADR-0024): ESLint (with jsx-a11y), tsc, Vitest with axe, and
# Playwright (axe in light and dark, keyboard-only use, reflow at 320 CSS pixels). The fixtures
# it reads are kept current by app/tests/test_app.py, which workbench-ci.yml runs.
on:
  push:
    branches: [main]
    paths: &paths
      - "app/web/**"
      - ".github/workflows/app-web-ci.yml"
  pull_request:
    paths: *paths

defaults:
  run:
    working-directory: app/web

jobs:
  check:
    name: Lint, types, unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/web/playwright-report
