# What this instance runs. Change it with `sudo data-director edit` on a VM or
# `uv run scripts/dd.py edit` in development, which check it before saving it and then offer to
# apply it: `apply` writes the profile and, on a VM, the systemd units from it
# (docs/guide/operations/configuration.md). Agent settings stay in agents/<name>.env and secrets
# in credentials/.

# Names the instance and the profile generated for it: lower-case words joined by hyphens.
name: local

# The agent the home page converses with: `stub` (rule-based, no model) or `model` (writes its
# replies with a model, and needs a key first: `secret set orchestrator-model anthropic-api-key`).
orchestrator: stub

# Agents in app/config/agents.yaml not to run, by name, such as advisor-policy.
disabled: []

# Where your institution's privacy notice for this instance is, an https address. The app links to
# it from every page's footer. Unset, the footer has no link. The app holds people's names, ORCID
# iDs, conversations and projects for you, so you owe them a notice of your own; the project's
# does not cover an instance (docs/guide/operations/privacy.md).
# privacy_notice: https://example.ac.uk/data-director/privacy

# Whether the Linking Adviser resolves DOIs, ORCID iDs and ROR ids through the PID resolver, which
# asks DataCite, Crossref, ORCID and ROR, sending only the identifiers (mcp-pid/README.md). Off,
# it checks their form only. Development only for now: `dd.py start` (or Docker Compose) runs the
# server, and `apply` refuses it on a VM.
# pid_resolver: true

# Your institution's own data repositories, offered to its researchers and suggested first on a
# project's page, copied into the profile as written. Name each by its identifier in the registry
# that lists it: its re3data identifier (r3d followed by nine digits), or, for one re3data does not
# list, its DataCite repository identifier (search https://api.datacite.org/repositories?query=…).
# Add only what no registry holds and you vouch for; a repository that neither registry, as
# pinned, holds stops start-up (docs/guide/operations/configuration.md).
# institution_repositories:
#   - repository_id: r3d100012124        # ORDA, the University of Sheffield's
#     institution_name: The University of Sheffield
#     institution_ror: https://ror.org/05krs5044
#     charges_deposit_fee: false
#     guidance: [https://www.sheffield.ac.uk/library/research-data-management]

# Your institution's storage for data while a project runs, recommended by the storage adviser,
# offered to a Data Management Plan's storage question, and copied into the profile as written. No
# registry lists it, so name each service by your own label and add only what you vouch for; a
# service not marked approved_for_sensitive is never offered for personal data
# (docs/guide/operations/configuration.md). These two are examples, at example.ac.uk: replace them
# with your institution's own services before researchers use this instance, or delete the key.
institution_storage:
  - storage_id: research-filestore
    storage_name: Research filestore
    storage_kind: institutional_filestore
    approved_for_sensitive: true
    allows_external_collaborators: false
    allowance_gb: 10000
    charges_for_storage: false
    storage_backup: Nightly snapshots replicated to a second site
    guidance: [https://example.ac.uk/research-storage]
  - storage_id: cloud-drive
    storage_name: Cloud drive
    storage_kind: institutional_cloud
    approved_for_sensitive: false
    allows_external_collaborators: true
    allowance_gb: 1000
    charges_for_storage: false
    storage_backup: Deleted files kept for 30 days
    guidance: [https://example.ac.uk/cloud-drive]

# Who administers this instance, each by their ORCID iD as a URL, copied into the profile as written.
# A deployed workbench admits them and no one else, and does not run without one. Being an
# administrator gives no access to anyone's project (docs/guide/steward-guide/becoming-a-steward.md).
# administrators:
#   - https://orcid.org/0000-0002-1825-0097

# The instance's data steward teams, copied into the profile as written: who receives the matters
# researchers raise. Leave it out and the instance has no stewards; a researcher who asks for one
# is told so. Every key is explained in docs/guide/operations/configuration.md, "Data steward teams".
# stewardship:
#   visibility: escalated         # escalated (the default) or scope: which projects a steward may open
#   reroute_after: P3D            # send an escalation nobody has taken to its team again (P3D, PT48H)
#   teams:
#     - id: library-rdm           # lower-case words joined by hyphens; unique
#       name: Library Research Data Team       # what researchers are shown
#       members:                  # at least one, by ORCID iD as a URL
#         - https://orcid.org/0000-0002-1825-0097
#       supports: [faculty-of-science]         # labels of the projects it supports
#       contact: https://example.ac.uk/research-data/contact   # shown when no steward can help
#       response_time: 3 working days          # what a researcher is told to expect
#       notify: rdm-helpdesk@example.ac.uk     # emailed about each escalation; needs DD_SMTP_URL
#       notify_on: [opened, rerouted, replied, withdrawn, reopened]   # the default: all five

# Whether people may pay for model calls with their own AI provider account, copied into the
# profile as written. Leave it out and the deployment pays. It needs the model broker and the
# grant secrets first (docs/guide/operations/model-broker.md); the app stops at start-up without
# them. Choices: workbench/profiles/README.md, "People's own model accounts".
# Every agent that calls a model must then call through the broker (DD_MODEL_BROKER_URL in its
# settings); apply marks each in the app's agent list, and refuses an agent that does not.
# model_accounts:
#   own: allowed             # off, allowed or required
#   fallback: deployment     # deployment or none
#   providers:
#     - provider: anthropic
